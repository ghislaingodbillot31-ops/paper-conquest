<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Villageois</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14212b; --bar:#1d2d3a; --ink:#e9e4d3; --soft:#9fb0bb; --on:#d9b25f; }
  * { box-sizing:border-box }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:500 14px/1.3 system-ui, sans-serif }
  body { display:flex }
  #liste { flex:1; min-width:0; overflow:auto }
  header { padding:18px 24px 4px }
  h1 { margin:0; font:700 30px "Barlow Condensed", sans-serif; letter-spacing:.04em }
  header p { margin:4px 0 0; color:var(--soft) }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; padding:18px 24px 24px }
  figure { margin:0; background:#d9c79a; border:2px solid #b9a98a; border-radius:10px; overflow:hidden; color:#2f2a24; text-align:center; cursor:pointer; position:relative }
  figure:hover { border-color:var(--on) }
  figure.on { border-color:#d64541; box-shadow:0 0 0 2px #d6454188 }
  figure.modif::after { content:"modifié"; position:absolute; top:6px; right:8px; font-size:11px; color:#7a2a10; font-weight:700 }
  canvas { display:block; width:100%; height:auto; aspect-ratio:1 }
  figcaption { padding:0 6px 8px; background:#f6efdc }
  figcaption b { display:block; padding-top:5px; font:700 21px "Barlow Condensed", sans-serif }
  figcaption span { color:#6b5f4a; font-size:12px }
  #editeur { width:360px; flex:none; background:var(--bar); border-left:1px solid #0006; overflow:auto; padding:14px 16px 30px }
  #editeur h3 { margin:0 0 8px; font:700 26px "Barlow Condensed", sans-serif; letter-spacing:.04em }
  #apercu { width:100%; height:auto; background:#d9c79a; border-radius:10px; display:block }
  #aide { color:var(--soft); margin:6px 0 0 }
  details { margin-top:10px; border-top:1px solid #ffffff18; padding-top:6px }
  summary { cursor:pointer; color:var(--on); font-weight:700; padding:4px 0 }
  .ligne { display:grid; grid-template-columns:130px 1fr 44px; align-items:center; gap:8px; margin:5px 0 }
  .ligne label { color:var(--soft) }
  .ligne input[type=range] { width:100%; accent-color:var(--on) }
  .ligne output { text-align:right; font-size:12px }
  .ligne input[type=color] { width:44px; height:26px; padding:0; border:1px solid #fff3; background:none; border-radius:4px }
  .ligne.c { grid-template-columns:130px 44px 1fr }
  .ligne select { grid-column:2 / 4; background:#0003; color:var(--ink); border:1px solid #fff3; border-radius:5px; padding:4px }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px }
  button { background:#0004; color:var(--ink); border:1px solid #fff3; border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer }
  button:hover { border-color:var(--on); color:var(--on) }
  #msg { color:var(--on); margin-top:8px; min-height:18px }
  @media (max-width:900px) { body { flex-direction:column } #editeur { width:auto; border-left:0; border-top:1px solid #0006 } }
</style>
<div id="liste">
  <header><h1>Villageois</h1><p id="total"></p><p>Clique un villageois pour le modifier : tenue, couvre-chef, outil. Les réglages sont enregistrés dans ce navigateur et utilisés par la carte (chaque travailleur prend le dessin de son métier).</p></header>
  <main class="grille" id="main"></main>
</div>
<aside id="editeur"><p id="aide">Choisis un villageois dans la liste.</p></aside>
<script src="js/carte/villageois.js"></script>
<script>
/* Tous les types de villageois côte à côte (peintVillageois, js/carte/villageois.js) + un éditeur de réglages (clé villageois.v1). Face vers le bas, comme les animaux. */
const W0 = 220, dpr = Math.max(2, window.devicePixelRatio || 1), PW = 320;
let ctx;
const cartes = {}; let choisi = null;
const modifie = k => JSON.stringify(VILLAGEOIS[k]) !== JSON.stringify(VILLAGEOIS_DEFAUT[k]);
function peint(k, cv, w, h, L) { ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h); peintVillageois(k, w / 2, h / 2 - L * .4, L, Math.PI / 2); }
const taille = k => 80 * VILLAGEOIS[k].T / .55;                       // un enfant est plus petit qu'un forgeron
function sauve() { const o = {}; for (const k in VILLAGEOIS) if (modifie(k)) o[k] = VILLAGEOIS[k]; try { localStorage.setItem('villageois.v1', JSON.stringify(o)); } catch (e) {} }
function rafraichit(k) { peint(k, cartes[k].cv, W0, W0, taille(k)); cartes[k].fig.classList.toggle('modif', modifie(k)); if (choisi === k) peint(k, document.getElementById('apercu'), PW, PW, 150 * VILLAGEOIS[k].T / .55); sauve(); }
for (const k of Object.keys(VILLAGEOIS)) {
  const a = VILLAGEOIS[k], fig = document.createElement('figure'), cv = document.createElement('canvas');
  cv.width = cv.height = W0 * dpr; fig.append(cv); fig.insertAdjacentHTML('beforeend', `<figcaption><b>${a.nom}</b><span>${a.metier}</span></figcaption>`);
  document.getElementById('main').append(fig); cartes[k] = { fig, cv }; fig.addEventListener('click', () => choisis(k)); peint(k, cv, W0, W0, taille(k)); fig.classList.toggle('modif', modifie(k));
}
document.getElementById('total').textContent = Object.keys(VILLAGEOIS).length + ' types · vus de dessus';
const CHAPEAUX = ['aucun', 'paille', 'bonnet', 'casque', 'toque', 'feutre', 'capuche', 'foulard', 'couronne'], OUTILS = ['aucun', 'fourche', 'hache', 'pioche', 'marteau', 'canne', 'houlette', 'lance', 'panier', 'pain', 'rabot', 'arc', 'seau'];
const SCHEMA = [
  ['Corps', [['r', 'T', 'Largeur d\'épaules (m)', .3, .8, .01], ['c', 'corps', 'Tenue'], ['c', 'peau', 'Peau'], ['c', 'cheveux', 'Cheveux'], ['c', 'tablier', 'Tablier'], ['c', 'sac', 'Sac dans le dos']]],
  ['Couvre-chef', [['s', 'chapeau.f', 'Forme', CHAPEAUX], ['c', 'chapeau.c', 'Couleur']]],
  ['Outil', [['s', 'outil.f', 'Outil', OUTILS], ['c', 'outil.c', 'Couleur (pain, etc.)']]],
];
const get = (a, p) => p.split('.').reduce((o, k) => o && o[k], a), set = (a, p, v) => { const ks = p.split('.'); const last = ks.pop(); const o = ks.reduce((o, k) => o[k], a); if (v === '' || v == null) delete o[last]; else o[last] = v; };
function champ(k, [t, key, nom, x, y, pas]) {
  const a = VILLAGEOIS[k], div = document.createElement('div'), maj = v => { set(a, key, v); rafraichit(k); };
  if (t === 'r') { const v = get(a, key); div.className = 'ligne'; div.innerHTML = `<label>${nom}</label><input type="range" min="${x}" max="${y}" step="${pas}" value="${v}"><output>${v}</output>`;
    const i = div.querySelector('input'), o = div.querySelector('output'); i.addEventListener('input', () => { o.textContent = i.value; maj(+i.value); }); }
  else if (t === 'c') { div.className = 'ligne c'; div.innerHTML = `<label>${nom}</label><input type="color" value="${get(a, key) || '#888888'}">`; div.querySelector('input').addEventListener('input', e => maj(e.target.value)); }
  else { div.className = 'ligne'; div.innerHTML = `<label>${nom}</label><select>${x.map(v => `<option${v === get(a, key) ? ' selected' : ''}>${v}</option>`).join('')}</select>`; div.querySelector('select').addEventListener('change', e => maj(e.target.value)); }
  return div;
}
const enJs = o => JSON.stringify(o).replace(/"(\w+)":/g, '$1:').replace(/"/g, "'");
function choisis(k) {
  choisi = k; for (const id in cartes) cartes[id].fig.classList.toggle('on', id === k);
  const ed = document.getElementById('editeur');
  ed.innerHTML = `<h3>${VILLAGEOIS[k].nom}</h3><canvas id="apercu" width="${PW * dpr}" height="${PW * dpr}"></canvas><div class="btns"><button id="b-reinit">Rétablir l'original</button><button id="b-copie">Copier le code</button></div><div id="msg"></div>`;
  SCHEMA.forEach(([titre, champs], i) => { const d = document.createElement('details'); d.open = i < 3; d.innerHTML = `<summary>${titre}</summary>`; for (const c of champs) d.append(champ(k, c)); ed.append(d); });
  peint(k, document.getElementById('apercu'), PW, PW, 150 * VILLAGEOIS[k].T / .55);
  const dire = t => { document.getElementById('msg').textContent = t; };
  document.getElementById('b-reinit').addEventListener('click', () => { VILLAGEOIS[k] = JSON.parse(JSON.stringify(VILLAGEOIS_DEFAUT[k])); rafraichit(k); choisis(k); dire('Dessin d\'origine rétabli'); });
  document.getElementById('b-copie').addEventListener('click', () => { navigator.clipboard.writeText(k + ': ' + enJs(VILLAGEOIS[k]) + ',').then(() => dire('Code copié (à coller dans VILLAGEOIS, js/carte/villageois.js)'), () => dire('Copie impossible')); });
}
</script>
