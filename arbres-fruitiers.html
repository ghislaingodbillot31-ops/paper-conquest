<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Arbres fruitiers</title>
<style>html,body{margin:0;background:#efe6d0}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="js/carte/arbres.js"></script>
<script>
/* Planche des arbres fruitiers : les arbres et leur dessin viennent de js/carte/arbres.js (FRUITIERS, peintArbre), les mêmes que sur la carte. */
const ARBRES = Object.values(FRUITIERS);
const COLS = 5, CELL = 280, PAD = 30, TOP = 96, ROWS = Math.ceil(ARBRES.length / COLS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = 2;
cv.width = (COLS * CELL + PAD * 2) * dpr; cv.height = (ROWS * CELL + TOP + PAD) * dpr;
cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px'; ctx.scale(dpr, dpr);
const seeded = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
const INK = '#2f2a24';
// ---- planche ----
ctx.fillStyle = '#efe6d0'; ctx.fillRect(0, 0, cv.width, cv.height);
ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 44px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.fillText('ARBRES FRUITIERS', cv.width / dpr / 2, 52);
ctx.font = '500 15px "IBM Plex Mono", monospace'; ctx.fillStyle = '#6b5f4a'; ctx.fillText('Paper Conquest · vue de dessus · ' + ARBRES.length + ' espèces', cv.width / dpr / 2, 78);
ARBRES.forEach((a, i) => {
  const col = i % COLS, row = Math.floor(i / COLS), x0 = PAD + col * CELL, y0 = TOP + row * CELL, cx = x0 + CELL / 2, cy = y0 + CELL / 2 - 8;
  ctx.fillStyle = '#f6efdc'; ctx.strokeStyle = '#b9a98a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.roundRect(x0 + 8, y0 + 8, CELL - 16, CELL - 16, 10); ctx.fill(); ctx.stroke();
  peintArbre(a, cx, cy - 4, 88 * (a.r || 1), i);
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 24px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.fillText(a.nom, cx, y0 + CELL - 22);
});
document.title = 'ok';
</script></body></html>
