<meta charset="utf-8">
<title>Carte OSIRIS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{ height:100%; margin:0; background:#0b0b0f; }
  #map{ position:absolute; inset:0; }

  .hud{
    position:absolute; inset:0; pointer-events:none;
    padding:20px; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:flex-end;
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  .readout{
    pointer-events:auto;
    align-self:flex-start;
    background:rgba(20,20,26,0.72);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.78rem;
    line-height:1.6;
    color:#e8e6df;
    font-variant-numeric:tabular-nums;
    min-width:170px;
  }
  .readout .row{ display:flex; justify-content:space-between; gap:14px; }
  .readout .label{ color:#8a8878; }
  .readout .value{ color:#e8e6df; }

  .maplibregl-ctrl-attrib{ font-size:10px; }
</style>

<div id="map"></div>
<div class="hud">
  <div class="readout">
    <div class="row"><span class="label">LAT</span><span class="value" id="hud-lat">0.0&deg;</span></div>
    <div class="row"><span class="label">LON</span><span class="value" id="hud-lon">0.0&deg;</span></div>
    <div class="row"><span class="label">ZOOM</span><span class="value" id="hud-zoom">2.0</span></div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  // On n'utilise plus le style CARTO complet: meme masquees, ses couches
  // (eau, routes, batiments, POI, frontieres...) forcaient MapLibre a
  // continuer de telecharger/decoder les tuiles vectorielles COMPLETES a
  // chaque nouvelle zone traversee en tournant le globe -- gaspillage reseau
  // + CPU qui causait les a-coups pendant le deplacement. Style minimal:
  // juste un fond uni + la police (glyphs) pour le texte des capitales.
  // Projection "globe": la carte drapee sur une sphere plutot qu'a plat.
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://tiles.basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf',
      sources: {},
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#fafaf8' } },
      ],
    },
    projection: 'globe',
    center: [2.5, 20],
    zoom: 1.5,
    attributionControl: true,
  });

  // Pas de bouton pour repasser en carte plate: le globe est le seul mode.
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

  map.on('style.load', () => {
    if(map.setProjection) map.setProjection({ type: 'globe' });

    if(map.setSky){
      // Halo atmospherique + fond spatial, comme un vrai globe plutot qu'une carte plate.
      try{
        map.setSky({
          'sky-color': '#0a0e18',
          'sky-horizon-blend': 0.5,
          'horizon-color': '#bcd7ea',
          'horizon-fog-blend': 0.6,
          'fog-color': '#eef4f8',
          'fog-ground-blend': 0.6,
          'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 10, 0],
        });
      }catch(e){ console.warn('setSky non supporte:', e); }
    }

    addCountryColors();
  });

  // Le schema OpenMapTiles de CARTO n'a pas de polygones par pays (juste des
  // lignes de frontiere "boundary") -- on ajoute donc notre propre source de
  // contours (world-atlas, meme jeu de donnees que l'ancien globe D3) pour
  // colorer chaque pays d'une teinte distincte.
  const COUNTRY_FILL_PALETTE = [
    '#E8B4B4', '#E8CBA4', '#E3D9A0', '#C9DDA0',
    '#A8D8B0', '#A0D9C9', '#A0CFE0', '#A8B8E0',
    '#C0A8E0', '#DDA0D4', '#E0A0BC', '#D4B896',
    '#B8C9A0', '#A0B8C9',
  ];
  function hashIndex(str, mod){
    let h = 0;
    str = String(str);
    for(let i = 0; i < str.length; i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    return h % mod;
  }
  // Certains anneaux (Russie, Fidji...) traversent l'antimeridien (+-180)
  // sans etre coupes: deux points consecutifs sautent directement de ~180
  // a ~-180. Rendu tel quel, le remplissage relie les deux bords d'un trait
  // qui fait le tour du globe -- le "grand cercle colore". On "deroule" la
  // longitude (ajout de +-360 en continu) pour que l'anneau reste une courbe
  // continue au lieu de teleporter d'un bord a l'autre.
  function unwrapRingLongitudes(ring){
    const out = [[ring[0][0], ring[0][1]]];
    let offset = 0;
    for(let i = 1; i < ring.length; i++){
      const rawDelta = ring[i][0] - ring[i-1][0];
      if(rawDelta > 180) offset -= 360;
      else if(rawDelta < -180) offset += 360;
      out.push([ring[i][0] + offset, ring[i][1]]);
    }
    return out;
  }
  function unwrapGeometry(geom){
    if(geom.type === 'Polygon'){
      geom.coordinates = geom.coordinates.map(unwrapRingLongitudes);
    } else if(geom.type === 'MultiPolygon'){
      geom.coordinates = geom.coordinates.map(poly => poly.map(unwrapRingLongitudes));
    }
  }

  async function addCountryColors(){
    // 110m: contours plus legers (moins de sommets a tesselliser/envoyer au
    // GPU pour notre couche de couleurs par pays) qu'en 50m, au prix d'un
    // trace cotier un peu moins fin.
    const topo = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json());
    const fc = topojson.feature(topo, topo.objects.countries);
    // L'Antarctique encercle le pole (son contour traverse toutes les
    // longitudes de facon continue, pas un bug de saut) -- pas de capitale,
    // pas de pays: on l'exclut plutot que d'essayer de le "corriger".
    fc.features = fc.features.filter(f => f.properties.name !== 'Antarctica');
    for(const f of fc.features){
      f.properties = f.properties || {};
      f.properties.fillColor = COUNTRY_FILL_PALETTE[hashIndex(f.id, COUNTRY_FILL_PALETTE.length)];
      unwrapGeometry(f.geometry);
    }
    map.addSource('countries-fill', { type: 'geojson', data: fc });
    // Au-dessus de landcover/park/landuse (sinon ces teintes du fond de
    // carte transpercent par endroits et cassent l'aplat -- le "bug" de
    // coloration) mais sous l'eau, pour que les lacs/ocean recouvrent
    // proprement tout debordement de notre polygone sur la cote.
    map.addLayer({
      id: 'countries-fill',
      type: 'fill',
      source: 'countries-fill',
      paint: {
        'fill-color': ['get', 'fillColor'],
        'fill-opacity': 0.9,
      },
    });
  }


  function updateHud(){
    const c = map.getCenter();
    document.getElementById('hud-lat').textContent = c.lat.toFixed(2) + '°';
    document.getElementById('hud-lon').textContent = c.lng.toFixed(2) + '°';
    document.getElementById('hud-zoom').textContent = map.getZoom().toFixed(1);
  }
  map.on('move', updateHud);
  map.on('load', updateHud);
</script>
