<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
  :root{
    --paper: #f3eddd;
    --paper-alt: #ece2c9;
    --card: #faf6ea;
    --ink: #3c3527;
    --ink-soft: #8c8368;
    --ink-faint: #b3a988;
    --line: #d6c9a3;
    --line-strong: #b3a179;
    --accent: #c1975a;
    --accent-ink: #4a3418;
    --good: #4a8a3f;
    --warn: #b5623a;
    --chart-1: #1f6ba0;
    --chart-2: #4a8a3f;
    --chart-3: #a0632e;
    --ocean: #eef1ea;
    --ocean-line: #aebfc0;
    --shadow: rgba(60,50,30,0.18);
    --reg-namerica: #7f9db3;
    --reg-samerica: #c98868;
    --reg-europe: #93a878;
    --reg-africa: #a08bb0;
    --reg-asia: #d0a758;
    --reg-oceania: #5f9a92;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--paper); color:var(--ink); }
  body{
    font-family:'Nunito', -apple-system, sans-serif;
    font-size:15px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(120,105,70,0.06), transparent 55%);
  }
  h1,h2,h3{ margin:0; font-weight:600; }
  .hand{ font-family:'Caveat','Segoe Script',cursive; }
  button{ font-family:inherit; }

  .app{
    height:100%;
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas: "topbar topbar" "sidebar main";
    min-height:0;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    grid-area:topbar;
    display:flex; align-items:center; gap:22px;
    padding:12px 22px;
    background:var(--card);
    border-bottom:2px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-crest{ width:38px; height:38px; flex:none; }
  .brand-text .hand{ font-size:1.7rem; line-height:1; letter-spacing:0.02em; color:var(--ink); }
  .brand-sub{ font-size:0.72rem; color:var(--ink-soft); font-style:italic; margin-top:1px; }

  .stat-pills{ display:flex; gap:18px; flex-wrap:wrap; margin-left:auto; }
  .stat-pill{ display:flex; align-items:center; gap:8px; }
  .stat-pill .icon{ width:22px; height:22px; flex:none; color:var(--accent-ink); }
  .stat-pill .num{ font-weight:800; font-variant-numeric:tabular-nums; font-size:0.92rem; }
  .stat-pill .delta{ font-size:0.68rem; color:var(--good); display:block; }

  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--line-strong); background:var(--paper-alt);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink);
  }
  .icon-btn:hover{ background:var(--accent); border-color:var(--accent-ink); color:#fff; }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    grid-area:sidebar;
    background:var(--paper-alt);
    border-right:2px solid var(--line);
    padding:14px 8px;
    overflow-y:auto;
    min-height:0;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 12px; margin-bottom:2px;
    border:none; background:transparent; border-radius:9px;
    color:var(--ink); font-size:0.88rem; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .nav-item svg{ width:18px; height:18px; flex:none; color:var(--ink-soft); }
  .nav-item:hover{ background:rgba(193,151,90,0.16); }
  .nav-item.active{ background:var(--card); box-shadow:1px 1px 0 var(--line-strong) inset; }
  .nav-item.active svg{ color:var(--accent-ink); }

  /* ---------- Main workspace ---------- */
  main.workspace{ grid-area:main; padding:16px 22px; min-height:0; display:flex; flex-direction:column; }
  .view{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; }
  .view[hidden]{ display:none; }

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    box-shadow:0 2px 0 var(--shadow);
    padding:14px 16px 16px;
  }
  .card-title{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .card-title .flag{ width:15px; height:11px; flex:none; }
  .card-title h2{ font-size:0.95rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); }
  .card-title .spacer{ flex:1; }
  .card-title a{ font-size:0.76rem; color:var(--accent-ink); text-decoration:none; border-bottom:1px dashed var(--accent-ink); }

  .carte-row{ flex:1 1 auto; min-height:0; display:flex; gap:16px; align-items:stretch; }
  .carte-main{ flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; gap:14px; }

  .map-card{ position:relative; overflow:hidden; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .map-ribbon{
    position:absolute; top:14px; left:14px; z-index:2;
    background:var(--card); border:1.5px solid var(--line-strong);
    border-radius:0 8px 8px 0; padding:6px 14px 6px 10px;
    font-size:0.8rem; font-weight:700; color:var(--ink);
    box-shadow:2px 2px 0 var(--shadow);
  }
  .map-wrap{
    position:relative; width:100%; flex:1 1 auto; min-height:0; border-radius:8px; overflow:hidden;
    background-color:#0e1c38;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 18%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 22% 62%, #f6efe0 100%, transparent),
      radial-gradient(1.6px 1.6px at 35% 12%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 48% 78%, #f6efe0 100%, transparent),
      radial-gradient(1.3px 1.3px at 62% 34%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 74% 58%, #f6efe0 100%, transparent),
      radial-gradient(1.7px 1.7px at 85% 22%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 92% 70%, #f6efe0 100%, transparent),
      radial-gradient(1.2px 1.2px at 15% 90%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 55% 6%, #f6efe0 100%, transparent),
      radial-gradient(1.4px 1.4px at 78% 88%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 4% 45%, #f6efe0 100%, transparent),
      linear-gradient(180deg, #0a1730, #16294f);
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
    background-size: 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 100% 100%;
  }
  #map{ position:absolute; inset:0; }
  .map-hint{
    position:absolute; left:14px; bottom:14px; z-index:2;
    background:var(--card); border:1.5px solid var(--line-strong); border-radius:8px;
    padding:5px 10px; font-size:0.72rem; color:var(--ink-soft);
    box-shadow:2px 2px 0 var(--shadow);
  }
  /* Onglet DEVELOPPEUR: filtres d'affichage des couches de la carte. */
  .dev-panel{ position:absolute; top:12px; right:12px; z-index:3; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .dev-tab{
    background:var(--card); border:1.5px solid var(--line-strong); border-radius:8px;
    padding:5px 10px; font-size:0.72rem; font-weight:700; letter-spacing:0.06em; color:var(--ink);
    box-shadow:2px 2px 0 var(--shadow); cursor:pointer;
  }
  .dev-tab[aria-expanded="true"]{ background:var(--ink); color:var(--card); }
  .dev-filters{
    background:var(--card); border:1.5px solid var(--line-strong); border-radius:8px;
    box-shadow:2px 2px 0 var(--shadow); padding:6px; display:flex; flex-direction:column; gap:4px; min-width:150px;
  }
  .dev-filters[hidden]{ display:none; }
  .dev-filter{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:5px 8px; font:inherit; font-size:0.78rem; color:var(--ink); cursor:pointer;
  }
  .dev-filter:hover{ border-color:var(--line-strong); }
  .dev-filter i{ width:12px; height:12px; border-radius:3px; border:1.5px solid var(--ink); flex:none; }
  .dev-filter[aria-pressed="true"] i{ background:var(--ink); }
  .dev-filter[aria-pressed="false"]{ color:var(--ink-soft); text-decoration:line-through; }
  .dev-section{ display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
  .dev-section-title{ font-size:0.68rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); }
  .dev-select{ font:inherit; font-size:0.8rem; padding:5px 6px; border:1.5px solid var(--line-strong); border-radius:6px; background:var(--card); color:var(--ink); max-width:230px; }
  .res-count{ font-size:0.76rem; }
  .res-legend{ display:flex; align-items:center; gap:6px; font-size:0.74rem; font-variant-numeric:tabular-nums; }
  .res-legend span{ margin-left:auto; font-weight:800; }
  .res-legend i{ width:12px; height:12px; border-radius:3px; }
  .res-legend i.lv3, .res-chip.lv3{ background:#0b7a3e; color:#fff; }
  .res-legend i.lv2, .res-chip.lv2{ background:#43b05c; color:#fff; }
  .res-legend i.lv1, .res-chip.lv1{ background:#b7e3a1; color:#24421a; }
  .res-group{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-bottom:5px; }
  .res-cat{ width:100%; font-size:0.66rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; }
  .res-chip{ font-size:0.7rem; font-weight:700; padding:2px 7px; border-radius:99px; }
  .dev-reset{
    margin-top:4px; padding:6px 8px; width:100%; border-radius:6px; cursor:pointer;
    font:inherit; font-size:0.76rem; font-weight:800; letter-spacing:0.03em;
    background:transparent; color:var(--warn); border:1.5px solid currentColor;
  }
  .dev-reset.confirm{ background:var(--warn); color:#fff; border-color:var(--warn); }
  .dev-reset:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .maplibregl-ctrl-attrib{ font-size:10px; }
  .maplibregl-ctrl-attrib a{ color:var(--ink-soft); }

  /* Calcul du reseau routier mondial synchronement au chargement (~20s
     pour tous les continents): un voile plein ecran evite que la carte
     paraisse figee/cassee pendant ce temps. */
  .map-loading{
    position:absolute; inset:0; z-index:5;
    background:rgba(14,28,56,0.82);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:#f6efe0; font-size:1rem;
  }
  .map-loading-spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(246,239,224,0.25); border-top-color:#f6efe0;
    animation:map-loading-spin 0.9s linear infinite;
  }
  @keyframes map-loading-spin{ to{ transform:rotate(360deg); } }

  .bottom-row{ flex:0 0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; }
  .bottom-row .card{ min-height:0; max-height:230px; overflow-y:auto; }

  .tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .tab{
    border:1.5px solid var(--line-strong); background:var(--paper-alt); color:var(--ink-soft);
    padding:4px 12px; border-radius:7px 7px 0 0; font-size:0.74rem; font-weight:700;
    cursor:pointer; border-bottom:none;
  }
  .tab.active{ background:var(--card); color:var(--ink); }
  .chart-legend{ display:flex; gap:14px; font-size:0.72rem; margin-top:4px; }
  .chart-legend span{ display:flex; align-items:center; gap:5px; }
  .chart-legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chart-tip{
    position:absolute; pointer-events:none; background:var(--ink); color:var(--paper);
    font-size:0.68rem; padding:4px 7px; border-radius:5px; transform:translate(-50%,-115%);
    white-space:nowrap; opacity:0; transition:opacity .1s;
  }
  .chart-box{ position:relative; }

  table.rank{ width:100%; border-collapse:collapse; font-size:0.78rem; }
  table.rank th{ text-align:left; color:var(--ink-soft); font-weight:700; font-size:0.68rem; text-transform:uppercase; padding-bottom:6px; }
  table.rank td{ padding:5px 4px; vertical-align:middle; border-top:1px solid var(--line); }
  table.rank td.num{ font-variant-numeric:tabular-nums; font-weight:700; text-align:right; }
  .rank-bar-track{ background:var(--paper-alt); border-radius:4px; height:8px; overflow:hidden; }

<script>
  // ---------------------------------------------------------------
  // Donnees fictives -- toute l'interface est reelle (navigation,

  const NAV_ITEMS = [
    { view:'carte', label:'Carte', icon:'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2Z M9 4v14M15 6v14' },

  // Les 6 continents ne servent plus qu'a classer/colorer les vraies regions
  // (voir plus bas): couleur (CSS, pour le petit croquis du panneau), couleur
  // hexadecimale equivalente (WebGL MapLibre ne resout pas les var() CSS) et
  // une accroche courte affichee dans le panneau de region.
  const CONTINENTS = [
    { id:'namerica', name:'Amérique du Nord', color:'var(--reg-namerica)', tagline:'Une puissance industrielle et technologique établie.' },
    { id:'samerica', name:'Amérique du Sud', color:'var(--reg-samerica)', tagline:'Un géant agricole aux richesses naturelles immenses.' },
    { id:'europe', name:'Europe', color:'var(--reg-europe)', tagline:'Une région stable et stratégique.' },
    { id:'africa', name:'Afrique', color:'var(--reg-africa)', tagline:'Un continent jeune au potentiel de croissance rapide.' },
    { id:'asia', name:'Asie', color:'var(--reg-asia)', tagline:'Le cœur battant de l\'économie mondiale.' },
