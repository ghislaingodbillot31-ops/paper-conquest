  // Regions NPC (comptoirs de commerce, pour le futur systeme d'echanges):
  // non selectionnables comme point de depart, couleur violette distincte,
  // mais restent pleinement integrees au reseau routier. Choix manuel de
  // l'utilisateur, remappe sur le redecoupage compact mondial (4 des 30 regions
  // d'Australie).
  const NPC_COLOR = '#8f5fa8';
  const NPC_REGION_IDS = new Set([449, 421, 477, 489]);

  const SITUATION_TABS = [
    { id:'economie', label:'Économie', series:[
      { name:'PIB mondial', color:'var(--chart-1)', values:[520,610,690,790,900] },
      { name:'Commerce mondial', color:'var(--chart-2)', values:[300,340,380,430,470] } ] },
    { id:'diplomatie', label:'Diplomatie', series:[
      { name:'Alliances actives', color:'var(--chart-1)', values:[38,41,44,47,52] },
      { name:'Tensions ouvertes', color:'var(--chart-3)', values:[14,16,13,15,11] } ] },
    { id:'militaire', label:'Militaire', series:[
      { name:'Dépenses militaires', color:'var(--chart-1)', values:[210,225,238,250,268] },
      { name:'Conflits actifs', color:'var(--chart-3)', values:[9,8,10,7,6] } ] },
  ];
  const YEARS = [2025,2026,2027,2028,2029];

  // Pas encore de puissances classees ni d'evenements: la partie commence
  // sans economie.
  const RANKING = [];
  const EVENTS = [];

  // ---------- Helpers ----------
  function svgEl(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function iconCheck(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12l5 5 11-11"/></svg>'; }
  function iconWarn(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l9 16H3Z"/><path d="M12 10v4M12 17h.01"/></svg>'; }

  // ---------- Sidebar ----------
  const sidebar = document.getElementById('sidebar');
  NAV_ITEMS.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (i === 0 ? ' active' : '');
    btn.dataset.view = item.view;
    btn.dataset.label = item.dataLabel || item.label;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">' +
      item.icon.split('M').filter(Boolean).map(seg => '<path d="M' + seg.trim() + '"/>').join('') + '</svg><span>' + item.label + '</span>';
    btn.addEventListener('click', () => switchView(btn));
    sidebar.appendChild(btn);
  });
  function switchView(activeBtn){
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b === activeBtn));
    const view = activeBtn.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.view !== view);
  }

  // ---------- Globe (MapLibre GL, vraie geographie) ----------
  // Chaque pays (adm0_a3) est classe dans l'un des 6 continents, seulement
  // pour la couleur et le petit texte de contexte dans le panneau -- les
  // regions cliquables sont 500 regions compactes d'aire comparable (~260 000 km2,
  // decoupage k-means + Voronoi par continent -- voir docs/build-repartition.js),
  // pas les continents eux-memes.
  const ISO3_CONTINENT = {
    namerica:['BLZ','CAN','CRI','CUB','DOM','GRL','GTM','HND','HTI','MEX','NIC','PAN','USA'],
    samerica:['ARG','BOL','BRA','CHL','COL','ECU','GUY','PER','PRY','SUR','URY','VEN'],
    europe:['ALB','AUT','BEL','BGR','BIH','BLR','CHE','CZE','DEU','DNK','ESP','EST','FIN','FRA','GBR','GRC','HRV','HUN','IRL','ISL','ITA','LTU','LVA','MDA','MKD','NLD','NOR','POL','PRT','ROU','SRB','SVK','SVN','SWE','UKR'],
    africa:['AGO','BEN','BFA','BWA','CAF','CIV','CMR','COD','COG','DZA','EGY','ERI','ETH','GAB','GHA','GIN','KEN','LBR','LBY','MAR','MDG','MLI','MOZ','MRT','NAM','NER','NGA','SAH','SDN','SDS','SEN','SLE','SOL','SOM','TCD','TUN','TZA','UGA','ZAF','ZMB','ZWE'],
    asia:['AFG','ARE','ARM','AZE','BGD','BTN','CHN','GEO','IDN','IND','IRN','IRQ','ISR','JOR','JPN','KAZ','KGZ','KHM','KOR','LAO','LKA','MMR','MNG','MYS','NPL','OMN','PAK','PHL','PRK','RUS','SAU','SYR','TJK','THA','TKM','TUR','TWN','UZB','VNM','YEM'],
    oceania:['AUS','NZL','PNG'],
  };
  const CODE_TO_CONTINENT = {};
  for(const id in ISO3_CONTINENT) ISO3_CONTINENT[id].forEach(code => { CODE_TO_CONTINENT[code] = id; });

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://tiles.basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf',
      sources: {},
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#a7c8d3' } },
      ],
    },
    projection: 'globe',
    center: [12, 22],
    zoom: 1,
    attributionControl: true,
  });
  map.on('error', (e) => console.error('MAPLIBRE ERROR:', e && e.error && e.error.message, e));
  // Le conteneur (carte dans une mise en page flex/grid) peut ne pas avoir
  // sa taille finale au moment ou MapLibre mesure le canvas -- on force un
  // resize des que la taille reelle est connue, et a chaque changement
  // (redimensionnement de fenetre, bascule responsive).
  if(window.ResizeObserver){
    new ResizeObserver(() => map.resize()).observe(document.querySelector('.map-wrap'));
  }

  map.on('style.load', () => {
    if(map.setProjection) map.setProjection({ type: 'globe' });
    if(map.setSky){
      // Fond spatial: bleu sombre etoile derriere le globe (voir le
      // degrade + etoiles CSS sur .map-wrap, visible autour de la sphere).
      try{
        map.setSky({
          'sky-color': '#0a1730',
          'sky-horizon-blend': 0.35,
          'horizon-color': '#1c3560',
          'horizon-fog-blend': 0.5,
          'fog-color': '#16294f',
          'fog-ground-blend': 0.6,
          'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 10, 0],
        });
      }catch(e){ console.warn('setSky non supporte:', e); }
    }
    addRegions();
  });

  // Certains anneaux (Russie/Alaska...) traversent l'antimeridien (+-180)
  // sans etre coupes -- on "deroule" la longitude pour eviter un
  // remplissage qui fait le tour du globe.
  function unwrapRingLongitudes(ring){
    const out = [[ring[0][0], ring[0][1]]];
    let offset = 0;
    for(let i = 1; i < ring.length; i++){
      const rawDelta = ring[i][0] - ring[i-1][0];
      if(rawDelta > 180) offset -= 360;
      else if(rawDelta < -180) offset += 360;
      out.push([ring[i][0] + offset, ring[i][1]]);
    }
    return out;
  }
  function unwrapGeometry(geom){
    if(geom.type === 'Polygon') geom.coordinates = geom.coordinates.map(unwrapRingLongitudes);
    else if(geom.type === 'MultiPolygon') geom.coordinates = geom.coordinates.map(poly => poly.map(unwrapRingLongitudes));
  }

  // Couleur "carte physique" par climat plutot que par pays: le jeu ne doit
  // pas reveler les vraies frontieres politiques (les joueurs creent leurs
  // propres pays sur ce globe), seulement le relief/climat qu'on verrait sur
  // un vrai globe. Degrade continu sur deux axes (temperature + aridite),
  // jamais de zones a bordure dure.
  function lerp(a, b, t){ return a + (b - a) * t; }
  function smooth01(t){ t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  function lerpColor(c1, c2, t){
    t = smooth01(t);
    const p1 = parseInt(c1.slice(1), 16), p2 = parseInt(c2.slice(1), 16);
    const r = Math.round(lerp((p1 >> 16) & 255, (p2 >> 16) & 255, t));
    const g = Math.round(lerp((p1 >> 8) & 255, (p2 >> 8) & 255, t));
    const b = Math.round(lerp(p1 & 255, p2 & 255, t));
    const h = v => v.toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  }

  const COL_DEEP_FOREST = '#1f6b3c'; // grosse foret (equatoriale, humide)
  const COL_FOREST      = '#a9db8e'; // pays forestier (foret temperee)
  const COL_COLD        = '#f5f7f5'; // pays froid
  const COL_HOT_DRY     = '#f0932b'; // climat tres chaud (desert le plus chaud)
  const COL_DESERT      = '#f4e28c'; // desert / steppe seche

  // Chaine humide (foret dense->claire->neige) selon la latitude absolue.
  function humidColor(absLat){
    if(absLat < 12) return lerpColor(COL_DEEP_FOREST, COL_FOREST, absLat / 12);
    if(absLat < 55) return COL_FOREST;
    if(absLat < 68) return lerpColor(COL_FOREST, COL_COLD, (absLat - 55) / 13);
    return COL_COLD;
  }
  // Chaine seche (orange brulant->jaune desert->neige), memes paliers.
  function aridColor(absLat){
    if(absLat < 25) return lerpColor(COL_HOT_DRY, COL_DESERT, absLat / 25);
    if(absLat < 55) return COL_DESERT;
    if(absLat < 68) return lerpColor(COL_DESERT, COL_COLD, (absLat - 55) / 13);
    return COL_COLD;
  }

  // Centres de desert [lat, lon, rayon en degres], pour une aridite continue
  // (score qui s'attenue en douceur avec la distance).
  const ARID_CENTERS = [
    [23, 10, 20],    // Sahara
    [20, 45, 15],    // Peninsule arabique
    [40, 75, 18],    // deserts d'Asie centrale (Gobi, Taklamakan, Kyzylkoum)
    [28, -108, 12],  // sud-ouest des Etats-Unis / Mexique
    [-25, 133, 18],  // interieur australien
    [-24, -69, 8],   // Atacama
    [-23, 18, 12],   // Kalahari / Namib
  ];
  function aridityAt(lat, lon){
    let best = 0;
    for(const [clat, clon, radius] of ARID_CENTERS){
      const d = Math.hypot(lat - clat, lon - clon);
      const score = smooth01(1 - d / (radius * 2));
      if(score > best) best = score;
    }
    return best;
  }

  // Couleur finale: interpole entre la chaine humide et la chaine seche
  // selon l'aridite locale, elle-meme continue -- aucune des deux
  // dimensions ne cree de bordure nette.
  function climateColorAt(lat, lon){
    const absLat = Math.abs(lat);
    const aridity = aridityAt(lat, lon);
    return lerpColor(humidColor(absLat), aridColor(absLat), aridity);
  }

  // Eclaircit/assombrit une couleur hex vers le blanc (amt>0) ou le noir
  // (amt<0). Sert a decliner plusieurs teintes distinctes a l'interieur
  // d'une meme sous-region.
  function tintHex(hex, amt){
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const mix = amt >= 0 ? 255 : 0;
    const p = Math.abs(amt);
    const c = v => Math.round(v + (mix - v) * p).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  }

  // Plus grand anneau (exterieur) d'une geometrie, pour son centroide.
  function largestRing(geom){
    const rings = geom.type === 'Polygon' ? [geom.coordinates[0]]
      : geom.coordinates.map(poly => poly[0]);
    let best = rings[0], bestArea = 0;
    for(const ring of rings){
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for(const [x, y] of ring){
        if(x < minX) minX = x; if(x > maxX) maxX = x;
        if(y < minY) minY = y; if(y > maxY) maxY = y;
      }
      const area = (maxX - minX) * (maxY - minY);
      if(area > bestArea){ bestArea = area; best = ring; }
    }
    return best;
  }

  // Empreinte numerique stable d'une geometrie (centroide approche de son
  // plus grand anneau), graine deterministe pour la variation de teinte.
  function geometrySeed(geom){
    const ring = largestRing(geom);
    let sx = 0, sy = 0;
    for(const [x, y] of ring){ sx += x; sy += y; }
    const cx = Math.round((sx / ring.length) * 1000);
    const cy = Math.round((sy / ring.length) * 1000);
    let h = 0;
    const s = cx + ',' + cy;
    for(let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  let regionsFc = null;

  async function addRegions(){
    const [topo, navGrid] = await Promise.all([
      fetch('data/admin1.topojson').then(r => r.json()),
      fetch('data/nav-grid.json').then(r => r.json()).catch(e => { console.warn('Grille de navigation indisponible:', e); return null; }),
    ]);
    const objName = Object.keys(topo.objects)[0];
    const geometries = topo.objects[objName].geometries;
    const fc = topojson.feature(topo, topo.objects[objName]);
    fc.features.forEach((f, i) => {
      f.id = i + 1;
      f.properties.regionNum = i + 1;
      f.properties.continent = CODE_TO_CONTINENT[f.properties.adm0_a3] || null;
      // Couleur du climat reel a la position du morceau (pas du pays: aucune
      // frontiere politique reelle n'est reveleee), plus une legere
      // variation de teinte pour eviter des zones plates.
      const ring = largestRing(f.geometry);
      let sx = 0, sy = 0;
      for(const [x, y] of ring){ sx += x; sy += y; }
      const lat = sy / ring.length, lon = sx / ring.length;
      const base = climateColorAt(lat, lon);
      const seed = geometrySeed(f.geometry);
      f.properties.isNpc = NPC_REGION_IDS.has(f.id);
      f.properties.fillColor = f.properties.isNpc ? NPC_COLOR : tintHex(base, ((seed % 9) - 4) * 0.03);
      unwrapGeometry(f.geometry);
      try{ f.properties.clusterArea = Math.round(turf.area(f) / 1e6); }
      catch(e){ /* garde la valeur stockee si le calcul echoue */ }
    });
    regionsFc = fc;
    regionTopo = topo; regionGeoms = geometries;

    map.addSource('regions', { type: 'geojson', data: fc });
    map.addLayer({
      id: 'regions', type: 'fill', source: 'regions',
      paint: { 'fill-color': ['get', 'fillColor'] },
    });
    map.addLayer({
      id: 'regions-outline', type: 'line', source: 'regions',
      paint: { 'line-color': 'rgba(60,53,39,0.35)', 'line-width': 0.5 },
    });
    map.addLayer({
      id: 'regions-selected', type: 'line', source: 'regions',
      paint: {
        'line-color': '#4a3418',
        'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 3, 0],
      },
    });
    // Numero de chaque region affiche dessus -- sert a reperer/signaler une
    // region precise (ex. pour un bug de trace ou de couleur).
    map.addLayer({
      id: 'regions-label', type: 'symbol', source: 'regions',
      layout: {
        'text-field': ['to-string', ['get', 'regionNum']],
        'text-font': ['Open Sans Regular'],
        'text-size': 10,
        'text-allow-overlap': false,
      },
      paint: {
        'text-color': '#3c3527',
        'text-halo-color': '#f6efe0',
        'text-halo-width': 1.2,
      },
    });

    applyDevFilters();

    map.on('click', 'regions', (e) => {
      if(interactionBusy() || !e.features.length) return;
      selectRegion(e.features[0].id);
    });
    map.on('mouseenter', 'regions', () => { if(!interactionBusy()) map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'regions', () => { map.getCanvas().style.cursor = ''; });

    // Un reseau independant par continent (jamais de faux voisinage entre
    // deux masses continentales separees par un ocean): chaque appel a
    // buildRegionNetwork ne compare que les geometries de son propre
    // sous-ensemble, donc le cout de calcul de chacun reste borne a sa
    // propre taille plutot que d'exploser avec le nombre total de regions
    // du monde.
    addVillageNetwork(topo, fc, geometries, [
      f => f.properties.adm0_a3 === 'AUS',
      f => ISO3_CONTINENT.africa.includes(f.properties.adm0_a3),
      f => ISO3_CONTINENT.europe.includes(f.properties.adm0_a3),
      f => ISO3_CONTINENT.asia.includes(f.properties.adm0_a3),
      f => ISO3_CONTINENT.namerica.includes(f.properties.adm0_a3),
      f => ISO3_CONTINENT.samerica.includes(f.properties.adm0_a3),
      f => ISO3_CONTINENT.oceania.includes(f.properties.adm0_a3) && f.properties.adm0_a3 !== 'AUS',
    ]);

    const loadingEl = document.getElementById('map-loading');
    if(loadingEl) loadingEl.style.display = 'none';

    initSelection();
    initBoat(navGrid);
    initCaravan();
    initResources();
  }

  // ---------- Reseau de chemins (mondial, adjacence topologique reelle) ----------
  // Village = un point garanti sur la terre de la region (turf.pointOnFeature,
  // contrairement a un centroide qui peut tomber dans l'eau pour une region
  // en croissant ou un archipel).
  // Chemins terrestres = adjacence topologique reelle: deux regions ne sont
  // reliees que si elles partagent un arc du topojson, donc chaque chemin
  // reste sur la terre par construction, relie deux voisins directs (zero
  // region intermediaire) et suit le trajet le plus court possible entre
  // elles. Les deplacements par la mer (iles comprises) ne passent pas par
  // ce reseau: ils sont calcules a la demande par la navigation des bateaux
  // (createNavigator, grille data/nav-grid.json).

  // Normalise une longitude dans [-180,180]: nos polygones "deroules"
  // (Russie/Alaska/Fidji, cf. unwrapGeometry) sortent de cette plage, ce qui
  // fausserait un calcul de distance directe entre un point deroule et un
  // point normal proche de l'antimeridien.
  function normLon(lon){
    let l = lon % 360;
    if(l > 180) l -= 360;
    if(l < -180) l += 360;
    return l;
  }
  function geoDistance(a, b){
    return turf.distance([normLon(a[0]), a[1]], [normLon(b[0]), b[1]]);
  }

  // Position de capitale garantie loin de toute frontiere (jamais "a
  // cheval" entre deux regions): on essaie plusieurs points candidats
  // (centre de masse, centroide, point-sur-feature, plus une grille dans
  // l'emprise de la region) et on garde celui dont la distance a la
  // frontiere la plus proche est maximale -- une approximation rapide du
  // "pole d'inaccessibilite" sans dependance externe.
  // Densite de grille et simplification du contour adaptees a la SURFACE
  // reelle de la region (turf.area): une grande region (ex. un Etat
  // australien) a plus a gagner d'une grille fine, une petite n'en a pas
  // besoin: son interieur est deja proche de la frontiere partout. Le
  // contour est simplifie avant les mesures de distance (calcul par
  // sommets, donc couteux sur un tres long trait de cote) avec une
  // tolerance elle aussi liee a la taille de la region -- suffisant pour
  // choisir un bon point interieur sans re-suivre chaque micro-detail des
  // LIMITES DE FRONTIERE.
  function safeInteriorPoint(feature){
    const bounds = turf.bbox(feature);
    const areaKm2 = turf.area(feature) / 1e6;
    const GRID = areaKm2 > 200000 ? 7 : areaKm2 > 20000 ? 6 : areaKm2 > 2000 ? 5 : 4;
    let boundaryLine;
    try{ boundaryLine = turf.polygonToLine(feature); }catch(e){ boundaryLine = null; }
    let lines = boundaryLine ? (boundaryLine.type === 'FeatureCollection' ? boundaryLine.features : [boundaryLine]) : [];
    const tolerance = Math.max(0.01, Math.sqrt(areaKm2) / 4000);
    lines = lines.map(l => { try{ return turf.simplify(l, { tolerance, highQuality:false }); }catch(e){ return l; } });
    function distToBoundary(pt){
      let min = Infinity;
      lines.forEach(l => {
        try{ const d = turf.pointToLineDistance(pt, l, { units:'kilometers' }); if(d < min) min = d; }catch(e){}
      });
      return min === Infinity ? 0 : min;
    }
    const candidates = [];
    const tryAdd = (pt) => { if(pt && turf.booleanPointInPolygon(pt, feature)) candidates.push(pt); };
    try{ tryAdd(turf.centerOfMass(feature).geometry.coordinates); }catch(e){}
    try{ tryAdd(turf.centroid(feature).geometry.coordinates); }catch(e){}
    try{ tryAdd(turf.pointOnFeature(feature).geometry.coordinates); }catch(e){}
    for(let gx = 0; gx < GRID; gx++){
      for(let gy = 0; gy < GRID; gy++){
        const x = bounds[0] + (bounds[2]-bounds[0]) * (gx+0.5)/GRID;
        const y = bounds[1] + (bounds[3]-bounds[1]) * (gy+0.5)/GRID;
        tryAdd([x, y]);
      }
    }
    if(!candidates.length) return turf.pointOnFeature(feature).geometry.coordinates;
    let best = candidates[0], bestD = -1;
    candidates.forEach(c => { const d = distToBoundary(c); if(d > bestD){ bestD = d; best = c; } });
    return best;
  }

  // ---------- Detection de croisement entre deux tracés (segments) ----------
  // Prefiltre par boite englobante (tres bon marche) avant le test complet
  // segment-par-segment: la grande majorite des paires de tracés sur une
  // carte n'ont meme pas leurs emprises qui se touchent.
  function bboxOfCoords(coords){
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    coords.forEach(([x, y]) => {
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
    });
    return [minX, minY, maxX, maxY];
  }
  function bboxOverlap(a, b){
    return a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];
  }
  function segmentsIntersect(p1, p2, p3, p4){
    function ccw(a, b, c){ return (c[1]-a[1]) * (b[0]-a[0]) > (b[1]-a[1]) * (c[0]-a[0]); }
    return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
  }
  function pathsCross(coordsA, bboxA, coordsB, bboxB){
    if(!bboxOverlap(bboxA, bboxB)) return false;
    for(let i = 0; i < coordsA.length - 1; i++){
      for(let j = 0; j < coordsB.length - 1; j++){
        if(segmentsIntersect(coordsA[i], coordsA[i+1], coordsB[j], coordsB[j+1])) return true;
      }
    }
    return false;
  }
  function crossesExisting(coords, existingEdges){
    const bb = bboxOfCoords(coords);
    return existingEdges.some(e => pathsCross(coords, bb, e.coords, e.bbox));
  }

  function windingPath(a, b, amplitudeScale){
    const distKm = geoDistance(a, b);
    const segments = 22;
    const amplitudeDeg = (Math.min(distKm * 0.08, 80) / 111) * amplitudeScale;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1e-9;
    const nx = -dy / len, ny = dx / len; // perpendiculaire unitaire
    // graine deterministe (memes points -> meme ondulation a chaque chargement)
    const seed = Math.abs(Math.sin(a[0] * 12.9898 + a[1] * 78.233 + b[0] * 37.719 + b[1] * 11.135) * 43758.5453) % 1;
    const wiggles = 2 + (seed > 0.5 ? 1 : 0);
    const phase = seed * Math.PI * 2;
    const pts = [];
    for(let i = 0; i <= segments; i++){
      const t = i / segments;
      const bx = a[0] + dx * t, by = a[1] + dy * t;
      // Sinus au carre plutot que simple: vaut 0 ET a une derivee nulle aux
      // deux bouts (pas seulement une position nulle), donc l'ondulation
      // demarre/finit en douceur -- essentiel pour les tracés en deux
      // demi-trajets (capitale -> frontiere -> capitale): sans ca, les deux
      // moities pouvaient se rejoindre avec un coude brusque au point de
      // jonction meme si leurs positions coincidaient exactement.
      const taper = Math.pow(Math.sin(t * Math.PI), 2);
      const wob = Math.sin(t * Math.PI * wiggles + phase) * amplitudeDeg * taper;
      pts.push([bx + nx * wob, by + ny * wob]);
    }
    return pts;
  }

  function pathStaysOnLandSingle(coords, land){
    for(let i = 1; i < coords.length - 1; i++){
      if(!turf.booleanPointInPolygon(coords[i], land)) return false;
    }
    return true;
  }
  function pathStaysOnLand(coords, landA, landB){
    for(let i = 1; i < coords.length - 1; i++){
      const pt = coords[i];
      if(!turf.booleanPointInPolygon(pt, landA) && !turf.booleanPointInPolygon(pt, landB)) return false;
    }
    return true;
  }

  // Plusieurs points candidats (15/30/50/70/85%) le long de la plus longue
  // frontiere reellement partagee entre les deux regions (calculee via les
  // arcs topojson, donc la vraie limite terrestre, pas une approximation):
  // le trace passera obligatoirement par un point de CETTE frontiere avant
  // de rejoindre chaque capitale, jamais par un raccourci qui coupe a
  // travers l'eau ou une troisieme region. Plusieurs points sont testes
  // (pas seulement le milieu) car pres d'une baie ou d'un golfe, un point
  // median peut faire sortir un des deux segments dans l'eau alors qu'un
  // autre point de la meme frontiere reelle passe.
  function borderWaypoints(topo, geomI, geomJ){
    let mesh;
    try{
      mesh = topojson.mesh(topo, { type:'GeometryCollection', geometries:[geomI, geomJ] },
        (a, b) => (a === geomI && b === geomJ) || (a === geomJ && b === geomI));
    }catch(e){ return []; }
    const lines = mesh && mesh.coordinates;
    if(!lines || !lines.length) return [];
    let longest = lines[0], longestLen = -1;
    lines.forEach(line => {
      let len = 0;
      for(let i = 1; i < line.length; i++) len += geoDistance(line[i-1], line[i]);
      if(len > longestLen){ longestLen = len; longest = line; }
    });
    function pointAtFraction(frac){
      let acc = 0;
      const target = longestLen * frac;
      for(let i = 1; i < longest.length; i++){
        const seg = geoDistance(longest[i-1], longest[i]);
        if(acc + seg >= target){
          const t = seg === 0 ? 0 : (target - acc) / seg;
          return [
            longest[i-1][0] + (longest[i][0] - longest[i-1][0]) * t,
            longest[i-1][1] + (longest[i][1] - longest[i-1][1]) * t,
          ];
        }
        acc += seg;
      }
      return longest[longest.length - 1];
    }
    return [0.5, 0.3, 0.7, 0.15, 0.85].map(pointAtFraction);
  }

  // Essaie chaque point de frontiere candidat, et pour chacun toutes les
  // amplitudes d'ondulation valides (de la plus sinueuse a la ligne droite)
  // sur les deux demi-trajets capitale -> frontiere -> capitale, chaque
  // demi-trajet devant rester entierement dans SA propre region.
  function allWindingLegs(p1, p2, land){
    const out = [];
    for(const scale of [1, 0.4, 0]){
      const coords = windingPath(p1, p2, scale);
      if(pathStaysOnLandSingle(coords, land)) out.push(coords);
    }
    return out;
  }
  // Angle de virage (en degres) qu'imposerait un point de frontiere donne:
  // cap direct capitale->frontiere compare au cap frontiere->autre capitale.
  // Sert a classer les points de frontiere candidats du plus doux au plus
  // brusque, pour ne pas choisir arbitrairement le premier valide et se
  // retrouver avec un coude prononce alors qu'un point voisin de la meme
  // frontiere donnait un virage bien plus naturel.
  function bearingDeg(p, q){ return Math.atan2(q[1]-p[1], q[0]-p[0]) * 180 / Math.PI; }
  function bearingTurn(a, waypoint, b){
    let diff = bearingDeg(waypoint, b) - bearingDeg(a, waypoint);
    while(diff > 180) diff -= 360;
    while(diff < -180) diff += 360;
    return Math.abs(diff);
  }

  // Parmi toutes les combinaisons valides (sur terre), prefere celle qui ne
  // croise AUCUN trace deja pose (les routes ne doivent pas se croiser);
  // si vraiment aucune combinaison ne l'evite (zone tres dense), garde la
  // meilleure trouvee plutot que de sacrifier la connexion elle-meme -- ne
  // jamais traverser l'eau reste la seule regle strictement non negociable.
  // Les points de frontiere sont essayes du virage le plus doux au plus
  // brusque (bearingTurn croissant) pour eviter un trace en "coude" alors
  // qu'une option plus naturelle existait sur la meme frontiere.
  // Repli sur l'ancien trajet direct si aucune frontiere n'a pu etre
  // extraite. Si rien ne passe du tout (cas rarissime, ex. les deux regions
  // se touchent uniquement au bord d'une baie), renvoie null: on abandonne
  // alors cette connexion precise plutot que de tricher.
  function landPath(topo, a, b, geomI, geomJ, landA, landB, existingEdges){
    let fallback = null;
    const waypoints = borderWaypoints(topo, geomI, geomJ)
      .slice()
      .sort((w1, w2) => bearingTurn(a, w1, b) - bearingTurn(a, w2, b));
    for(const waypoint of waypoints){
      const legs1 = allWindingLegs(a, waypoint, landA);
      const legs2 = allWindingLegs(waypoint, b, landB);
      for(const leg1 of legs1){
        for(const leg2 of legs2){
          const coords = leg1.concat(leg2.slice(1));
          if(!fallback) fallback = coords;
          if(!crossesExisting(coords, existingEdges)) return coords;
        }
      }
    }
    for(const scale of [1, 0.4, 0]){
      const coords = windingPath(a, b, scale);
      if(pathStaysOnLand(coords, landA, landB)){
        if(!fallback) fallback = coords;
        if(!crossesExisting(coords, existingEdges)) return coords;
      }
    }
    return fallback;
  }

  function makeUnionFind(n){
    const parent = Array.from({ length:n }, (_, i) => i);
    const size = new Array(n).fill(1);
    function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b){
      let ra = find(a), rb = find(b);
      if(ra === rb) return false;
      if(size[ra] < size[rb]){ const t = ra; ra = rb; rb = t; }
      parent[rb] = ra; size[ra] += size[rb];
      return true;
    }
    function sizeOf(x){ return size[find(x)]; }
    return { find, union, sizeOf };
  }


  // Chaque capitale a droit a 4 tracés maximum: on ne considère que les
  // paires de voisins directs réels (adjacence topojson, jamais une
  // connexion qui saute par-dessus une region), triées de la plus proche a
  // la plus lointaine, et on les ajoute une a une tant que les deux
  // capitales concernées n'ont pas atteint la limite -- les connexions les
  // plus pertinentes (les plus proches) sont donc toujours prioritaires.
  const MAX_DEGREE = 4;

  // Connexions explicitement retirees (paire de regions par id) meme si ce
  // sont de vrais voisins -- le reste du reseau (plafonds adaptatifs, regle
  // des 2 frontieres) se reajuste automatiquement autour de cette absence.
  // Construit toujours via forbiddenKey (ordre des deux id sans importance)
  // pour eviter une erreur de saisie sur l'ordre exact de la cle.
  function forbiddenKey(idA, idB){ return idA < idB ? idA + '-' + idB : idB + '-' + idA; }
  // (Vide depuis le passage a 500 regions: les anciennes paires ne
  // correspondaient plus aux nouvelles frontieres.)
  const FORBIDDEN_EDGES = new Set([
  ]);


  function buildRegionNetwork(topo, fc, geometries){
    const n = fc.features.length;
    const villages = fc.features.map(f => {
      const coord = safeInteriorPoint(f);
      return { regionId:f.id, coord, gcoord:[normLon(coord[0]), coord[1]] };
    });

    let neighborIdx;
    try{ neighborIdx = topojson.neighbors(geometries); }
    catch(e){ console.warn('Calcul des voisinages topologiques impossible:', e); neighborIdx = fc.features.map(() => []); }

    const candidates = [];
    for(let i = 0; i < n; i++){
      for(const j of neighborIdx[i]){
        if(j <= i) continue; // chaque paire de voisins une seule fois
        if(FORBIDDEN_EDGES.has(forbiddenKey(fc.features[i].id, fc.features[j].id))) continue;
        candidates.push([i, j, geoDistance(villages[i].coord, villages[j].coord)]);
      }
    }

    // Plafond de connexions par capitale: 4 par defaut (MAX_DEGREE), releve
    // au cas par cas UNIQUEMENT pour les capitales qui en ont reellement
    // besoin pour atteindre chacun de leurs vrais voisins en 2 frontieres
    // maximum (jamais au-dela de LAND_DEGREE_CEILING) -- la plupart des
    // regions restent a 3, seuls les carrefours a nombreux voisins montent.
    const LAND_DEGREE_CEILING = 6;
    const cap = new Array(n).fill(MAX_DEGREE);
    let uf, degree, edges, skippedUnroutable;

    function runLandPass(){
      uf = makeUnionFind(n);
      degree = new Array(n).fill(0);
      edges = [];
      skippedUnroutable = 0;
      // Priorise a chaque etape la paire dont la capitale la MOINS connectee
      // (relativement a SON propre plafond) profiterait le plus, a distance
      // egale la plus courte gagne -- evite qu'une region ayant pourtant
      // plusieurs vrais voisins ne se retrouve avec un seul trace simplement
      // parce que ses voisins ont deja ete pris par des paires plus courtes
      // ailleurs.
      const remaining = candidates.slice();
      while(remaining.length){
        let bestIdx = -1, bestScore = Infinity, bestDist = Infinity;
        for(let k = 0; k < remaining.length; k++){
          const [i, j, d] = remaining[k];
          if(degree[i] >= cap[i] || degree[j] >= cap[j]){ remaining.splice(k, 1); k--; continue; }
          const score = Math.max(degree[i] / cap[i], degree[j] / cap[j]);
          if(score < bestScore || (score === bestScore && d < bestDist)){
            bestScore = score; bestDist = d; bestIdx = k;
          }
        }
        if(bestIdx === -1) break;
        const [i, j] = remaining[bestIdx];
        remaining.splice(bestIdx, 1);
        const coords = landPath(topo, villages[i].coord, villages[j].coord, geometries[i], geometries[j], fc.features[i], fc.features[j], edges);
        if(!coords){ skippedUnroutable++; continue; } // aucun trace valide sans traverser l'eau: on abandonne cette paire plutot que de tricher
        edges.push({ a:i, b:j, coords, bbox:bboxOfCoords(coords), kind:'land' });
        uf.union(i, j);
        degree[i]++; degree[j]++;
      }
    }

    // Chaque paire de vrais voisins doit rester a 2 tracés maximum l'une de
    // l'autre dans le reseau construit; sinon, on augmente le plafond des
    // deux capitales concernees (jamais au-dela du plafond maximal) et on
    // reconstruit -- quelques tours suffisent, la plupart des regions ne
    // sont jamais concernees.
    function findTwoHopViolations(){
      const adj = Array.from({ length:n }, () => []);
      edges.forEach(e => { if(e.kind === 'land'){ adj[e.a].push(e.b); adj[e.b].push(e.a); } });
      const violations = [];
      for(let i = 0; i < n; i++){
        const dist = new Array(n).fill(Infinity);
        dist[i] = 0;
        const queue = [i];
        while(queue.length){
          const cur = queue.shift();
          for(const nx of adj[cur]) if(dist[nx] === Infinity){ dist[nx] = dist[cur] + 1; queue.push(nx); }
        }
        for(const j of neighborIdx[i]){
          if(j <= i) continue;
          if(dist[j] > 2) violations.push([i, j]);
        }
      }
      return violations;
    }

    runLandPass();
    for(let round = 0; round < 15; round++){
      const violations = findTwoHopViolations();
      if(!violations.length) break;
      let raised = false;
      violations.forEach(([i, j]) => {
        [i, j].forEach(node => {
          if(degree[node] >= cap[node] && cap[node] < LAND_DEGREE_CEILING){ cap[node]++; raised = true; }
        });
      });
      if(!raised) break; // plafond maximal atteint partout ou necessaire: on garde le meilleur reseau obtenu
      runLandPass();
    }
    if(skippedUnroutable) console.warn(skippedUnroutable, 'connexion(s) terrestre(s) abandonnee(s): aucun trace ne pouvait eviter l\'eau.');

    return { villages, edges };
  }

  // filterFns restreint le reseau (villages + chemins) a un ou plusieurs
  // sous-ensembles de regions (ex. un pays ou un continent chacun) -- un
  // reseau independant est construit pour chaque filtre (l'adjacence
  // topojson ne comparant que les geometries de ce sous-ensemble, aucune
  // interference entre continents), puis tous les reseaux sont fusionnes
  // dans les memes sources/couches de la carte.
  function addVillageNetwork(topo, fc, geometries, filterFns){
    const filters = Array.isArray(filterFns) ? filterFns : [filterFns];
    const allEdges = [];
    const allVillages = [];

    filters.forEach(filterFn => {
      const idxList = [];
      fc.features.forEach((f, i) => { if(!filterFn || filterFn(f)) idxList.push(i); });
      if(!idxList.length) return;
      const subFc = { features: idxList.map(i => fc.features[i]) };
      const subGeometries = idxList.map(i => geometries[i]);

      const { villages, edges } = buildRegionNetwork(topo, subFc, subGeometries);
      allEdges.push(...edges);
      allVillages.push(...villages);
      villages.forEach(v => capitalById.set(v.regionId, v.coord));
      edges.forEach(e => { if(e.kind === 'land' && e.b !== null) addRoad(villages[e.a].regionId, villages[e.b].regionId, e.coords); });
    });

    const pathsFc = {
      type: 'FeatureCollection',
      features: allEdges.map(e => ({
        type: 'Feature', properties: { kind:e.kind },
        geometry: { type: 'LineString', coordinates: e.coords },
      })),
    };
    const villagesFc = {
      type: 'FeatureCollection',
      features: allVillages.map(v => ({
        type: 'Feature', properties: { regionId: v.regionId }, geometry: { type: 'Point', coordinates: v.coord },
      })),
    };

    map.addSource('paths', { type: 'geojson', data: pathsFc });
    map.addLayer({
      id: 'paths', type: 'line', source: 'paths',
      paint: {
        'line-color': '#6b4a2a', 'line-width': 1.4, 'line-opacity': 0.75,
        'line-dasharray': [2, 1.5],
      },
    });

    map.addSource('villages', { type: 'geojson', data: villagesFc });
    map.addLayer({
      id: 'villages-halo', type: 'circle', source: 'villages',
      paint: { 'circle-radius': 5.5, 'circle-color': '#f6efe0', 'circle-opacity': 0.9 },
    });
    map.addLayer({
      id: 'villages', type: 'circle', source: 'villages',
      paint: {
        'circle-radius': 3, 'circle-color': '#4a3418',
        'circle-stroke-color': '#f6efe0', 'circle-stroke-width': 1,
      },
    });
    applyDevFilters();
  }

  // ---------- Navigation maritime (bateaux) ----------
  // Grille fine (data/nav-grid.json, ~5 km): 0 = terre, 1 = mer.
  // Recherche A* sur une grille grossiere (blocs 3x3, ~15 km) pour la vitesse,
  // mais chaque pas est verifie sur la grille fine: jamais de terre, d'ile ni de
  // presqu'ile traversee. Le trajet obtenu est ensuite
  // "tendu" (lignes droites tant qu'elles restent en mer): pas de detour inutile.
  function createNavigator(grid){
    const RES = grid.res, LAT_TOP = grid.latTop, W = grid.w, H = grid.h;
    const nav = new Uint8Array(W * H);
    grid.rows.forEach((r, y) => { let x = 0; for(let k = 0; k < r.length; k += 2){ if(r[k]) nav.fill(r[k], y * W + x, y * W + x + r[k+1]); x += r[k+1]; } });
    const B = 3, W2 = Math.ceil(W / B), H2 = Math.ceil(H / B), N2 = W2 * H2;
    const coarse = new Uint8Array(N2);
    for(let y = 0; y < H; y++){ const cy = (y / B) | 0; for(let x = 0; x < W; x++){ const v = nav[y * W + x]; if(v){ const c = cy * W2 + ((x / B) | 0); if(v > coarse[c]) coarse[c] = v; } } }
    const cosRow = new Float64Array(H); for(let y = 0; y < H; y++) cosRow[y] = Math.cos((LAT_TOP - (y + 0.5) * RES) * Math.PI / 180);
    const wrapX = x => ((x % W) + W) % W, wrapX2 = x => ((x % W2) + W2) % W2;
    const KM = 111.2;
    function kmCells(a, b){ // distance approchee (km) entre deux cellules fines
      const ya = (a / W) | 0, yb = (b / W) | 0;
      let dx = (a - ya * W) - (b - yb * W); if(dx > W / 2) dx -= W; else if(dx < -W / 2) dx += W;
      return Math.hypot(dx * RES * KM * (cosRow[ya] + cosRow[yb]) / 2, (ya - yb) * RES * KM);
    }
    function cellOf(lon, lat){ const y = Math.floor((LAT_TOP - lat) / RES); if(y < 0 || y >= H) return -1; return y * W + wrapX(Math.floor((lon + 180) / RES)); }
    const lonOf = i => -180 + ((i % W) + 0.5) * RES, latOf = i => LAT_TOP - (((i / W) | 0) + 0.5) * RES;
    // ligne de vue en mer entre deux cellules fines (echantillonnee a 1/2 case)
    function los(a, b){
      const ya = (a / W) | 0, yb = (b / W) | 0, xa = a - ya * W; let dx = (b - yb * W) - xa;
      if(dx > W / 2) dx -= W; else if(dx < -W / 2) dx += W;
      const dy = yb - ya, n = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 2) + 1;
      for(let s = 0; s <= n; s++){ const x = wrapX(Math.round(xa + dx * s / n)), y = Math.round(ya + dy * s / n); if(!nav[y * W + x]) return false; }
      return true;
    }
    // point representatif d'un bloc: la cellule de mer la plus "au large" du bloc
    const rep = new Int32Array(N2).fill(-2);
    function repOf(c){
      if(rep[c] !== -2) return rep[c];
      const cy = (c / W2) | 0, cx = c - cy * W2; let best = -1, bs = -1;
      for(let y = cy * B; y < Math.min(H, cy * B + B); y++) for(let x = cx * B; x < cx * B + B; x++){
        if(x >= W) continue; const i = y * W + x; if(!nav[i]) continue;
        let s = 0; for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){ const yy = y + dy; if(yy >= 0 && yy < H && nav[yy * W + wrapX(x + dx)]) s++; }
        if(s > bs){ bs = s; best = i; }
      }
      return rep[c] = best;
    }
    const coarseOf = i => (((i / W) | 0) / B | 0) * W2 + ((((i % W)) / B) | 0);
    // point de mer le plus proche (si le clic tombe sur la terre)
    function snap(lon, lat, maxCells = 60){
      const c0 = cellOf(lon, lat); if(c0 < 0) return -1; if(nav[c0]) return c0;
      const y0 = (c0 / W) | 0, x0 = c0 - y0 * W;
      for(let r = 1; r <= maxCells; r++){ let best = -1, bd = Infinity;
        for(let dy = -r; dy <= r; dy++) for(let dx = -r; dx <= r; dx++){ if(Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; const y = y0 + dy; if(y < 0 || y >= H) continue; const i = y * W + wrapX(x0 + dx); if(nav[i]){ const d = kmCells(i, c0); if(d < bd){ bd = d; best = i; } } }
        if(best >= 0) return best; }
      return -1;
    }
    // A* sur les blocs
    const g = new Float64Array(N2), parent = new Int32Array(N2), stamp = new Int32Array(N2), closed = new Int32Array(N2); let run = 0;
    let hI = new Int32Array(1 << 16), hK = new Float64Array(1 << 16), hn = 0;
    const push = (i, k) => { if(hn >= hI.length){ const a = new Int32Array(hI.length * 2); a.set(hI); hI = a; const b = new Float64Array(hK.length * 2); b.set(hK); hK = b; }
      let p = hn++; while(p > 0){ const q = (p - 1) >> 1; if(hK[q] <= k) break; hI[p] = hI[q]; hK[p] = hK[q]; p = q; } hI[p] = i; hK[p] = k; };
    const pop = () => { const ti = hI[0], tk = hK[0], li = hI[--hn], lk = hK[hn]; let p = 0;
      while(true){ let c = 2 * p + 1; if(c >= hn) break; if(c + 1 < hn && hK[c + 1] < hK[c]) c++; if(hK[c] >= lk) break; hI[p] = hI[c]; hK[p] = hK[c]; p = c; }
      hI[p] = li; hK[p] = lk; return [ti, tk]; };
    const H_WEIGHT = 1.25, MAX_EXPAND = 3e6;
    function findPath(from, to){
      const s = snap(from[0], from[1]), t = snap(to[0], to[1]);
      if(s < 0 || t < 0) return null;
      if(los(s, t)) return finish([s, t]);
      run++; hn = 0;
      // departs: blocs voisins dont le point representatif est visible depuis le bateau
      const seeds = [], goals = new Map();
      const around = (i, fn) => { const c = coarseOf(i), cy = (c / W2) | 0, cx = c - cy * W2;
        for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){ const yy = cy + dy; if(yy < 0 || yy >= H2) continue; const n = yy * W2 + wrapX2(cx + dx); if(coarse[n] && repOf(n) >= 0 && los(i, repOf(n))) fn(n); } };
      around(s, n => seeds.push(n));
      around(t, n => goals.set(n, kmCells(repOf(n), t)));
      if(!seeds.length || !goals.size) return null;
      for(const n of seeds){ stamp[n] = run; g[n] = kmCells(s, repOf(n)); parent[n] = -1; push(n, g[n] + H_WEIGHT * kmCells(repOf(n), t)); }
      let end = -1, exp = 0;
      while(hn){
        const [c, f] = pop(); const rc = repOf(c);
        if(closed[c] === run) continue; closed[c] = run; // chaque bloc n'est traite qu'une fois
        if(goals.has(c)){ end = c; break; }
        if(++exp > MAX_EXPAND) break;
        const cy = (c / W2) | 0, cx = c - cy * W2;
        for(let dy = -1; dy <= 1; dy++){ const yy = cy + dy; if(yy < 0 || yy >= H2) continue;
          for(let dx = -1; dx <= 1; dx++){ if(!dx && !dy) continue; const n = yy * W2 + wrapX2(cx + dx); if(!coarse[n]) continue;
            if(closed[n] === run) continue;
            const rn = repOf(n); if(rn < 0 || !los(rc, rn)) continue;
            const ng = g[c] + kmCells(rc, rn);
            if(stamp[n] !== run || ng < g[n]){ stamp[n] = run; g[n] = ng; parent[n] = c; push(n, ng + H_WEIGHT * kmCells(rn, t)); } } }
      }
      if(end < 0) return null;
      const cells = [t]; for(let c = end; c !== -1; c = parent[c]) cells.push(repOf(c)); cells.push(s);
      return finish(cells.reverse());
    }
    // tend le trajet (plus longues lignes droites en mer), puis coordonnees
    function finish(cells){
      const out = [cells[0]]; let i = 0;
      while(i < cells.length - 1){ let j = i + 1; while(j + 1 < cells.length && los(cells[i], cells[j + 1])) j++; out.push(cells[j]); i = j; }
      const coords = []; let off = 0, prev = null;
      for(const c of out){ let lon = lonOf(c); if(prev !== null){ lon += off; if(lon - prev > 180){ off -= 360; lon -= 360; } else if(lon - prev < -180){ off += 360; lon += 360; } } coords.push([lon, latOf(c)]); prev = lon; }
      let km = 0; for(let k = 1; k < out.length; k++) km += kmCells(out[k-1], out[k]);
      return { coords, km };
    }
    return { findPath, isSea:(lon, lat) => { const c = cellOf(lon, lat); return c >= 0 && nav[c] > 0; }, snap:(lon, lat) => { const c = snap(lon, lat); return c < 0 ? null : [lonOf(c), latOf(c)]; } };
  }

  // ---------- Bateau: point & click, voyages minutes, comptoirs NPC ----------
  // Un bateau (rond) place librement en mer, selectionne d'un clic, puis
  // envoye d'un clic sur une destination: un point en mer ou le port d'un
  // comptoir NPC. Le chemin maritime le plus court est calcule
  // (createNavigator), affiche, puis suivi a vitesse constante. Le voyage est
  // sauvegarde (depart + duree): recharger la page reprend le trajet la ou il
  // en est. Arrive au port d'un comptoir, le bateau y est "a quai".
  const BOAT_STORAGE_KEY = 'paperConquestBoat';
  const BOAT_SPEED_KM_S = 60;   // vitesse de test: 60 km par seconde reelle
  const boat = { pos:null, selected:false, moving:false, placing:false, voyage:null };
  let seaNavigator = null, boatReady = false, boatPathTimer = null, sailRun = 0;
  const capitalById = new Map();  // numero de region -> position de sa capitale
  let npcPorts = [];              // [{ regionId, pos, bearing, dock }]
  try{
    const saved = JSON.parse(localStorage.getItem(BOAT_STORAGE_KEY));
    if(saved && Array.isArray(saved.pos)) boat.pos = saved.pos;
    if(saved && saved.voyage && Array.isArray(saved.voyage.coords)) boat.voyage = saved.voyage;
  }catch(e){}
  const saveBoat = () => { try{ localStorage.setItem(BOAT_STORAGE_KEY, JSON.stringify({ pos:boat.pos, voyage:boat.voyage })); }catch(e){} };
  const normLonLat = ([lon, lat]) => [((lon + 540) % 360) - 180, lat];
  // A quai = voyage arrive dans un port (comptoir ou votre port). Le bateau est
  // alors range dans le port: son icone disparait de la carte, et il repart
  // depuis la fenetre du port (ENVOYER, puis clic sur le port de destination).
  const dockedAt = () => { const v = boat.voyage; if(!v || !v.arrived) return null;
    if(v.destPort) return { kind:'npc', regionId:v.destPort }; if(v.destOwn) return { kind:'own', regionId:v.destOwn }; return null; };
  const dockedPort = () => { const d = dockedAt(); return d && d.kind === 'npc' ? d.regionId : null; };
  const dockedOwn = () => { const d = dockedAt(); return d && d.kind === 'own' ? d.regionId : null; };
  const send = { active:false };
  const voyageLabel = v => v.destPort ? 'Comptoir de la région ' + v.destPort : (v.destOwn ? 'Votre port (région ' + v.destOwn + ')' : 'Point en mer');

  // Surbrillance des ports: un port survole, ou vise par le bateau (en route
  // ou a quai), passe dans la couche "-hl": icone agrandie + halo dore.
  // (La taille d'une icone ne peut pas dependre de l'etat de survol dans
  // MapLibre: on bascule donc le point d'une couche a l'autre par son id.)
  const PORT_HL_SIZE = 1.25;
  const PORT_HALO_PAINT = { 'circle-radius':19, 'circle-color':'#ffd43b', 'circle-opacity':0.55, 'circle-blur':0.35,
    'circle-stroke-color':'#f08c00', 'circle-stroke-width':1.5, 'circle-stroke-opacity':0.7 };
  const portFilter = (ids, highlighted) => ['all', ['==', ['geometry-type'], 'Point'],
    highlighted ? ['in', ['id'], ['literal', ids]] : ['!', ['in', ['id'], ['literal', ids]]]];
  const hoveredPort = { npc:null, own:null };
  function ownPortId(regionId){ const list = regionBuildings(regionId); const i = list.findIndex(b => b.type === 'port'); return i < 0 ? null : regionId * 100 + i; }
  function updatePortHighlights(){
    const v = boat.voyage, npc = new Set(), own = new Set();
    if(hoveredPort.npc !== null) npc.add(hoveredPort.npc);
    if(hoveredPort.own !== null) own.add(hoveredPort.own);
    if(v && v.destPort) npc.add(v.destPort);
    if(v && v.destOwn){ const id = ownPortId(v.destOwn); if(id !== null) own.add(id); }
    const apply = (base, halo, hl, ids) => { if(!map.getLayer(base)) return; map.setFilter(base, portFilter(ids, false)); map.setFilter(halo, portFilter(ids, true)); map.setFilter(hl, portFilter(ids, true)); };
    apply('npc-ports', 'npc-ports-halo', 'npc-ports-hl', [...npc]);
    apply('buildings-icon', 'buildings-halo', 'buildings-icon-hl', [...own]);
  }
  // port sous le curseur (petite tolerance): { kind:'npc'|'own', id, regionId }
  function portAt(point){
    const box = [[point.x - 10, point.y - 10], [point.x + 10, point.y + 10]];
    const layers = ['npc-ports', 'npc-ports-hl', 'buildings-icon', 'buildings-icon-hl'].filter(l => map.getLayer(l));
    const hit = map.queryRenderedFeatures(box, { layers })[0];
    if(!hit) return null;
    return { kind:hit.layer.id.startsWith('npc') ? 'npc' : 'own', id:hit.id, regionId:hit.properties.regionId };
  }

  function boatHint(text){
    const el = document.getElementById('boat-hint');
    if(!el) return;
    el.textContent = text || '';
    el.hidden = !text;
  }
  function boatStatusText(){
    if(boat.placing) return 'Cliquez sur la mer pour poser le bateau.';
    if(!boat.pos) return 'Aucun bateau en mer.';
    if(boat.moving) return 'En route vers : ' + voyageLabel(boat.voyage) + '.';
    if(boat.selected) return 'Bateau sélectionné : cliquez sur une destination (un comptoir violet, ou la mer).';
    if(send.active) return 'Choisissez le port de destination sur la carte.';
    if(dockedPort()) return 'À quai au comptoir de la région ' + dockedPort() + ' : ouvrez le comptoir pour l\'envoyer.';
    if(dockedOwn()) return 'À quai dans votre port (région ' + dockedOwn() + ') : ouvrez le port pour l\'envoyer.';
    return 'Cliquez sur le bateau pour le sélectionner.';
  }
  function renderBoat(){
    const status = document.getElementById('boat-status');
    if(status) status.textContent = boatReady ? boatStatusText() : 'Chargement de la navigation…';
    const btn = document.getElementById('boat-place-btn');
    if(btn){
      btn.disabled = !boatReady || boat.moving;
      btn.textContent = boat.placing ? 'Annuler le placement' : (boat.pos ? 'Replacer le bateau' : 'Placer le bateau');
    }
    if(!boatReady) return;
    map.getSource('boat').setData({ type:'FeatureCollection', features: boat.pos && !dockedAt()
      ? [{ type:'Feature', properties:{ selected:boat.selected }, geometry:{ type:'Point', coordinates:boat.pos } }] : [] });
  }
  function setBoatPath(coords){
    if(!boatReady) return;
    map.getSource('boat-path').setData({ type:'FeatureCollection', features: coords
      ? [{ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:coords } }] : [] });
  }

  function initBoat(navGrid){
    if(!navGrid){ console.warn('Bateau indisponible: pas de grille de navigation.'); return; }
    seaNavigator = createNavigator(navGrid);
    map.addSource('boat-path', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'boat-path', type:'line', source:'boat-path',
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':'#e8590c', 'line-width':3, 'line-dasharray':[1.5, 1.2], 'line-opacity':0.95 } });
    initNpcPorts();
    map.addSource('boat', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'boat-halo', type:'circle', source:'boat',
      paint:{ 'circle-radius':['case', ['get', 'selected'], 17, 12], 'circle-color':'#ffd43b',
        'circle-opacity':['case', ['get', 'selected'], 0.6, 0] } });
    map.addLayer({ id:'boat', type:'circle', source:'boat',
      paint:{ 'circle-radius':8, 'circle-color':'#e8590c', 'circle-stroke-color':'#ffffff', 'circle-stroke-width':2.5 } });
    boatReady = true;
    renderBoat();
    if(boat.voyage && !boat.voyage.arrived) runVoyage(); // reprise d'un voyage en cours

    map.on('mouseenter', 'boat', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'boat', () => { map.getCanvas().style.cursor = ''; });
    map.on('mousemove', (e) => {
      if(placement.active) return;
      const p = portAt(e.point);
      const npc = p && p.kind === 'npc' ? p.id : null, own = p && p.kind === 'own' ? p.id : null;
      if(npc !== hoveredPort.npc || own !== hoveredPort.own){
        hoveredPort.npc = npc; hoveredPort.own = own;
        updatePortHighlights();
        map.getCanvas().style.cursor = p ? 'pointer' : '';
      }
    });
    map.on('click', (e) => {
      if(!ownedRegions.size || placement.active || caravanSend.active) return; // le jeu commence une fois une region achetee
      const [lon, lat] = normLonLat([e.lngLat.lng, e.lngLat.lat]);
      if(boat.placing){
        const p = seaNavigator.snap(lon, lat, 20);
        if(!p){ boatHint('Ce point est sur la terre : cliquez sur la mer.'); return; }
        boat.pos = p; boat.placing = false; boat.selected = false; boat.voyage = null;
        saveBoat(); boatHint(''); renderBoat();
        return;
      }
      const box = [[e.point.x - 10, e.point.y - 10], [e.point.x + 10, e.point.y + 10]];
      const hitPort = portAt(e.point);
      if(send.active){ sendTo(hitPort); return; }
      const port = hitPort && hitPort.kind === 'npc' ? npcPorts.find(p => p.regionId === hitPort.regionId) : null;
      const ownPort = hitPort && hitPort.kind === 'own' ? regionBuildings(hitPort.regionId).find(b => b.type === 'port') : null;
      if(ownPort && !boat.selected){ openOwnPort(hitPort.regionId); return; }
      if(boat.moving || !boat.pos){
        if(port && !boat.selected) boatHint('Comptoir de la région ' + port.regionId + ' : envoyez-y un bateau pour y accéder.');
        return;
      }
      const onBoat = map.queryRenderedFeatures(box, { layers:['boat'] }).length > 0;
      if(onBoat && !port && !ownPort){
        boat.selected = !boat.selected;
        boatHint(boat.selected ? 'Choisissez une destination : un comptoir violet, votre port, ou la mer.' : '');
        renderBoat();
        return;
      }
      if(!boat.selected){
        if(port){
          if(dockedPort() === port.regionId) openNpcPort(port.regionId);
          else boatHint('Comptoir de la région ' + port.regionId + ' : envoyez-y un bateau pour y accéder.');
        }
        return;
      }
      // quai de votre port: juste devant lui, cote mer
      const ownDock = ownPort ? ownPortDock(hitPort.regionId) : null;
      const target = port ? port.dock : (ownDock || [lon, lat]);
      const path = seaNavigator.findPath(boat.pos, target);
      if(!path){ boatHint('Aucun chemin maritime vers ce point.'); return; }
      startVoyage(path, port ? port.regionId : null, ownDock ? hitPort.regionId : null);
    });
  }

  // Ports des comptoirs NPC: sur le littoral de chaque region NPC, au point de
  // cote le plus proche de sa capitale qui soit bien tourne vers la mer.
  function initNpcPorts(){
    npcPorts = [];
    regionsFc.features.filter(f => f.properties.isNpc).forEach(f => {
      const coast = coastOf(f.id); if(!coast) return;
      const cap = capitalById.get(f.id) || turf.centroid(f).geometry.coordinates;
      const pts = [];
      coast.lines.geometry.coordinates.forEach(line => {
        for(let i = 0; i < line.length - 1; i++){
          const a = line[i], b = line[i + 1], n = Math.max(1, Math.ceil(geoDistance(a, b) / 8));
          for(let s = 0; s < n; s++) pts.push([a[0] + (b[0] - a[0]) * s / n, a[1] + (b[1] - a[1]) * s / n]);
        }
      });
      pts.sort((p, q) => geoDistance(p, cap) - geoDistance(q, cap));
      for(const p of pts.slice(0, 400)){
        const probe = probeCoast(p, f);
        if(probe.sea >= 4 && probe.land >= 4){
          const dock = seaNavigator.snap(...normLonLat(offsetKm(p, probe.bearing, 6)), 20);
          if(dock){ npcPorts.push({ regionId:f.id, pos:p, bearing:Math.round(probe.bearing), dock }); break; }
        }
      }
    });
    map.addImage('npc-port-icon', drawPortIcon('#6b3fa0'), { pixelRatio:2 });
    const feats = [];
    npcPorts.forEach(p => {
      feats.push({ type:'Feature', properties:{ regionId:p.regionId }, geometry:{ type:'LineString', coordinates:[p.pos, offsetKm(p.pos, p.bearing, 30)] } });
      feats.push({ type:'Feature', id:p.regionId, properties:{ regionId:p.regionId, label:'Comptoir ' + p.regionId }, geometry:{ type:'Point', coordinates:p.pos } });
    });
    map.addSource('npc-ports', { type:'geojson', data:{ type:'FeatureCollection', features:feats } });
    map.addLayer({ id:'npc-ports-dir', type:'line', source:'npc-ports', filter:['==', ['geometry-type'], 'LineString'],
      paint:{ 'line-color':'#6b3fa0', 'line-width':2.5 } });
    const npcLayout = size => ({ 'icon-image':'npc-port-icon', 'icon-size':size, 'icon-allow-overlap':true, 'icon-ignore-placement':true,
      'text-field':['get', 'label'], 'text-font':['Open Sans Regular'], 'text-size':11, 'text-offset':[0, 1.6 * size], 'text-anchor':'top', 'text-optional':true });
    const npcPaint = { 'text-color':'#4a2b73', 'text-halo-color':'#f6efe0', 'text-halo-width':1.4 };
    map.addLayer({ id:'npc-ports', type:'symbol', source:'npc-ports', filter:portFilter([], false), layout:npcLayout(1), paint:npcPaint });
    map.addLayer({ id:'npc-ports-halo', type:'circle', source:'npc-ports', filter:portFilter([], true), paint:PORT_HALO_PAINT });
    map.addLayer({ id:'npc-ports-hl', type:'symbol', source:'npc-ports', filter:portFilter([], true), layout:npcLayout(PORT_HL_SIZE), paint:npcPaint });
  }

  // Voyage: trajet densifie + distances cumulees, depart et duree en temps reel.
  function startVoyage(path, destPort, destOwn = null){
    const pts = [];
    path.coords.forEach((p, i) => {
      if(i === 0){ pts.push(p); return; }
      const a = path.coords[i - 1], n = Math.max(1, Math.ceil(Math.hypot(p[0] - a[0], p[1] - a[1]) / 0.25));
      for(let s = 1; s <= n; s++) pts.push([a[0] + (p[0] - a[0]) * s / n, a[1] + (p[1] - a[1]) * s / n]);
    });
    const cum = [0];
    for(let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + geoDistance(pts[i - 1], pts[i]));
    const total = cum[cum.length - 1];
    boat.voyage = { coords:pts.map(p => [+p[0].toFixed(4), +p[1].toFixed(4)]), cum:cum.map(v => +v.toFixed(2)), total,
      startedAt:Date.now(), durationMs:Math.max(2000, total / BOAT_SPEED_KM_S * 1000), destPort, destOwn, arrived:false };
    boat.selected = false;
    saveBoat();
    boatHint('Départ vers : ' + voyageLabel(boat.voyage) + ' (' + Math.round(total).toLocaleString('fr-FR') + ' km).');
    runVoyage();
  }
  function voyageProgress(v, now = Date.now()){ return Math.min(1, (now - v.startedAt) / v.durationMs); }
  function positionAlong(v, frac){
    const d = frac * v.total, cum = v.cum, pts = v.coords;
    let k = 1; while(k < cum.length - 1 && cum[k] < d) k++;
    const f = cum[k] > cum[k - 1] ? (d - cum[k - 1]) / (cum[k] - cum[k - 1]) : 1;
    const a = pts[k - 1], b = pts[k];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  // Suit exactement le trajet affiche, d'apres l'heure reelle (reprise possible).
  function runVoyage(){
    const v = boat.voyage;
    clearTimeout(boatPathTimer);
    setBoatPath(v.coords);
    boat.moving = true; renderBoat();
    const run = ++sailRun;
    updatePortHighlights();
    function frame(){
      if(run !== sailRun || !boat.moving) return; // voyage annule ou deja termine
      const frac = voyageProgress(v);
      boat.pos = positionAlong(v, frac);
      renderBoat();
      if(frac < 1){ requestAnimationFrame(frame); return; }
      finishVoyage();
    }
    requestAnimationFrame(frame);
  }
  // Arrivee: declenchee par l'animation, ou par la verification chaque seconde
  // ci-dessous (onglet en arriere-plan: le navigateur suspend l'animation,
  // mais le voyage doit quand meme se terminer a l'heure).
  function finishVoyage(){
    const v = boat.voyage;
    if(!v || v.arrived) return;
    boat.pos = normLonLat(v.coords[v.coords.length - 1]);
    v.arrived = true; boat.moving = false;
    saveBoat(); renderBoat(); updatePortHighlights();
    boatHint(v.destPort ? 'Arrivé au comptoir de la région ' + v.destPort + ' : ouvrez le comptoir ou l\'onglet Voyage de votre capitale.' : (v.destOwn ? 'Arrivé à votre port (région ' + v.destOwn + ').' : 'Arrivé à destination.'));
    boatPathTimer = setTimeout(() => { setBoatPath(null); boatHint(''); }, 3500);
    if(selectedId !== null) renderRegionPanel();
  }
  setInterval(() => { if(boat.moving && boat.voyage && voyageProgress(boat.voyage) >= 1) finishVoyage(); }, 1000);
  function toggleBoatPlacing(){
    if(boat.moving || !boatReady) return;
    boat.placing = !boat.placing; boat.selected = false; send.active = false;
    boatHint(boat.placing ? 'Cliquez sur la mer pour poser le bateau.' : '');
    renderBoat();
  }

  // Onglet VOYAGE de la capitale: destination, progression, temps restant,
  // arrivee; a quai dans un comptoir, acces a la fenetre du port.
  function formatDuration(ms){
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ' h ' : '') + (h || m ? m + ' min ' : '') + r + ' s';
  }
  // Fenetre du port d'un comptoir NPC (accessible uniquement a quai).
  const NPC_PORT_TABS = [
    { id:'comptoir', label:'Comptoir', render:(el, regionId) => {
      const boatHere = dockedPort() === regionId, carHere = sameCity(caravanCity(), { kind:'npc', regionId });
      const card = (t, s) => '<div class="voyage-card"><div class="voyage-head"><span class="voyage-dest">' + t + '</span><span class="voyage-state done">' + s + '</span></div></div>';
      el.innerHTML =
        '<p class="cap-intro">Comptoir de commerce indépendant de la région ' + regionId + '.</p>' +
        '<div class="region-section-title">Services du comptoir</div>' +
        '<ul class="built-list"><li>Commerce de marchandises — bientôt disponible</li><li>Ravitaillement — bientôt disponible</li></ul>' +
        (boatHere ? '<div class="region-section-title">Votre bateau</div>' + card('⚓ À quai au port du comptoir', 'À quai') + SEND_HTML : '') +
        (carHere ? '<div class="region-section-title">Votre caravane</div>' + card('🐪 En ville, au marché du comptoir', 'En ville') +
          '<button class="select-btn" id="caravan-send-btn" type="button">🐪 ENVOYER LA CARAVANE</button>' +
          '<p class="cap-empty">Puis cliquez sur la capitale de destination sur la carte.</p>' : '');
      sendButton(el);
      const cb = el.querySelector('#caravan-send-btn');
      if(cb) cb.addEventListener('click', () => startCaravanSend({ kind:'npc', regionId }));
    } },
  ];
  // quai de votre port: juste devant lui, cote mer
  function ownPortDock(regionId){
    const p = regionBuildings(regionId).find(b => b.type === 'port');
    return p ? seaNavigator.snap(...normLonLat(offsetKm(p.pos, p.bearing || 0, 6)), 20) : null;
  }
  // ENVOYER: la fenetre se ferme, le joueur clique le port de destination.
  function startSend(){
    if(!dockedAt()) return;
    closeCapital();
    send.active = true;
    boatHint('Cliquez sur le port de destination : un comptoir violet ou votre port (Échap pour annuler).');
    renderBoat();
  }
  function cancelSend(){ send.active = false; boatHint(''); renderBoat(); }
  function sendTo(hit){
    if(!hit){ boatHint('Cliquez sur un port : un comptoir violet ou votre port (Échap pour annuler).'); return; }
    const from = dockedAt();
    if(from && from.kind === hit.kind && from.regionId === hit.regionId){ boatHint('Le bateau est déjà dans ce port : choisissez-en un autre.'); return; }
    const target = hit.kind === 'npc' ? npcPorts.find(p => p.regionId === hit.regionId).dock : ownPortDock(hit.regionId);
    const path = target && seaNavigator.findPath(boat.pos, target);
    if(!path){ boatHint('Aucun chemin maritime vers ce port.'); return; }
    send.active = false;
    startVoyage(path, hit.kind === 'npc' ? hit.regionId : null, hit.kind === 'own' ? hit.regionId : null);
  }
  function sendButton(el){
    const b = el.querySelector('#send-btn');
    if(b) b.addEventListener('click', startSend);
  }
  const SEND_HTML = '<button class="select-btn" id="send-btn" type="button">⛵ ENVOYER</button>' +
    '<p class="cap-empty">Puis cliquez sur le port de destination sur la carte.</p>';

  // Fenetre de votre port: bateau a quai (ENVOYER) ou comment l'y faire venir.
  const OWN_PORT_TABS = [
    { id:'port', label:'Port', render:(el, regionId) => {
      const here = dockedOwn() === regionId;
      el.innerHTML =
        '<p class="cap-intro">Votre port, sur le littoral de la région ' + regionId + '.</p>' +
        (here
          ? '<div class="voyage-card"><div class="voyage-head"><span class="voyage-dest">⚓ Votre bateau est à quai</span><span class="voyage-state done">À quai</span></div></div>' + SEND_HTML
          : '<p class="cap-empty">Aucun bateau à quai. Sélectionnez votre bateau en mer, puis cliquez sur ce port pour l\'y faire venir.</p>');
      sendButton(el);
    } },
  ];
  function openOwnPort(regionId){
    if(!ownedRegions.has(regionId)) return;
    openWindow({ kind:'own-port', title:'Port — Région ' + regionId, tabs:OWN_PORT_TABS, ctx:regionId, tab:'port' });
  }
  function openNpcPort(regionId){
    if(dockedPort() !== regionId && !sameCity(caravanCity(), { kind:'npc', regionId })){ boatHint('Votre bateau ou votre caravane doit être dans ce comptoir.'); return; }
    openWindow({ kind:'npc-port', title:'Comptoir — Région ' + regionId, tabs:NPC_PORT_TABS, ctx:regionId, tab:'comptoir' });
  }

  // ---------- Caravane marchande: par la route, de capitale a capitale ----------
  // Meme principe que le bateau, sur terre: la caravane part d'une de vos
  // capitales (onglet Caravane), le joueur clique la capitale d'un comptoir
  // NPC (rond violet) ou une de ses capitales; elle suit le reseau routier
  // (plus court chemin en km sur les routes brunes), en temps reel et
  // sauvegarde. Arrivee en ville, elle y reste (icone masquee) jusqu'a un
  // nouvel ENVOYER depuis la fenetre de la ville.
  const CARAVAN_STORAGE_KEY = 'paperConquestCaravan';
  const CARAVAN_SPEED_KM_S = 20;   // vitesse de test: 20 km par seconde reelle
  const caravan = { pos:null, voyage:null, moving:false };
  const caravanSend = { active:false, from:null };
  const roadGraph = new Map();     // numero de region -> [{ to, coords, km }]
  let caravanReady = false, caravanRun = 0, caravanPathTimer = null;
  const hoveredCity = { npc:null, own:null };
  try{
    const s = JSON.parse(localStorage.getItem(CARAVAN_STORAGE_KEY));
    if(s && s.voyage && Array.isArray(s.voyage.coords)){ caravan.voyage = s.voyage; caravan.pos = s.pos || null; }
  }catch(e){}
  const saveCaravan = () => { try{ localStorage.setItem(CARAVAN_STORAGE_KEY, JSON.stringify({ pos:caravan.pos, voyage:caravan.voyage })); }catch(e){} };
  const caravanCity = () => { const v = caravan.voyage; return v && v.arrived ? v.dest : null; };
  const cityLabel = d => d.kind === 'npc' ? 'Comptoir de la région ' + d.regionId : 'Votre capitale (région ' + d.regionId + ')';
  const sameCity = (a, b) => !!a && !!b && a.kind === b.kind && a.regionId === b.regionId;

  // Reseau routier (routes brunes du reseau terrestre), dans les deux sens.
  function addRoad(fromId, toId, coords){
    let km = 0; for(let i = 1; i < coords.length; i++) km += geoDistance(coords[i - 1], coords[i]);
    if(!roadGraph.has(fromId)) roadGraph.set(fromId, []);
    if(!roadGraph.has(toId)) roadGraph.set(toId, []);
    roadGraph.get(fromId).push({ to:toId, coords, km });
    roadGraph.get(toId).push({ to:fromId, coords:coords.slice().reverse(), km });
  }
  // Plus court chemin (km) sur les routes: Dijkstra simple (500 capitales).
  function roadRoute(fromId, toId){
    const dist = new Map([[fromId, 0]]), prev = new Map(), done = new Set();
    while(true){
      let cur = null, best = Infinity;
      for(const [id, d] of dist) if(!done.has(id) && d < best){ best = d; cur = id; }
      if(cur === null) return null;
      if(cur === toId) break;
      done.add(cur);
      for(const e of roadGraph.get(cur) || []){
        const nd = best + e.km;
        if(nd < (dist.has(e.to) ? dist.get(e.to) : Infinity)){ dist.set(e.to, nd); prev.set(e.to, { from:cur, edge:e }); }
      }
    }
    const legs = []; for(let id = toId; id !== fromId; id = prev.get(id).from) legs.unshift(prev.get(id).edge);
    const coords = []; legs.forEach((e, i) => coords.push(...(i ? e.coords.slice(1) : e.coords)));
    return { coords, km:dist.get(toId) };
  }

  // Capitale sous le curseur: { kind:'npc'|'own', regionId }
  function cityAt(point){
    const box = [[point.x - 9, point.y - 9], [point.x + 9, point.y + 9]];
    const layers = ['npc-capitals', 'npc-capitals-hl', 'capitals-owned'].filter(l => map.getLayer(l));
    const hit = map.queryRenderedFeatures(box, { layers })[0];
    if(!hit) return null;
    return { kind:hit.layer.id.startsWith('npc') ? 'npc' : 'own', regionId:hit.properties.regionId };
  }
  // Surbrillance: capitale survolee, ou destination de la caravane.
  function updateCityHighlights(){
    if(!map.getLayer('npc-capitals')) return;
    const npcIds = regionsFc.features.filter(f => f.properties.isNpc).map(f => f.id);
    const npcHl = new Set(), ownHl = new Set(), d = caravan.voyage && caravan.voyage.dest;
    if(hoveredCity.npc !== null) npcHl.add(hoveredCity.npc);
    if(hoveredCity.own !== null) ownHl.add(hoveredCity.own);
    if(d && d.kind === 'npc') npcHl.add(d.regionId);
    if(d && d.kind === 'own') ownHl.add(d.regionId);
    const inList = ids => ['in', ['get', 'regionId'], ['literal', ids]];
    map.setFilter('npc-capitals', ['all', inList(npcIds), ['!', inList([...npcHl])]]);
    map.setFilter('npc-capitals-halo', inList([...npcHl]));
    map.setFilter('npc-capitals-hl', inList([...npcHl]));
    map.setFilter('capitals-owned-halo', ['all', inList([...ownedRegions]), inList([...ownHl])]);
  }

  function drawCaravanIcon(){
    const c = document.createElement('canvas'); c.width = c.height = 44;
    const g = c.getContext('2d');
    g.fillStyle = '#9c5b1c'; g.strokeStyle = '#ffffff'; g.lineWidth = 3;
    g.beginPath(); g.arc(22, 22, 18, 0, Math.PI * 2); g.fill(); g.stroke();
    g.font = '22px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🐪', 22, 24);
    return g.getImageData(0, 0, 44, 44);
  }
  function initCaravan(){
    map.addImage('caravan-icon', drawCaravanIcon(), { pixelRatio:2 });
    map.addSource('caravan-path', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'caravan-path', type:'line', source:'caravan-path',
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':'#9c5b1c', 'line-width':3.5, 'line-dasharray':[1.2, 1], 'line-opacity':0.95 } });
    // capitales des comptoirs (ronds violets) + surbrillance
    const HALO = { 'circle-radius':16, 'circle-color':'#ffd43b', 'circle-opacity':0.55, 'circle-blur':0.35,
      'circle-stroke-color':'#f08c00', 'circle-stroke-width':1.5, 'circle-stroke-opacity':0.7 };
    map.addLayer({ id:'capitals-owned-halo', type:'circle', source:'villages', filter:['in', ['get', 'regionId'], ['literal', []]], paint:HALO }, 'capitals-owned');
    map.addLayer({ id:'npc-capitals-halo', type:'circle', source:'villages', filter:['in', ['get', 'regionId'], ['literal', []]], paint:HALO });
    map.addLayer({ id:'npc-capitals', type:'circle', source:'villages', filter:['in', ['get', 'regionId'], ['literal', []]],
      paint:{ 'circle-radius':7, 'circle-color':'#6b3fa0', 'circle-stroke-color':'#ffffff', 'circle-stroke-width':2 } });
    map.addLayer({ id:'npc-capitals-hl', type:'circle', source:'villages', filter:['in', ['get', 'regionId'], ['literal', []]],
      paint:{ 'circle-radius':9.5, 'circle-color':'#6b3fa0', 'circle-stroke-color':'#ffffff', 'circle-stroke-width':2.5 } });
    map.addSource('caravan', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'caravan', type:'symbol', source:'caravan',
      layout:{ 'icon-image':'caravan-icon', 'icon-allow-overlap':true, 'icon-ignore-placement':true } });
    caravanReady = true;
    updateCityHighlights();
    renderCaravan();
    if(caravan.voyage && !caravan.voyage.arrived) runCaravan(); // reprise d'un trajet en cours

    map.on('mousemove', (e) => {
      if(placement.active) return;
      const c = cityAt(e.point);
      const npc = c && c.kind === 'npc' ? c.regionId : null, own = c && c.kind === 'own' ? c.regionId : null;
      if(npc !== hoveredCity.npc || own !== hoveredCity.own){
        hoveredCity.npc = npc; hoveredCity.own = own;
        updateCityHighlights();
        if(c) map.getCanvas().style.cursor = 'pointer';
        else if(hoveredPort.npc === null && hoveredPort.own === null) map.getCanvas().style.cursor = '';
      }
    });
    map.on('click', (e) => {
      if(placement.active || send.active) return;
      const city = cityAt(e.point);
      if(caravanSend.active){ caravanTo(city); return; }
      if(!city || city.kind !== 'npc' || boat.selected || boat.placing) return;
      if(sameCity(caravanCity(), city) || dockedPort() === city.regionId) openNpcPort(city.regionId);
      else boatHint('Comptoir de la région ' + city.regionId + ' : envoyez-y une caravane depuis votre capitale (onglet Caravane).');
    });
  }
  function renderCaravan(){
    if(!caravanReady) return;
    map.getSource('caravan').setData({ type:'FeatureCollection', features: caravan.moving && caravan.pos
      ? [{ type:'Feature', properties:{}, geometry:{ type:'Point', coordinates:caravan.pos } }] : [] });
  }
  function setCaravanPath(coords){
    if(!caravanReady) return;
    map.getSource('caravan-path').setData({ type:'FeatureCollection', features: coords
      ? [{ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:coords } }] : [] });

  // Envoi: depuis une de vos capitales (onglet Caravane) ou depuis la ville
  // ou la caravane se trouve (fenetre du comptoir), puis clic sur la capitale
  // de destination.
  function startCaravanSend(from){
    if(caravan.moving) return;
    closeCapital();
    caravanSend.active = true; caravanSend.from = from;
    boatHint('Cliquez sur la capitale de destination : un comptoir (rond violet) ou votre capitale (Échap pour annuler).');
  }
  function cancelCaravanSend(){ caravanSend.active = false; caravanSend.from = null; boatHint(''); }
  function caravanTo(city){
    if(!city){ boatHint('Cliquez sur une capitale : un comptoir (rond violet) ou votre capitale (Échap pour annuler).'); return; }
    const from = caravanSend.from;
    if(sameCity(from, city)){ boatHint('La caravane est déjà dans cette ville : choisissez-en une autre.'); return; }
    const route = roadRoute(from.regionId, city.regionId);
    if(!route || route.coords.length < 2){ boatHint('Aucune route terrestre vers cette capitale (autre continent ?).'); return; }
    caravanSend.active = false; caravanSend.from = null;
    const cum = [0];
    for(let i = 1; i < route.coords.length; i++) cum.push(cum[i - 1] + geoDistance(route.coords[i - 1], route.coords[i]));
    const total = cum[cum.length - 1];
    caravan.voyage = { coords:route.coords.map(p => [+p[0].toFixed(4), +p[1].toFixed(4)]), cum:cum.map(v => +v.toFixed(2)), total,
      startedAt:Date.now(), durationMs:Math.max(2000, total / CARAVAN_SPEED_KM_S * 1000), from, dest:city, arrived:false };
    saveCaravan();
    boatHint('Caravane en route vers : ' + cityLabel(city) + ' (' + Math.round(total).toLocaleString('fr-FR') + ' km).');
    runCaravan();
  }
  function runCaravan(){
    const v = caravan.voyage;
    clearTimeout(caravanPathTimer);
    setCaravanPath(v.coords);
    caravan.moving = true;
    updateCityHighlights();
    const run = ++caravanRun;
    function frame(){
      if(run !== caravanRun || !caravan.moving) return;
      const frac = voyageProgress(v);
      caravan.pos = positionAlong(v, frac);
      renderCaravan();
      if(frac < 1){ requestAnimationFrame(frame); return; }
      finishCaravan();
    }
    requestAnimationFrame(frame);
  }
  function finishCaravan(){
    const v = caravan.voyage;
    if(!v || v.arrived) return;
    caravan.pos = v.coords[v.coords.length - 1];
    v.arrived = true; caravan.moving = false;
    saveCaravan(); renderCaravan(); updateCityHighlights();
    boatHint('Caravane arrivée : ' + cityLabel(v.dest) + (v.dest.kind === 'npc' ? ' — ouvrez le comptoir (rond violet).' : '.'));
    caravanPathTimer = setTimeout(() => { setCaravanPath(null); boatHint(''); }, 3500);
  }
  setInterval(() => { if(caravan.moving && caravan.voyage && voyageProgress(caravan.voyage) >= 1) finishCaravan(); }, 1000);

  // Contenu rafraichi chaque seconde: remplace seulement s'il a change
  // (jamais de bouton recree sous le curseur du joueur).
  function setLiveHtml(el, html){ if(el._liveHtml === html) return false; el._liveHtml = html; el.innerHTML = html; return true; }
  function voyageCardHtml(icon, label, v){
    const frac = voyageProgress(v), remaining = v.arrived ? 0 : v.startedAt + v.durationMs - Date.now();
    return '<div class="voyage-card">' +
      '<div class="voyage-head"><span class="voyage-dest">' + icon + ' ' + label + '</span>' +
        '<span class="voyage-state ' + (v.arrived ? 'done' : 'go') + '">' + (v.arrived ? 'Arrivé' : 'En route') + '</span></div>' +
      '<div class="voyage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(frac * 100) + '"><i style="width:' + (frac * 100).toFixed(1) + '%"></i></div>' +
      '<div class="region-row"><span>Temps restant</span><span class="v">' + (v.arrived ? '—' : formatDuration(remaining)) + '</span></div>' +
      '<div class="region-row"><span>' + (v.arrived ? 'Arrivé à' : 'Arrivée prévue à') + '</span><span class="v">' + new Date(v.startedAt + v.durationMs).toLocaleTimeString('fr-FR') + '</span></div>' +
      '<div class="region-row"><span>Distance</span><span class="v">' + Math.round((1 - frac) * v.total).toLocaleString('fr-FR') + ' / ' + Math.round(v.total).toLocaleString('fr-FR') + ' km</span></div>' +
    '</div>';
  }
