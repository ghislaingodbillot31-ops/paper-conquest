<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
  :root{
    --paper: #f3eddd;
    --paper-alt: #ece2c9;
    --card: #faf6ea;
    --ink: #3c3527;
    --ink-soft: #8c8368;
    --ink-faint: #b3a988;
    --line: #d6c9a3;
    --line-strong: #b3a179;
    --accent: #c1975a;
    --accent-ink: #4a3418;
    --good: #4a8a3f;
    --warn: #b5623a;
    --chart-1: #1f6ba0;
    --chart-2: #4a8a3f;
    --chart-3: #a0632e;
    --ocean: #eef1ea;
    --ocean-line: #aebfc0;
    --shadow: rgba(60,50,30,0.18);
    --reg-namerica: #7f9db3;
    --reg-samerica: #c98868;
    --reg-europe: #93a878;
    --reg-africa: #a08bb0;
    --reg-asia: #d0a758;
    --reg-oceania: #5f9a92;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--paper); color:var(--ink); }
  body{
    font-family:'Nunito', -apple-system, sans-serif;
    font-size:15px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(120,105,70,0.06), transparent 55%);
  }
  h1,h2,h3{ margin:0; font-weight:600; }
  .hand{ font-family:'Caveat','Segoe Script',cursive; }
  button{ font-family:inherit; }

  .app{
    height:100%;
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas: "topbar topbar" "sidebar main";
    min-height:0;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    grid-area:topbar;
    display:flex; align-items:center; gap:22px;
    padding:12px 22px;
    background:var(--card);
    border-bottom:2px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-crest{ width:38px; height:38px; flex:none; }
  .brand-text .hand{ font-size:1.7rem; line-height:1; letter-spacing:0.02em; color:var(--ink); }
  .brand-sub{ font-size:0.72rem; color:var(--ink-soft); font-style:italic; margin-top:1px; }

  .stat-pills{ display:flex; gap:18px; flex-wrap:wrap; margin-left:auto; }
  .stat-pill{ display:flex; align-items:center; gap:8px; }
  .stat-pill .icon{ width:22px; height:22px; flex:none; color:var(--accent-ink); }
  .stat-pill .num{ font-weight:800; font-variant-numeric:tabular-nums; font-size:0.92rem; }
  .stat-pill .delta{ font-size:0.68rem; color:var(--good); display:block; }

  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--line-strong); background:var(--paper-alt);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink);
  }
  .icon-btn:hover{ background:var(--accent); border-color:var(--accent-ink); color:#fff; }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    grid-area:sidebar;
    background:var(--paper-alt);
    border-right:2px solid var(--line);
    padding:14px 8px;
    overflow-y:auto;
    min-height:0;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 12px; margin-bottom:2px;
    border:none; background:transparent; border-radius:9px;
    color:var(--ink); font-size:0.88rem; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .nav-item svg{ width:18px; height:18px; flex:none; color:var(--ink-soft); }
  .nav-item:hover{ background:rgba(193,151,90,0.16); }
  .nav-item.active{ background:var(--card); box-shadow:1px 1px 0 var(--line-strong) inset; }
  .nav-item.active svg{ color:var(--accent-ink); }

  /* ---------- Main workspace ---------- */
  main.workspace{ grid-area:main; padding:16px 22px; min-height:0; display:flex; flex-direction:column; }
  .view{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; }
  .view[hidden]{ display:none; }

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    box-shadow:0 2px 0 var(--shadow);
    padding:14px 16px 16px;
  }
  .card-title{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .card-title .flag{ width:15px; height:11px; flex:none; }
  .card-title h2{ font-size:0.95rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); }
  .card-title .spacer{ flex:1; }
  .card-title a{ font-size:0.76rem; color:var(--accent-ink); text-decoration:none; border-bottom:1px dashed var(--accent-ink); }

  .carte-row{ flex:1 1 auto; min-height:0; display:flex; gap:16px; align-items:stretch; }
  .carte-main{ flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; gap:14px; }

  .map-card{ position:relative; overflow:hidden; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .map-ribbon{
    position:absolute; top:14px; left:14px; z-index:2;
    background:var(--card); border:1.5px solid var(--line-strong);
    border-radius:0 8px 8px 0; padding:6px 14px 6px 10px;
    font-size:0.8rem; font-weight:700; color:var(--ink);
    box-shadow:2px 2px 0 var(--shadow);
  }
  .map-wrap{
    position:relative; width:100%; flex:1 1 auto; min-height:0; border-radius:8px; overflow:hidden;
    background-color:#0e1c38;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 18%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 22% 62%, #f6efe0 100%, transparent),
      radial-gradient(1.6px 1.6px at 35% 12%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 48% 78%, #f6efe0 100%, transparent),
      radial-gradient(1.3px 1.3px at 62% 34%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 74% 58%, #f6efe0 100%, transparent),
      radial-gradient(1.7px 1.7px at 85% 22%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 92% 70%, #f6efe0 100%, transparent),
      radial-gradient(1.2px 1.2px at 15% 90%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 55% 6%, #f6efe0 100%, transparent),
      radial-gradient(1.4px 1.4px at 78% 88%, #f6efe0 100%, transparent),
      radial-gradient(1px 1px at 4% 45%, #f6efe0 100%, transparent),
      linear-gradient(180deg, #0a1730, #16294f);
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
    background-size: 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 100% 100%;
  }
  #map{ position:absolute; inset:0; }
  .map-hint{
    position:absolute; left:14px; bottom:14px; z-index:2;
    background:var(--card); border:1.5px solid var(--line-strong); border-radius:8px;
    padding:5px 10px; font-size:0.72rem; color:var(--ink-soft);
    box-shadow:2px 2px 0 var(--shadow);
  }
  .maplibregl-ctrl-attrib{ font-size:10px; }
  .maplibregl-ctrl-attrib a{ color:var(--ink-soft); }

  .bottom-row{ flex:0 0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; }
  .bottom-row .card{ min-height:0; max-height:230px; overflow-y:auto; }

  .tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .tab{
    border:1.5px solid var(--line-strong); background:var(--paper-alt); color:var(--ink-soft);
    padding:4px 12px; border-radius:7px 7px 0 0; font-size:0.74rem; font-weight:700;
    cursor:pointer; border-bottom:none;
  }
  .tab.active{ background:var(--card); color:var(--ink); }
  .chart-legend{ display:flex; gap:14px; font-size:0.72rem; margin-top:4px; }
  .chart-legend span{ display:flex; align-items:center; gap:5px; }
  .chart-legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chart-tip{
    position:absolute; pointer-events:none; background:var(--ink); color:var(--paper);
    font-size:0.68rem; padding:4px 7px; border-radius:5px; transform:translate(-50%,-115%);
    white-space:nowrap; opacity:0; transition:opacity .1s;
  }
  .chart-box{ position:relative; }

  table.rank{ width:100%; border-collapse:collapse; font-size:0.78rem; }
  table.rank th{ text-align:left; color:var(--ink-soft); font-weight:700; font-size:0.68rem; text-transform:uppercase; padding-bottom:6px; }
  table.rank td{ padding:5px 4px; vertical-align:middle; border-top:1px solid var(--line); }
  table.rank td.num{ font-variant-numeric:tabular-nums; font-weight:700; text-align:right; }
  .rank-bar-track{ background:var(--paper-alt); border-radius:4px; height:8px; overflow:hidden; }
  .rank-bar-fill{ height:100%; border-radius:4px; }
  .rank-name{ display:flex; align-items:center; gap:6px; font-weight:700; }

  .events-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .events-list li{ display:flex; gap:9px; align-items:flex-start; font-size:0.78rem; }
  .events-list .ev-icon{ width:20px; height:20px; flex:none; }
  .events-list .ev-date{ color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:0.7rem; display:block; }

  /* ---------- Region panel ---------- */
  .region-panel{
    flex:0 0 300px; width:300px; max-width:100%;
    display:flex; flex-direction:column; gap:12px;
    min-height:0; overflow-y:auto;
  }
  .region-art{ width:100%; aspect-ratio:16/9; border-radius:9px; overflow:hidden; border:1.5px solid var(--line); }
  .region-art svg{ width:100%; height:100%; display:block; }
  .region-name{ font-size:1.6rem; line-height:1.1; }
  .region-tagline{ font-size:0.78rem; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .region-section-title{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:12px 0 6px; }
  .region-row{ display:flex; justify-content:space-between; gap:10px; font-size:0.8rem; padding:4px 0; border-bottom:1px dotted var(--line); }
  .region-row .v{ font-weight:700; text-align:right; }
  .tag-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .tag-list li{ display:flex; gap:7px; font-size:0.78rem; align-items:flex-start; }
  .tag-list.good li svg{ color:var(--good); }
  .tag-list.warn li svg{ color:var(--warn); }
  .tag-list svg{ width:14px; height:14px; flex:none; margin-top:2px; }

  .select-btn{
    width:100%; padding:11px 0; margin-top:4px;
    background:linear-gradient(180deg,#d3ac71,var(--accent));
    border:1.5px solid var(--accent-ink); border-radius:9px;
    color:var(--accent-ink); font-weight:800; letter-spacing:0.06em; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; box-shadow:0 2px 0 var(--shadow);
  }
  .select-btn:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.4); }
  .select-btn svg{ width:16px; height:16px; }
  .locked-note{ display:none; align-items:center; gap:7px; font-size:0.76rem; color:var(--good); font-weight:700; margin-top:6px; }
  .locked-note svg{ width:15px; height:15px; }
  .region-empty{ font-size:0.82rem; color:var(--ink-soft); padding:20px 4px; text-align:center; }

  .empty-row{ color:var(--ink-soft); font-style:italic; font-size:0.78rem; text-align:center; padding:14px 4px; }
  table.rank .empty-row{ display:table-cell; }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .app{ grid-template-columns:64px 1fr; }
    .nav-item span{ display:none; }
    .nav-item{ justify-content:center; padding:10px; }
    .bottom-row{ grid-template-columns:1fr; }
    .carte-row{ flex-direction:column; }
    .region-panel{ flex:1 1 auto; width:100%; }
    .stat-pills{ gap:12px; }
  }
  @media (max-width:520px){
    .topbar{ padding:10px 14px; gap:12px; }
    .stat-pills{ margin-left:0; order:3; width:100%; justify-content:space-between; }
    main.workspace{ padding:14px 12px 24px; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">

<script>
  // ---------------------------------------------------------------
  // Donnees fictives -- toute l'interface est reelle (navigation,
  // onglets, selection, verrouillage), seules les valeurs affichees
  // sont des exemples en attendant les vraies mecaniques de jeu.
  // ---------------------------------------------------------------
  const NAV_ITEMS = [
    { view:'carte', label:'Carte', icon:'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2Z M9 4v14M15 6v14' },
  ];

  // Les 6 continents ne servent plus qu'a classer/colorer les vraies regions
  // (voir plus bas): couleur (CSS, pour le petit croquis du panneau), couleur
  // hexadecimale equivalente (WebGL MapLibre ne resout pas les var() CSS) et
  // une accroche courte affichee dans le panneau de region.
  const CONTINENTS = [
    { id:'namerica', name:'Amérique du Nord', color:'var(--reg-namerica)', tagline:'Une puissance industrielle et technologique établie.' },
    { id:'samerica', name:'Amérique du Sud', color:'var(--reg-samerica)', tagline:'Un géant agricole aux richesses naturelles immenses.' },
    { id:'europe', name:'Europe', color:'var(--reg-europe)', tagline:'Une région stable et stratégique.' },
    { id:'africa', name:'Afrique', color:'var(--reg-africa)', tagline:'Un continent jeune au potentiel de croissance rapide.' },
    { id:'asia', name:'Asie', color:'var(--reg-asia)', tagline:'Le cœur battant de l\'économie mondiale.' },
    { id:'oceania', name:'Océanie', color:'var(--reg-oceania)', tagline:'Isolée, stable, et riche en ressources naturelles.' },
  ];
  const CONTINENT_BY_ID = {};
  CONTINENTS.forEach(c => { CONTINENT_BY_ID[c.id] = c; });

  const SITUATION_TABS = [
    { id:'economie', label:'Économie', series:[
      { name:'PIB mondial', color:'var(--chart-1)', values:[520,610,690,790,900] },
      { name:'Commerce mondial', color:'var(--chart-2)', values:[300,340,380,430,470] } ] },
    { id:'diplomatie', label:'Diplomatie', series:[
      { name:'Alliances actives', color:'var(--chart-1)', values:[38,41,44,47,52] },
      { name:'Tensions ouvertes', color:'var(--chart-3)', values:[14,16,13,15,11] } ] },
    { id:'militaire', label:'Militaire', series:[
      { name:'Dépenses militaires', color:'var(--chart-1)', values:[210,225,238,250,268] },
      { name:'Conflits actifs', color:'var(--chart-3)', values:[9,8,10,7,6] } ] },
  ];
  const YEARS = [2025,2026,2027,2028,2029];

  // Pas encore de puissances classees ni d'evenements: la partie commence
  // sans economie.
  const RANKING = [];
  const EVENTS = [];

  // ---------- Helpers ----------
  function svgEl(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function iconCheck(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12l5 5 11-11"/></svg>'; }
  function iconWarn(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l9 16H3Z"/><path d="M12 10v4M12 17h.01"/></svg>'; }

  // ---------- Sidebar ----------
  const sidebar = document.getElementById('sidebar');
  NAV_ITEMS.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (i === 0 ? ' active' : '');
    btn.dataset.view = item.view;
    btn.dataset.label = item.dataLabel || item.label;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">' +
      item.icon.split('M').filter(Boolean).map(seg => '<path d="M' + seg.trim() + '"/>').join('') + '</svg><span>' + item.label + '</span>';
    btn.addEventListener('click', () => switchView(btn));
    sidebar.appendChild(btn);
  });
  function switchView(activeBtn){
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b === activeBtn));
    const view = activeBtn.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.view !== view);
  }

  // ---------- Globe (MapLibre GL, vraie geographie) ----------
  // Chaque pays (adm0_a3) est classe dans l'un des 6 continents, seulement
  // pour la couleur et le petit texte de contexte dans le panneau -- les
  // regions cliquables restent les vraies unites admin-1 (1457 morceaux),
  // pas les continents eux-memes.
  const ISO3_CONTINENT = {
    namerica:['BLZ','CAN','CRI','CUB','DOM','GRL','GTM','HND','HTI','MEX','NIC','PAN','USA'],
    samerica:['ARG','BOL','BRA','CHL','COL','ECU','GUY','PER','PRY','SUR','URY','VEN'],
    europe:['ALB','AUT','BEL','BGR','BIH','BLR','CHE','CZE','DEU','DNK','ESP','EST','FIN','FRA','GBR','GRC','HRV','HUN','IRL','ISL','ITA','LTU','LVA','MDA','MKD','NLD','NOR','POL','PRT','ROU','SRB','SVK','SVN','SWE','UKR'],
    africa:['AGO','BEN','BFA','BWA','CAF','CIV','CMR','COD','COG','DZA','EGY','ERI','ETH','GAB','GHA','GIN','KEN','LBR','LBY','MAR','MDG','MLI','MOZ','MRT','NAM','NER','NGA','SAH','SDN','SDS','SEN','SLE','SOL','SOM','TCD','TUN','TZA','UGA','ZAF','ZMB','ZWE'],
    asia:['AFG','ARE','ARM','AZE','BGD','BTN','CHN','GEO','IDN','IND','IRN','IRQ','ISR','JOR','JPN','KAZ','KGZ','KHM','KOR','LAO','LKA','MMR','MNG','MYS','NPL','OMN','PAK','PHL','PRK','RUS','SAU','SYR','TJK','THA','TKM','TUR','TWN','UZB','VNM','YEM'],
    oceania:['AUS','NZL','PNG'],
  };
  const CODE_TO_CONTINENT = {};
  for(const id in ISO3_CONTINENT) ISO3_CONTINENT[id].forEach(code => { CODE_TO_CONTINENT[code] = id; });

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://tiles.basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf',
      sources: {},
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#a7c8d3' } },
      ],
    },
    projection: 'globe',
    center: [12, 22],
    zoom: 1,
    attributionControl: true,
  });
  map.on('error', (e) => console.error('MAPLIBRE ERROR:', e && e.error && e.error.message, e));
  // Le conteneur (carte dans une mise en page flex/grid) peut ne pas avoir
  // sa taille finale au moment ou MapLibre mesure le canvas -- on force un
  // resize des que la taille reelle est connue, et a chaque changement
  // (redimensionnement de fenetre, bascule responsive).
  if(window.ResizeObserver){
    new ResizeObserver(() => map.resize()).observe(document.querySelector('.map-wrap'));
  }

  map.on('style.load', () => {
    if(map.setProjection) map.setProjection({ type: 'globe' });
    if(map.setSky){
      // Fond spatial: bleu sombre etoile derriere le globe (voir le
      // degrade + etoiles CSS sur .map-wrap, visible autour de la sphere).
      try{
        map.setSky({
          'sky-color': '#0a1730',
          'sky-horizon-blend': 0.35,
          'horizon-color': '#1c3560',
          'horizon-fog-blend': 0.5,
          'fog-color': '#16294f',
          'fog-ground-blend': 0.6,
          'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 10, 0],
        });
      }catch(e){ console.warn('setSky non supporte:', e); }
    }
    addRegions();
  });

  // Certains anneaux (Russie/Alaska...) traversent l'antimeridien (+-180)
  // sans etre coupes -- on "deroule" la longitude pour eviter un
  // remplissage qui fait le tour du globe.
  function unwrapRingLongitudes(ring){
    const out = [[ring[0][0], ring[0][1]]];
    let offset = 0;
    for(let i = 1; i < ring.length; i++){
      const rawDelta = ring[i][0] - ring[i-1][0];
      if(rawDelta > 180) offset -= 360;
      else if(rawDelta < -180) offset += 360;
      out.push([ring[i][0] + offset, ring[i][1]]);
    }
    return out;
  }
  function unwrapGeometry(geom){
    if(geom.type === 'Polygon') geom.coordinates = geom.coordinates.map(unwrapRingLongitudes);
    else if(geom.type === 'MultiPolygon') geom.coordinates = geom.coordinates.map(poly => poly.map(unwrapRingLongitudes));
  }

  // Couleur "carte physique" par climat plutot que par pays: le jeu ne doit
  // pas reveler les vraies frontieres politiques (les joueurs creent leurs
  // propres pays sur ce globe), seulement le relief/climat qu'on verrait sur
  // un vrai globe. Degrade continu sur deux axes (temperature + aridite),
  // jamais de zones a bordure dure.
  function lerp(a, b, t){ return a + (b - a) * t; }
  function smooth01(t){ t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  function lerpColor(c1, c2, t){
    t = smooth01(t);
    const p1 = parseInt(c1.slice(1), 16), p2 = parseInt(c2.slice(1), 16);
    const r = Math.round(lerp((p1 >> 16) & 255, (p2 >> 16) & 255, t));
    const g = Math.round(lerp((p1 >> 8) & 255, (p2 >> 8) & 255, t));
    const b = Math.round(lerp(p1 & 255, p2 & 255, t));
    const h = v => v.toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  }

  const COL_DEEP_FOREST = '#1f6b3c'; // grosse foret (equatoriale, humide)
  const COL_FOREST      = '#a9db8e'; // pays forestier (foret temperee)
  const COL_COLD        = '#f5f7f5'; // pays froid
  const COL_HOT_DRY     = '#f0932b'; // climat tres chaud (desert le plus chaud)
  const COL_DESERT      = '#f4e28c'; // desert / steppe seche

  // Chaine humide (foret dense->claire->neige) selon la latitude absolue.
  function humidColor(absLat){
    if(absLat < 12) return lerpColor(COL_DEEP_FOREST, COL_FOREST, absLat / 12);
    if(absLat < 55) return COL_FOREST;
    if(absLat < 68) return lerpColor(COL_FOREST, COL_COLD, (absLat - 55) / 13);
    return COL_COLD;
  }
  // Chaine seche (orange brulant->jaune desert->neige), memes paliers.
  function aridColor(absLat){
    if(absLat < 25) return lerpColor(COL_HOT_DRY, COL_DESERT, absLat / 25);
    if(absLat < 55) return COL_DESERT;
    if(absLat < 68) return lerpColor(COL_DESERT, COL_COLD, (absLat - 55) / 13);
    return COL_COLD;
  }

  // Centres de desert [lat, lon, rayon en degres], pour une aridite continue
  // (score qui s'attenue en douceur avec la distance).
  const ARID_CENTERS = [
    [23, 10, 20],    // Sahara
    [20, 45, 15],    // Peninsule arabique
    [40, 75, 18],    // deserts d'Asie centrale (Gobi, Taklamakan, Kyzylkoum)
    [28, -108, 12],  // sud-ouest des Etats-Unis / Mexique
    [-25, 133, 18],  // interieur australien
    [-24, -69, 8],   // Atacama
    [-23, 18, 12],   // Kalahari / Namib
  ];
  function aridityAt(lat, lon){
    let best = 0;
    for(const [clat, clon, radius] of ARID_CENTERS){
      const d = Math.hypot(lat - clat, lon - clon);
      const score = smooth01(1 - d / (radius * 2));
      if(score > best) best = score;
    }
    return best;
  }

  // Couleur finale: interpole entre la chaine humide et la chaine seche
  // selon l'aridite locale, elle-meme continue -- aucune des deux
  // dimensions ne cree de bordure nette.
  function climateColorAt(lat, lon){
    const absLat = Math.abs(lat);
    const aridity = aridityAt(lat, lon);
    return lerpColor(humidColor(absLat), aridColor(absLat), aridity);
  }

  // Eclaircit/assombrit une couleur hex vers le blanc (amt>0) ou le noir
  // (amt<0). Sert a decliner plusieurs teintes distinctes a l'interieur
  // d'une meme sous-region.
  function tintHex(hex, amt){
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const mix = amt >= 0 ? 255 : 0;
    const p = Math.abs(amt);
    const c = v => Math.round(v + (mix - v) * p).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  }

  // Plus grand anneau (exterieur) d'une geometrie, pour son centroide.
  function largestRing(geom){
    const rings = geom.type === 'Polygon' ? [geom.coordinates[0]]
      : geom.coordinates.map(poly => poly[0]);
    let best = rings[0], bestArea = 0;
    for(const ring of rings){
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for(const [x, y] of ring){
        if(x < minX) minX = x; if(x > maxX) maxX = x;
        if(y < minY) minY = y; if(y > maxY) maxY = y;
      }
      const area = (maxX - minX) * (maxY - minY);
      if(area > bestArea){ bestArea = area; best = ring; }
    }
    return best;
  }

  // Empreinte numerique stable d'une geometrie (centroide approche de son
  // plus grand anneau), graine deterministe pour la variation de teinte.
  function geometrySeed(geom){
    const ring = largestRing(geom);
    let sx = 0, sy = 0;
    for(const [x, y] of ring){ sx += x; sy += y; }
    const cx = Math.round((sx / ring.length) * 1000);
    const cy = Math.round((sy / ring.length) * 1000);
    let h = 0;
    const s = cx + ',' + cy;
    for(let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  let regionsFc = null;

  async function addRegions(){
    const topo = await fetch('data/admin1.topojson').then(r => r.json());
    const objName = Object.keys(topo.objects)[0];
    const geometries = topo.objects[objName].geometries;
    const fc = topojson.feature(topo, topo.objects[objName]);
    fc.features.forEach((f, i) => {
      f.id = i + 1;
      f.properties.regionNum = i + 1;
      f.properties.continent = CODE_TO_CONTINENT[f.properties.adm0_a3] || null;
      // Couleur du climat reel a la position du morceau (pas du pays: aucune
      // frontiere politique reelle n'est reveleee), plus une legere
      // variation de teinte pour eviter des zones plates.
      const ring = largestRing(f.geometry);
      let sx = 0, sy = 0;
      for(const [x, y] of ring){ sx += x; sy += y; }
      const lat = sy / ring.length, lon = sx / ring.length;
      const base = climateColorAt(lat, lon);
      const seed = geometrySeed(f.geometry);
      f.properties.fillColor = tintHex(base, ((seed % 9) - 4) * 0.03);
      unwrapGeometry(f.geometry);
      try{ f.properties.clusterArea = Math.round(turf.area(f) / 1e6); }
      catch(e){ /* garde la valeur stockee si le calcul echoue */ }
    });
    regionsFc = fc;

    map.addSource('regions', { type: 'geojson', data: fc });
    map.addLayer({
      id: 'regions', type: 'fill', source: 'regions',
      paint: { 'fill-color': ['get', 'fillColor'] },
    });
    map.addLayer({
      id: 'regions-outline', type: 'line', source: 'regions',
      paint: { 'line-color': 'rgba(60,53,39,0.35)', 'line-width': 0.5 },
    });
    map.addLayer({
      id: 'regions-selected', type: 'line', source: 'regions',
      paint: {
        'line-color': '#4a3418',
        'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 3, 0],
      },
    });
    // Numero de chaque region affiche dessus -- sert a reperer/signaler une
    // region precise (ex. pour un bug de trace ou de couleur).
    map.addLayer({
      id: 'regions-label', type: 'symbol', source: 'regions',
      layout: {
        'text-field': ['to-string', ['get', 'regionNum']],
        'text-font': ['Open Sans Regular'],
        'text-size': 10,
        'text-allow-overlap': false,
      },
      paint: {
        'text-color': '#3c3527',
        'text-halo-color': '#f6efe0',
        'text-halo-width': 1.2,
      },
    });

    map.on('click', 'regions', (e) => {
      if(locked || !e.features.length) return;
      selectRegion(e.features[0].id);
    });
    map.on('mouseenter', 'regions', () => { if(!locked) map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'regions', () => { map.getCanvas().style.cursor = ''; });

    addVillageNetwork(topo, fc, geometries, f => f.properties.adm0_a3 === 'AUS');

    initSelection();
  }

  // ---------- Reseau de chemins (mondial, adjacence topologique reelle) ----------
  // Village = un point garanti sur la terre de la region (turf.pointOnFeature,
  // contrairement a un centroide qui peut tomber dans l'eau pour une region
  // en croissant ou un archipel).
  // Chemins terrestres = adjacence topologique reelle: deux regions ne sont
  // reliees que si elles partagent un arc du topojson, donc chaque chemin
  // reste sur la terre par construction, relie deux voisins directs (zero
  // region intermediaire) et suit le trajet le plus court possible entre
  // elles. Les iles/archipels sans aucun voisin terrestre (composantes du
  // graphe separees du reste) sont ensuite relies par des liaisons
  // maritimes distinctes (couleur et tirets differents) jusqu'a ce que tout
  // le globe forme un seul reseau connecte.

  // Normalise une longitude dans [-180,180]: nos polygones "deroules"
  // (Russie/Alaska/Fidji, cf. unwrapGeometry) sortent de cette plage, ce qui
  // fausserait un calcul de distance directe entre un point deroule et un
  // point normal proche de l'antimeridien.
  function normLon(lon){
    let l = lon % 360;
    if(l > 180) l -= 360;
    if(l < -180) l += 360;
    return l;
  }
  function geoDistance(a, b){
    return turf.distance([normLon(a[0]), a[1]], [normLon(b[0]), b[1]]);
  }

  // Position de capitale garantie loin de toute frontiere (jamais "a
  // cheval" entre deux regions): on essaie plusieurs points candidats
  // (centre de masse, centroide, point-sur-feature, plus une grille dans
  // l'emprise de la region) et on garde celui dont la distance a la
  // frontiere la plus proche est maximale -- une approximation rapide du
  // "pole d'inaccessibilite" sans dependance externe.
  // Densite de grille et simplification du contour adaptees a la SURFACE
  // reelle de la region (turf.area): une grande region (ex. un Etat
  // australien) a plus a gagner d'une grille fine, une petite n'en a pas
  // besoin: son interieur est deja proche de la frontiere partout. Le
  // contour est simplifie avant les mesures de distance (calcul par
  // sommets, donc couteux sur un tres long trait de cote) avec une
  // tolerance elle aussi liee a la taille de la region -- suffisant pour
  // choisir un bon point interieur sans re-suivre chaque micro-detail des
  // LIMITES DE FRONTIERE.
  function safeInteriorPoint(feature){
    const bounds = turf.bbox(feature);
    const areaKm2 = turf.area(feature) / 1e6;
    const GRID = areaKm2 > 200000 ? 7 : areaKm2 > 20000 ? 6 : areaKm2 > 2000 ? 5 : 4;
    let boundaryLine;
    try{ boundaryLine = turf.polygonToLine(feature); }catch(e){ boundaryLine = null; }
    let lines = boundaryLine ? (boundaryLine.type === 'FeatureCollection' ? boundaryLine.features : [boundaryLine]) : [];
    const tolerance = Math.max(0.01, Math.sqrt(areaKm2) / 4000);
    lines = lines.map(l => { try{ return turf.simplify(l, { tolerance, highQuality:false }); }catch(e){ return l; } });
    function distToBoundary(pt){
      let min = Infinity;
      lines.forEach(l => {
        try{ const d = turf.pointToLineDistance(pt, l, { units:'kilometers' }); if(d < min) min = d; }catch(e){}
      });
      return min === Infinity ? 0 : min;
    }
    const candidates = [];
    const tryAdd = (pt) => { if(pt && turf.booleanPointInPolygon(pt, feature)) candidates.push(pt); };
    try{ tryAdd(turf.centerOfMass(feature).geometry.coordinates); }catch(e){}
    try{ tryAdd(turf.centroid(feature).geometry.coordinates); }catch(e){}
    try{ tryAdd(turf.pointOnFeature(feature).geometry.coordinates); }catch(e){}
    for(let gx = 0; gx < GRID; gx++){
      for(let gy = 0; gy < GRID; gy++){
        const x = bounds[0] + (bounds[2]-bounds[0]) * (gx+0.5)/GRID;
        const y = bounds[1] + (bounds[3]-bounds[1]) * (gy+0.5)/GRID;
        tryAdd([x, y]);
      }
    }
    if(!candidates.length) return turf.pointOnFeature(feature).geometry.coordinates;
    let best = candidates[0], bestD = -1;
    candidates.forEach(c => { const d = distToBoundary(c); if(d > bestD){ bestD = d; best = c; } });
    return best;
  }

  // ---------- Detection de croisement entre deux tracés (segments) ----------
  // Prefiltre par boite englobante (tres bon marche) avant le test complet
  // segment-par-segment: la grande majorite des paires de tracés sur une
  // carte n'ont meme pas leurs emprises qui se touchent.
  function bboxOfCoords(coords){
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    coords.forEach(([x, y]) => {
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
    });
    return [minX, minY, maxX, maxY];
  }
  function bboxOverlap(a, b){
    return a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];
  }
  function segmentsIntersect(p1, p2, p3, p4){
    function ccw(a, b, c){ return (c[1]-a[1]) * (b[0]-a[0]) > (b[1]-a[1]) * (c[0]-a[0]); }
    return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
  }
  function pathsCross(coordsA, bboxA, coordsB, bboxB){
    if(!bboxOverlap(bboxA, bboxB)) return false;
    for(let i = 0; i < coordsA.length - 1; i++){
      for(let j = 0; j < coordsB.length - 1; j++){
        if(segmentsIntersect(coordsA[i], coordsA[i+1], coordsB[j], coordsB[j+1])) return true;
      }
    }
    return false;
  }
  function crossesExisting(coords, existingEdges){
    const bb = bboxOfCoords(coords);
    return existingEdges.some(e => pathsCross(coords, bb, e.coords, e.bbox));
  }

  function windingPath(a, b, amplitudeScale){
    const distKm = geoDistance(a, b);
    const segments = 22;
    const amplitudeDeg = (Math.min(distKm * 0.08, 80) / 111) * amplitudeScale;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1e-9;
    const nx = -dy / len, ny = dx / len; // perpendiculaire unitaire
    // graine deterministe (memes points -> meme ondulation a chaque chargement)
    const seed = Math.abs(Math.sin(a[0] * 12.9898 + a[1] * 78.233 + b[0] * 37.719 + b[1] * 11.135) * 43758.5453) % 1;
    const wiggles = 2 + (seed > 0.5 ? 1 : 0);
    const phase = seed * Math.PI * 2;
    const pts = [];
    for(let i = 0; i <= segments; i++){
      const t = i / segments;
      const bx = a[0] + dx * t, by = a[1] + dy * t;
      // Sinus au carre plutot que simple: vaut 0 ET a une derivee nulle aux
      // deux bouts (pas seulement une position nulle), donc l'ondulation
      // demarre/finit en douceur -- essentiel pour les tracés en deux
      // demi-trajets (capitale -> frontiere -> capitale): sans ca, les deux
      // moities pouvaient se rejoindre avec un coude brusque au point de
      // jonction meme si leurs positions coincidaient exactement.
      const taper = Math.pow(Math.sin(t * Math.PI), 2);
      const wob = Math.sin(t * Math.PI * wiggles + phase) * amplitudeDeg * taper;
      pts.push([bx + nx * wob, by + ny * wob]);
    }
    return pts;
  }

  function pathStaysOnLandSingle(coords, land){
    for(let i = 1; i < coords.length - 1; i++){
      if(!turf.booleanPointInPolygon(coords[i], land)) return false;
    }
    return true;
  }
  function pathStaysOnLand(coords, landA, landB){
    for(let i = 1; i < coords.length - 1; i++){
      const pt = coords[i];
      if(!turf.booleanPointInPolygon(pt, landA) && !turf.booleanPointInPolygon(pt, landB)) return false;
    }
    return true;
  }

  // Plusieurs points candidats (15/30/50/70/85%) le long de la plus longue
  // frontiere reellement partagee entre les deux regions (calculee via les
  // arcs topojson, donc la vraie limite terrestre, pas une approximation):
  // le trace passera obligatoirement par un point de CETTE frontiere avant
  // de rejoindre chaque capitale, jamais par un raccourci qui coupe a
  // travers l'eau ou une troisieme region. Plusieurs points sont testes
  // (pas seulement le milieu) car pres d'une baie ou d'un golfe, un point
  // median peut faire sortir un des deux segments dans l'eau alors qu'un
  // autre point de la meme frontiere reelle passe.
  function borderWaypoints(topo, geomI, geomJ){
    let mesh;
    try{
      mesh = topojson.mesh(topo, { type:'GeometryCollection', geometries:[geomI, geomJ] },
        (a, b) => (a === geomI && b === geomJ) || (a === geomJ && b === geomI));
    }catch(e){ return []; }
    const lines = mesh && mesh.coordinates;
    if(!lines || !lines.length) return [];
    let longest = lines[0], longestLen = -1;
    lines.forEach(line => {
      let len = 0;
      for(let i = 1; i < line.length; i++) len += geoDistance(line[i-1], line[i]);
      if(len > longestLen){ longestLen = len; longest = line; }
    });
    function pointAtFraction(frac){
      let acc = 0;
      const target = longestLen * frac;
      for(let i = 1; i < longest.length; i++){
        const seg = geoDistance(longest[i-1], longest[i]);
        if(acc + seg >= target){
          const t = seg === 0 ? 0 : (target - acc) / seg;
          return [
            longest[i-1][0] + (longest[i][0] - longest[i-1][0]) * t,
            longest[i-1][1] + (longest[i][1] - longest[i-1][1]) * t,
          ];
        }
        acc += seg;
      }
      return longest[longest.length - 1];
    }
    return [0.5, 0.3, 0.7, 0.15, 0.85].map(pointAtFraction);
  }

  // Essaie chaque point de frontiere candidat, et pour chacun toutes les
  // amplitudes d'ondulation valides (de la plus sinueuse a la ligne droite)
  // sur les deux demi-trajets capitale -> frontiere -> capitale, chaque
  // demi-trajet devant rester entierement dans SA propre region.
  function allWindingLegs(p1, p2, land){
    const out = [];
    for(const scale of [1, 0.4, 0]){
      const coords = windingPath(p1, p2, scale);
      if(pathStaysOnLandSingle(coords, land)) out.push(coords);
    }
    return out;
  }
  // Angle de virage (en degres) qu'imposerait un point de frontiere donne:
  // cap direct capitale->frontiere compare au cap frontiere->autre capitale.
  // Sert a classer les points de frontiere candidats du plus doux au plus
  // brusque, pour ne pas choisir arbitrairement le premier valide et se
  // retrouver avec un coude prononce alors qu'un point voisin de la meme
  // frontiere donnait un virage bien plus naturel.
  function bearingDeg(p, q){ return Math.atan2(q[1]-p[1], q[0]-p[0]) * 180 / Math.PI; }
  function bearingTurn(a, waypoint, b){
    let diff = bearingDeg(waypoint, b) - bearingDeg(a, waypoint);
    while(diff > 180) diff -= 360;
    while(diff < -180) diff += 360;
    return Math.abs(diff);
  }

  // Parmi toutes les combinaisons valides (sur terre), prefere celle qui ne
  // croise AUCUN trace deja pose (les routes ne doivent pas se croiser);
  // si vraiment aucune combinaison ne l'evite (zone tres dense), garde la
  // meilleure trouvee plutot que de sacrifier la connexion elle-meme -- ne
  // jamais traverser l'eau reste la seule regle strictement non negociable.
  // Les points de frontiere sont essayes du virage le plus doux au plus
  // brusque (bearingTurn croissant) pour eviter un trace en "coude" alors
  // qu'une option plus naturelle existait sur la meme frontiere.
  // Repli sur l'ancien trajet direct si aucune frontiere n'a pu etre
  // extraite. Si rien ne passe du tout (cas rarissime, ex. les deux regions
  // se touchent uniquement au bord d'une baie), renvoie null: on abandonne
  // alors cette connexion precise plutot que de tricher.
  function landPath(topo, a, b, geomI, geomJ, landA, landB, existingEdges){
    let fallback = null;
    const waypoints = borderWaypoints(topo, geomI, geomJ)
      .slice()
      .sort((w1, w2) => bearingTurn(a, w1, b) - bearingTurn(a, w2, b));
    for(const waypoint of waypoints){
      const legs1 = allWindingLegs(a, waypoint, landA);
      const legs2 = allWindingLegs(waypoint, b, landB);
      for(const leg1 of legs1){
        for(const leg2 of legs2){
          const coords = leg1.concat(leg2.slice(1));
          if(!fallback) fallback = coords;
          if(!crossesExisting(coords, existingEdges)) return coords;
        }
      }
    }
    for(const scale of [1, 0.4, 0]){
      const coords = windingPath(a, b, scale);
      if(pathStaysOnLand(coords, landA, landB)){
        if(!fallback) fallback = coords;
        if(!crossesExisting(coords, existingEdges)) return coords;
      }
    }
    return fallback;
  }

  function makeUnionFind(n){
    const parent = Array.from({ length:n }, (_, i) => i);
    const size = new Array(n).fill(1);
    function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b){
      let ra = find(a), rb = find(b);
      if(ra === rb) return false;
      if(size[ra] < size[rb]){ const t = ra; ra = rb; rb = t; }
      parent[rb] = ra; size[ra] += size[rb];
      return true;
    }
    function sizeOf(x){ return size[find(x)]; }
    return { find, union, sizeOf };
  }

  // Grille lon/lat grossiere pour retrouver rapidement les villages proches
  // d'un point donne sans comparer chaque village a tous les autres.
  function buildSpatialGrid(villages, cellDeg){
    const grid = new Map();
    villages.forEach((v, i) => {
      const gx = Math.floor(v.gcoord[0] / cellDeg), gy = Math.floor(v.gcoord[1] / cellDeg);
      const k = gx + ',' + gy;
      if(!grid.has(k)) grid.set(k, []);
      grid.get(k).push(i);
    });
    return { grid, cellDeg };
  }

  // Plus proche village appartenant a une AUTRE composante que celle de
  // `idx`, par recherche en anneaux de cellules grandissants (un anneau de
  // marge une fois un candidat trouve, car la distance en cellules
  // sous-estime legerement la distance reelle pres des coins).
  function nearestOtherComponent(idx, villages, spatial, find, degree, maxDegree){
    if(degree[idx] >= maxDegree) return null;
    const rootI = find(idx);
    const { grid, cellDeg } = spatial;
    const gx0 = Math.floor(villages[idx].gcoord[0] / cellDeg), gy0 = Math.floor(villages[idx].gcoord[1] / cellDeg);
    let best = null, marginLeft = 1;
    for(let ring = 0; ring <= 90; ring++){
      for(let dx = -ring; dx <= ring; dx++){
        for(let dy = -ring; dy <= ring; dy++){
          if(Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
          const cell = grid.get((gx0 + dx) + ',' + (gy0 + dy));
          if(!cell) continue;
          for(const j of cell){
            if(find(j) === rootI) continue;
            if(degree[j] >= maxDegree) continue;
            const d = geoDistance(villages[idx].gcoord, villages[j].gcoord);
            if(!best || d < best.d) best = { j, d };
          }
        }
      }
      if(best){
        if(marginLeft <= 0) break;
        marginLeft--;
      }
    }
    return best;
  }

  // Relie les composantes isolees (iles, archipels, continents separes par
  // la mer) via l'algorithme de Boruvka: a chaque tour, chaque composante
  // trouve sa liaison sortante la moins couteuse et toutes fusionnent en
  // parallele -- le nombre de composantes est au moins divise par deux a
  // chaque tour.
  // Chercher depuis TOUS les villages est inutile: une fois qu'une
  // composante est enorme (le gros de l'Eurasie-Afrique ou des Ameriques),
  // la liaison qu'elle merite est de toute facon trouvee depuis le cote
  // minoritaire (memes paires, distance symetrique) -- on ne fait donc
  // chercher que les villages des petites composantes ("originCap"), ce
  // qui reduit le travail de ~1450 a quelques centaines de recherches.
  // Si plus aucune petite composante n'a de candidat alors qu'il en reste
  // plusieurs (typiquement les deux ou trois plus grosses masses
  // continentales entre elles), on retire temporairement cette limite pour
  // les derniers tours, peu nombreux a ce stade.
  function connectComponentsBoruvka(villages, uf, degree, maxDegree){
    const n = villages.length;
    const spatial = buildSpatialGrid(villages, 4);
    const originCap = Math.max(50, Math.round(Math.sqrt(n) * 3));
    const countRoots = () => { const r = new Set(); for(let i = 0; i < n; i++) r.add(uf.find(i)); return r.size; };
    const seaEdges = [];
    let uncapped = false;
    for(let round = 0; round < 60; round++){
      if(countRoots() <= 1) break;
      const cap = uncapped ? Infinity : originCap;
      const bestByRoot = new Map();
      for(let i = 0; i < n; i++){
        if(degree[i] >= maxDegree) continue;
        if(uf.sizeOf(i) > cap) continue;
        const cand = nearestOtherComponent(i, villages, spatial, uf.find, degree, maxDegree);
        if(!cand) continue;
        const root = uf.find(i);
        const prev = bestByRoot.get(root);
        if(!prev || cand.d < prev.d) bestByRoot.set(root, { i, j:cand.j, d:cand.d });
      }
      if(bestByRoot.size === 0){
        if(uncapped) break; // plus rien a relier meme sans limite
        uncapped = true;
        continue;
      }
      let merged = false;
      bestByRoot.forEach(({ i, j }) => {
        if(degree[i] >= maxDegree || degree[j] >= maxDegree) return; // sature entretemps ce tour
        if(uf.union(i, j)){
          seaEdges.push([i, j]);
          degree[i]++; degree[j]++;
          merged = true;
        }
      });
      if(!merged && uncapped) break;
    }
    return seaEdges;
  }

  // Chaque capitale a droit a 4 tracés maximum: on ne considère que les
  // paires de voisins directs réels (adjacence topojson, jamais une
  // connexion qui saute par-dessus une region), triées de la plus proche a
  // la plus lointaine, et on les ajoute une a une tant que les deux
  // capitales concernées n'ont pas atteint la limite -- les connexions les
  // plus pertinentes (les plus proches) sont donc toujours prioritaires.
  const MAX_DEGREE = 4;

  // Connexions explicitement retirees (paire de regions par id) meme si ce
  // sont de vrais voisins -- le reste du reseau (plafonds adaptatifs, regle
  // des 2 frontieres) se reajuste automatiquement autour de cette absence.
  // Construit toujours via forbiddenKey (ordre des deux id sans importance)
  // pour eviter une erreur de saisie sur l'ordre exact de la cle.
  function forbiddenKey(idA, idB){ return idA < idB ? idA + '-' + idB : idB + '-' + idA; }
  const FORBIDDEN_EDGES = new Set([
    forbiddenKey(1406, 1419),
    forbiddenKey(1417, 1384),
    forbiddenKey(1415, 1421),
  ]);

  // Distance fixe (km) entre la cote et le trace maritime principal --
  // ajustable ici, tout le reste (buffer, simplification, ponts entre
  // anneaux) s'adapte automatiquement a cette valeur.
  const COASTAL_ROUTE_OFFSET_KM = 50;

  // Trace maritime principal: on fusionne toutes les regions en un seul
  // territoire, on "gonfle" son contour de COASTAL_ROUTE_OFFSET_KM (turf.buffer
  // suit deja nativement chaque baie/golfe a distance constante -- c'est
  // exactement une ligne sinueuse parallele a la cote), puis on recupere ce
  // contour comme trace. Le buffer separe naturellement le continent des
  // iles trop eloignees (chacune garde son propre anneau): on relie ensuite
  // tous les anneaux entre eux par leurs deux points les plus proches
  // (arbre couvrant minimal) pour obtenir un seul reseau maritime continu,
  // qui passe donc par les iles/ecueils intermediaires les plus proches
  // plutot que de sauter directement d'une cote a une autre tres eloignee.
  function buildCoastalRoute(features, offsetKm){
    let union, buffered, routeFc;
    try{
      union = turf.union(turf.featureCollection(features));
      buffered = turf.buffer(union, offsetKm, { units:'kilometers' });
      routeFc = turf.polygonToLine(buffered);
    }catch(e){ console.warn('Trace maritime cotier impossible a calculer:', e); return null; }

    let rings = (routeFc.type === 'FeatureCollection' ? routeFc.features : [routeFc])
      .map(f => f.geometry.type === 'MultiLineString' ? f.geometry.coordinates : [f.geometry.coordinates])
      .flat();
    // simplifie chaque anneau (moins de micro-dents issues du buffer) tout en gardant l'allure sinueuse
    rings = rings.map(r => {
      try{ return turf.simplify(turf.lineString(r), { tolerance:0.01, highQuality:true }).geometry.coordinates; }
      catch(e){ return r; }
    });

    // Ponts entre anneaux separes, avec les index d'anneaux memorises (i, j)
    // pour pouvoir ensuite retrouver le chemin exact dans get l'arbre.
    const bridges = [];
    if(rings.length > 1){
      function nearestBetween(r1, r2){
        let best = null;
        for(const p1 of r1) for(const p2 of r2){
          const d = geoDistance(p1, p2);
          if(!best || d < best.d) best = { p1, p2, d };
        }
        return best;
      }
      const parent = Array.from({ length:rings.length }, (_, i) => i);
      function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
      const pairs = [];
      for(let i = 0; i < rings.length; i++) for(let j = i + 1; j < rings.length; j++) pairs.push([i, j, nearestBetween(rings[i], rings[j])]);
      pairs.sort((p1, p2) => p1[2].d - p2[2].d);
      for(const [i, j, best] of pairs){
        if(find(i) !== find(j)){ parent[find(i)] = find(j); bridges.push({ i, j, ...best }); }
      }
    }

    const mainRingIdx = rings.reduce((best, r, idx) => r.length > rings[best].length ? idx : best, 0);

    function nearestOnRoute(pt){
      let best = null;
      rings.forEach((ring, idx) => {
        const np = turf.nearestPointOnLine(turf.lineString(ring), turf.point(pt));
        if(!best || np.properties.dist < best.dist) best = { coord:np.geometry.coordinates, dist:np.properties.dist, ring:idx };
      });
      return best;
    }

    // Chemin (liste d'index de ponts) du continent (mainRingIdx) jusqu'a
    // l'anneau vise, par parcours en largeur de l'arbre des ponts -- sert a
    // ne garder, au rendu, que les anneaux/ponts reellement empruntes par
    // une connexion utile plutot que de dessiner un contour autour de
    // chaque ilot decoratif sans lien avec le reseau.
    function bridgePathTo(targetRing){
      if(targetRing === mainRingIdx) return [];
      const adj = new Map();
      bridges.forEach((b, bi) => {
        if(!adj.has(b.i)) adj.set(b.i, []);
        if(!adj.has(b.j)) adj.set(b.j, []);
        adj.get(b.i).push({ to:b.j, bridge:bi });
        adj.get(b.j).push({ to:b.i, bridge:bi });
      });
      const visited = new Set([mainRingIdx]);
      const queue = [[mainRingIdx, []]];
      while(queue.length){
        const [cur, path] = queue.shift();
        if(cur === targetRing) return path;
        (adj.get(cur) || []).forEach(({ to, bridge }) => {
          if(!visited.has(to)){ visited.add(to); queue.push([to, path.concat(bridge)]); }
        });
      }
      return [];
    }

    return { rings, bridges, mainRingIdx, nearestOnRoute, bridgePathTo };
  }

  function buildRegionNetwork(topo, fc, geometries){
    const n = fc.features.length;
    const villages = fc.features.map(f => {
      const coord = safeInteriorPoint(f);
      return { regionId:f.id, coord, gcoord:[normLon(coord[0]), coord[1]] };
    });

    let neighborIdx;
    try{ neighborIdx = topojson.neighbors(geometries); }
    catch(e){ console.warn('Calcul des voisinages topologiques impossible:', e); neighborIdx = fc.features.map(() => []); }

    const candidates = [];
    for(let i = 0; i < n; i++){
      for(const j of neighborIdx[i]){
        if(j <= i) continue; // chaque paire de voisins une seule fois
        if(FORBIDDEN_EDGES.has(forbiddenKey(fc.features[i].id, fc.features[j].id))) continue;
        candidates.push([i, j, geoDistance(villages[i].coord, villages[j].coord)]);
      }
    }

    // Plafond de connexions par capitale: 4 par defaut (MAX_DEGREE), releve
    // au cas par cas UNIQUEMENT pour les capitales qui en ont reellement
    // besoin pour atteindre chacun de leurs vrais voisins en 2 frontieres
    // maximum (jamais au-dela de LAND_DEGREE_CEILING) -- la plupart des
    // regions restent a 3, seuls les carrefours a nombreux voisins montent.
    const LAND_DEGREE_CEILING = 6;
    const cap = new Array(n).fill(MAX_DEGREE);
    let uf, degree, edges, skippedUnroutable;

    function runLandPass(){
      uf = makeUnionFind(n);
      degree = new Array(n).fill(0);
      edges = [];
      skippedUnroutable = 0;
      // Priorise a chaque etape la paire dont la capitale la MOINS connectee
      // (relativement a SON propre plafond) profiterait le plus, a distance
      // egale la plus courte gagne -- evite qu'une region ayant pourtant
      // plusieurs vrais voisins ne se retrouve avec un seul trace simplement
      // parce que ses voisins ont deja ete pris par des paires plus courtes
      // ailleurs.
      const remaining = candidates.slice();
      while(remaining.length){
        let bestIdx = -1, bestScore = Infinity, bestDist = Infinity;
        for(let k = 0; k < remaining.length; k++){
          const [i, j, d] = remaining[k];
          if(degree[i] >= cap[i] || degree[j] >= cap[j]){ remaining.splice(k, 1); k--; continue; }
          const score = Math.max(degree[i] / cap[i], degree[j] / cap[j]);
          if(score < bestScore || (score === bestScore && d < bestDist)){
            bestScore = score; bestDist = d; bestIdx = k;
          }
        }
        if(bestIdx === -1) break;
        const [i, j] = remaining[bestIdx];
        remaining.splice(bestIdx, 1);
        const coords = landPath(topo, villages[i].coord, villages[j].coord, geometries[i], geometries[j], fc.features[i], fc.features[j], edges);
        if(!coords){ skippedUnroutable++; continue; } // aucun trace valide sans traverser l'eau: on abandonne cette paire plutot que de tricher
        edges.push({ a:i, b:j, coords, bbox:bboxOfCoords(coords), kind:'land' });
        uf.union(i, j);
        degree[i]++; degree[j]++;
      }
    }

    // Chaque paire de vrais voisins doit rester a 2 tracés maximum l'une de
    // l'autre dans le reseau construit; sinon, on augmente le plafond des
    // deux capitales concernees (jamais au-dela du plafond maximal) et on
    // reconstruit -- quelques tours suffisent, la plupart des regions ne
    // sont jamais concernees.
    function findTwoHopViolations(){
      const adj = Array.from({ length:n }, () => []);
      edges.forEach(e => { if(e.kind === 'land'){ adj[e.a].push(e.b); adj[e.b].push(e.a); } });
      const violations = [];
      for(let i = 0; i < n; i++){
        const dist = new Array(n).fill(Infinity);
        dist[i] = 0;
        const queue = [i];
        while(queue.length){
          const cur = queue.shift();
          for(const nx of adj[cur]) if(dist[nx] === Infinity){ dist[nx] = dist[cur] + 1; queue.push(nx); }
        }
        for(const j of neighborIdx[i]){
          if(j <= i) continue;
          if(dist[j] > 2) violations.push([i, j]);
        }
      }
      return violations;
    }

    runLandPass();
    for(let round = 0; round < 15; round++){
      const violations = findTwoHopViolations();
      if(!violations.length) break;
      let raised = false;
      violations.forEach(([i, j]) => {
        [i, j].forEach(node => {
          if(degree[node] >= cap[node] && cap[node] < LAND_DEGREE_CEILING){ cap[node]++; raised = true; }
        });
      });
      if(!raised) break; // plafond maximal atteint partout ou necessaire: on garde le meilleur reseau obtenu
      runLandPass();
    }
    if(skippedUnroutable) console.warn(skippedUnroutable, 'connexion(s) terrestre(s) abandonnee(s): aucun trace ne pouvait eviter l\'eau.');

    // Regions non reliees par la terre au plus gros bloc continental (les
    // iles): chacune rejoint le trace maritime principal par son point de
    // connexion le plus proche -- jamais une capitale eloignee choisie au
    // hasard, toujours la distance la plus courte vers la route cotiere.
    let coastalRoute = null;
    const linkedByCoast = new Set();
    const coastalRouteFull = buildCoastalRoute(fc.features, COASTAL_ROUTE_OFFSET_KM);
    if(coastalRouteFull){
      const compSize = new Map();
      for(let i = 0; i < n; i++){ const r = uf.find(i); compSize.set(r, (compSize.get(r) || 0) + 1); }
      const mainRoot = [...compSize.entries()].sort((a, b) => b[1] - a[1])[0][0];
      // N'affiche que le contour du continent (mainRingIdx) plus les
      // anneaux/ponts reellement empruntes par une connexion insulaire --
      // jamais un contournement complet d'un ilot qui n'a besoin d'aucune
      // liaison maritime.
      const usedRings = new Set([coastalRouteFull.mainRingIdx]);
      const usedBridges = new Set();
      for(let i = 0; i < n; i++){
        if(uf.find(i) === mainRoot) continue;
        if(degree[i] >= MAX_DEGREE) continue;
        const np = coastalRouteFull.nearestOnRoute(villages[i].coord);
        const coords = windingPath(villages[i].coord, np.coord, 0.15);
        edges.push({ a:i, b:null, coords, kind:'sea' });
        degree[i]++;
        linkedByCoast.add(i);
        usedRings.add(np.ring);
        coastalRouteFull.bridgePathTo(np.ring).forEach(bi => {
          usedBridges.add(bi);
          usedRings.add(coastalRouteFull.bridges[bi].i);
          usedRings.add(coastalRouteFull.bridges[bi].j);
        });
      }
      coastalRoute = {
        rings: coastalRouteFull.rings.filter((_, idx) => usedRings.has(idx)),
        bridges: coastalRouteFull.bridges.filter((_, bi) => usedBridges.has(bi)),
      };
    } else {
      // repli: ancien systeme de liaison directe capitale-a-capitale si le
      // trace maritime cotier n'a pas pu etre calcule.
      const seaEdges = connectComponentsBoruvka(villages, uf, degree, MAX_DEGREE);
      seaEdges.forEach(([i, j]) => {
        const coords = windingPath(villages[i].coord, villages[j].coord, 0.15);
        edges.push({ a:i, b:j, coords, kind:'sea' });
        linkedByCoast.add(i); linkedByCoast.add(j);
      });
    }

    const roots = new Set();
    for(let i = 0; i < n; i++){ if(!linkedByCoast.has(i)) roots.add(uf.find(i)); }
    if(roots.size > 1) console.warn('Reseau non entierement connecte:', roots.size, 'composantes restantes (capitales saturees a', MAX_DEGREE, 'connexions).');

    return { villages, edges, coastalRoute };
  }

  // filterFn restreint le reseau (villages + chemins) a un sous-ensemble de
  // regions (ex. un seul pays) -- l'adjacence topojson ne comparant que les
  // geometries passees en entree, les regions exclues n'influencent ni les
  // voisinages terrestres ni les liaisons maritimes du sous-ensemble.
  function addVillageNetwork(topo, fc, geometries, filterFn){
    const idxList = [];
    fc.features.forEach((f, i) => { if(!filterFn || filterFn(f)) idxList.push(i); });
    const subFc = { features: idxList.map(i => fc.features[i]) };
    const subGeometries = idxList.map(i => geometries[i]);

    const { villages, edges, coastalRoute } = buildRegionNetwork(topo, subFc, subGeometries);

    const pathsFc = {
      type: 'FeatureCollection',
      features: edges.map(e => ({
        type: 'Feature', properties: { kind:e.kind },
        geometry: { type: 'LineString', coordinates: e.coords },
      })),
    };
    const villagesFc = {
      type: 'FeatureCollection',
      features: villages.map(v => ({
        type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: v.coord },
      })),
    };

    // Trace maritime principal (cote + ponts entre anneaux separes) --
    // sous les tracés terrestres/maritimes des capitales, couleur distincte
    // (sarcelle) pour bien le differencier des routes brunes et des
    // connecteurs bleus capitale-vers-route.
    if(coastalRoute){
      const routeFc = {
        type: 'FeatureCollection',
        features: [
          ...coastalRoute.rings.map(r => ({ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:r } })),
          ...coastalRoute.bridges.map(b => ({ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:[b.p1, b.p2] } })),
        ],
      };
      map.addSource('coastal-route', { type: 'geojson', data: routeFc });
      map.addLayer({
        id: 'coastal-route', type: 'line', source: 'coastal-route',
        paint: {
          'line-color': '#2f8f7a', 'line-width': 1, 'line-opacity': 0.6,
          'line-dasharray': [3, 2],
        },
      });
    }

    map.addSource('paths', { type: 'geojson', data: pathsFc });
    map.addLayer({
      id: 'paths', type: 'line', source: 'paths',
      paint: {
        'line-color': ['case', ['==', ['get', 'kind'], 'sea'], '#1f6ba0', '#6b4a2a'],
        'line-width': ['case', ['==', ['get', 'kind'], 'sea'], 1.6, 1.4],
        'line-opacity': 0.75,
        'line-dasharray': ['case', ['==', ['get', 'kind'], 'sea'], ['literal', [1, 1.6]], ['literal', [2, 1.5]]],
      },
    });

    map.addSource('villages', { type: 'geojson', data: villagesFc });
    map.addLayer({
      id: 'villages-halo', type: 'circle', source: 'villages',
      paint: { 'circle-radius': 5.5, 'circle-color': '#f6efe0', 'circle-opacity': 0.9 },
    });
    map.addLayer({
      id: 'villages', type: 'circle', source: 'villages',
      paint: {
        'circle-radius': 3, 'circle-color': '#4a3418',
        'circle-stroke-color': '#f6efe0', 'circle-stroke-width': 1,
      },
    });
  }

  // ---------- Region panel / start selection (persisted in localStorage) ----------
  const STORAGE_KEY = 'paperConquestStart';
  let selectedId = null;
  let locked = false;

  function loadStart(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveStart(id){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ id, lockedAt:new Date().toISOString() })); }
    catch(e){ console.warn('localStorage indisponible, choix non persisté:', e); }
  }

  function selectRegion(id){
    if(locked) return;
    if(selectedId !== null) map.setFeatureState({ source:'regions', id:selectedId }, { selected:false });
    selectedId = id;
    map.setFeatureState({ source:'regions', id }, { selected:true });
    renderRegionPanel();
  }

  function validateSelection(){
    if(locked || selectedId === null) return;
    locked = true;
    saveStart(selectedId);
    renderRegionPanel();
  }

  function renderRegionPanel(){
    const panel = document.getElementById('region-panel');
    if(selectedId === null){
      panel.innerHTML = '<div class="region-empty">Cliquez sur une région du globe pour voir ses informations.</div>';
      return;
    }
    const f = regionsFc.features.find(x => x.id === selectedId);
    const c = f && f.properties.continent ? CONTINENT_BY_ID[f.properties.continent] : null;
    const contName = c ? c.name : 'Territoire neutre';
    const contColor = c ? c.color : 'var(--paper-alt)';
    const area = f ? Math.round(f.properties.clusterArea || 0).toLocaleString('fr-FR') + ' km²' : '-';
    panel.innerHTML =
      '<div class="region-art"><svg viewBox="0 0 300 170"><rect width="300" height="170" fill="' + contColor + '" opacity="0.25"/>' +
        '<path d="M0 130 L40 90 L70 110 L110 60 L150 100 L190 75 L230 115 L260 95 L300 130 V170 H0 Z" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.55"/>' +
        '<circle cx="250" cy="35" r="16" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5"/></svg></div>' +
      '<div><h3 class="region-name hand">Région ' + selectedId + '</h3><div class="region-tagline">' + contName + (c ? ' — ' + c.tagline : '') + '</div></div>' +
      '<div class="region-section-title">Informations de la région</div>' +
      '<div class="region-row"><span>Numéro</span><span class="v">' + selectedId + '</span></div>' +
      '<div class="region-row"><span>Aire</span><span class="v">' + area + '</span></div>' +
      '<div class="region-row"><span>Continent</span><span class="v">' + contName + '</span></div>' +
      '<button class="select-btn" id="select-btn" ' + (locked ? 'disabled' : '') + '>' + iconCheck() + (locked ? 'CHOIX VALIDÉ' : 'SÉLECTIONNER') + '</button>' +
      '<div class="locked-note" id="locked-note" style="display:' + (locked ? 'flex' : 'none') + ';">' + iconCheck() + 'Choix de départ validé, définitif.</div>';
    const btn = document.getElementById('select-btn');
    if(!locked) btn.addEventListener('click', validateSelection);
  }

  function initSelection(){
    const saved = loadStart();
    if(saved && typeof saved.id === 'number' && regionsFc.features.some(f => f.id === saved.id)){
      selectedId = saved.id;
      locked = true;
      map.setFeatureState({ source:'regions', id:selectedId }, { selected:true });
      document.getElementById('map-ribbon').textContent = '🔒 Région de départ verrouillée';
    }
    renderRegionPanel();
  }

  // ---------- Line chart (shared renderer, used by "Situation mondiale" and "Économie") ----------
  function renderLineChart(svg, legendEl, tipEl, tab){
    svg.innerHTML = '';
    const W = 400, H = tab.h || 170, padL = 34, padR = 12, padT = 12, padB = 22;
    const all = tab.series.flatMap(s => s.values);
    const min = Math.min(...all), max = Math.max(...all);
    const yMin = min - (max-min)*0.15, yMax = max + (max-min)*0.15;
    const x = i => padL + (i/(YEARS.length-1)) * (W-padL-padR);
    const y = v => H-padB - ((v-yMin)/(yMax-yMin)) * (H-padT-padB);

    // grille
    for(let i=0;i<4;i++){
      const gy = padT + (i/3)*(H-padT-padB);
      svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:'var(--line)', 'stroke-width':1 }));
    }
    YEARS.forEach((yr,i) => {
      const t = svgEl('text', { x:x(i), y:H-6, 'text-anchor':'middle', 'font-size':9, fill:'var(--ink-soft)', 'font-family':'Nunito' });
      t.textContent = yr; svg.appendChild(t);
    });

    tab.series.forEach(s => {
      const d = s.values.map((v,i) => (i===0?'M':'L') + x(i) + ',' + y(v)).join(' ');
      svg.appendChild(svgEl('path', { d, fill:'none', stroke:s.color, 'stroke-width':2.4, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
      s.values.forEach((v,i) => {
        if(i === s.values.length-1) svg.appendChild(svgEl('circle', { cx:x(i), cy:y(v), r:4, fill:s.color }));
      });
    });

    legendEl.innerHTML = tab.series.map(s => '<span><i style="background:' + s.color + '"></i>' + s.name + '</span>').join('');

    // hover crosshair + tooltip
    const hitG = svgEl('g', {});
    svg.appendChild(hitG);
    const guide = svgEl('line', { y1:padT, y2:H-padB, stroke:'var(--ink-soft)', 'stroke-width':1, 'stroke-dasharray':'2,3', opacity:0 });
    hitG.appendChild(guide);
    const dots = tab.series.map(s => { const d = svgEl('circle', { r:4, fill:s.color, opacity:0 }); hitG.appendChild(d); return d; });
    const rect = svgEl('rect', { x:padL, y:padT, width:W-padL-padR, height:H-padT-padB, fill:'transparent' });
    rect.addEventListener('mousemove', (e) => {
      const box = svg.getBoundingClientRect();
      const px = ((e.clientX - box.left) / box.width) * W;
      let idx = Math.round(((px-padL)/(W-padL-padR)) * (YEARS.length-1));
      idx = Math.max(0, Math.min(YEARS.length-1, idx));
      guide.setAttribute('x1', x(idx)); guide.setAttribute('x2', x(idx)); guide.setAttribute('opacity', 1);
      dots.forEach((d,si) => { d.setAttribute('cx', x(idx)); d.setAttribute('cy', y(tab.series[si].values[idx])); d.setAttribute('opacity', 1); });
      tipEl.style.opacity = 1;
      tipEl.style.left = (x(idx)/W*100) + '%';
      tipEl.style.top = (y(Math.max(...tab.series.map(s=>s.values[idx])))/H*100) + '%';
      tipEl.innerHTML = YEARS[idx] + ' — ' + tab.series.map(s => s.name+': '+s.values[idx]).join(' · ');
    });
    rect.addEventListener('mouseleave', () => {
      guide.setAttribute('opacity', 0);
      dots.forEach(d => d.setAttribute('opacity', 0));
      tipEl.style.opacity = 0;
    });
    svg.appendChild(rect);
  }

  // Situation mondiale (tabs)
  const situationTabsEl = document.getElementById('situation-tabs');
  SITUATION_TABS.forEach((t,i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i===0 ? ' active' : '');
    b.textContent = t.label;
    b.addEventListener('click', () => {
      situationTabsEl.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderLineChart(document.getElementById('situation-chart'), document.getElementById('situation-legend'), document.getElementById('chart-tip'), t);
    });
    situationTabsEl.appendChild(b);
  });
  renderLineChart(document.getElementById('situation-chart'), document.getElementById('situation-legend'), document.getElementById('chart-tip'), SITUATION_TABS[0]);

  // ---------- Ranking (vide: pas encore de puissances classees) ----------
  const rankBody = document.getElementById('rank-body');
  if(RANKING.length){
    const maxPower = Math.max(...RANKING.map(r => r.power));
    RANKING.forEach((r,i) => {
      const lightness = 68 - (r.power/maxPower)*30;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="num">' + (i+1) + '</td>' +
        '<td class="rank-name">' + r.flag + ' ' + r.name + '</td>' +
        '<td style="width:50%"><div class="rank-bar-track"><div class="rank-bar-fill" style="width:' + r.power + '%; background:hsl(206,45%,' + lightness + '%)"></div></div></td>' +
        '<td class="num">' + r.power + '%</td>';
      rankBody.appendChild(tr);
    });
  } else {
    rankBody.innerHTML = '<tr><td colspan="4" class="empty-row">Aucune puissance classée pour le moment.</td></tr>';
  }

  // ---------- Events (vide: pas encore d'evenements) ----------
  const eventsList = document.getElementById('events-list');
  if(EVENTS.length){
    EVENTS.forEach(ev => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="ev-icon">' + ev.icon + '</span><span><span class="ev-date">' + ev.date + '</span>' + ev.text + '</span>';
      eventsList.appendChild(li);
    });
  } else {
    eventsList.innerHTML = '<li class="empty-row">Aucun événement pour le moment.</li>';
  }

  // ---------- Clock ----------
  function tickClock(){
    const now = new Date();
    document.getElementById('topbar-time').textContent = now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
  tickClock();
  setInterval(tickClock, 30000);
</script>
