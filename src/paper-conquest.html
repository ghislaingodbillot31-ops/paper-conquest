  // ---------- Ressources des regions (algorithme + filtre developpeur) ----------
  // 1. Profil de chaque region, deterministe, tire de la geographie de la
  //    carte: latitude (climat), aridite (meme modele que les couleurs de la
  //    carte), acces a la mer (littoral reel), indices de fertilite, de foret
  //    et de paturage, relief et gisements du sous-sol (bruit "geologique":
  //    un champ continu par minerai, zones coherentes a l'echelle d'un pays).
  //    -> A remplacer/affiner par l'etude des sols: seules les fonctions de
  //    profil changeront, les regles et le filtre restent.
  // 2. Chaque ressource a une regle score(profil) -> 0..1; le niveau
  //    (0 absente, 1 faible, 2 moyenne, 3 riche) vient de seuils. Les
  //    produits transformes dependent de leurs matieres premieres.
  const RESOURCE_CATEGORIES = [
    { id:'agricole', label:'Agricole', items:['ble', 'orge', 'seigle', 'avoine', 'vin', 'huile', 'miel'] },
    { id:'elevage', label:'Élevage', items:['betail', 'moutons'] },
    { id:'alimentaire', label:'Alimentaire', items:['sel', 'poisson', 'fromage'] },
    { id:'epices', label:'Épices', items:['poivre', 'cannelle', 'girofle', 'muscade', 'safran'] },
    { id:'luxe', label:'Denrées de luxe', items:['sucre', 'fourrures', 'ambre', 'ivoire', 'perles'] },
    { id:'textile', label:'Textile', items:['laine', 'lin', 'chanvre', 'soie', 'draps'] },
    { id:'teinture', label:'Teinture', items:['garance', 'pastel'] },
    { id:'artisanat', label:'Artisanat', items:['cuir', 'cire', 'suif'] },
    { id:'metal', label:'Métal', items:['fer', 'etain', 'cuivre', 'plomb'] },
    { id:'precieux', label:'Métal précieux', items:['argent', 'or'] },
    { id:'minerai', label:'Minerai', items:['alun'] },
    { id:'construction', label:'Matériau de construction', items:['bois', 'bois_chauffage', 'pierre', 'chaux'] },
    { id:'naval', label:'Matériau naval', items:['poix'] },
    { id:'manufacture', label:'Manufacturé', items:['armes', 'outils', 'poterie', 'verre'] },
    { id:'boisson', label:'Boisson', items:['biere', 'cidre'] },
  ];

  // outils de score: fenetre douce [a, b] avec transition de largeur s
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const band = (x, a, b, s = 5) => clamp01(Math.min((x - a) / s + 1, (b - x) / s + 1));
  // bruit de valeur lisse (0..1), meme famille que les frontieres ondulees
  function geoHash(ix, iy, s){ let h = (ix * 374761393 + iy * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
  function geoNoise(lon, lat, seed, waveKm){
    const x = lon * 111.2 * Math.cos(lat * Math.PI / 180) / waveKm, y = lat * 111.2 / waveKm;
    const layer = (x, y, s) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const a = geoHash(ix, iy, s), b = geoHash(ix + 1, iy, s), c = geoHash(ix, iy + 1, s), d = geoHash(ix + 1, iy + 1, s);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
    return (layer(x, y, seed) * 0.65 + layer(x * 2.3, y * 2.3, seed + 31) * 0.35);
  }

    biere:         { name:'Bière',                score:(p, r) => r.orge && p.absLat > 38 ? 0.35 + r.orge * 0.15 : 0 },

  const RESOURCE_SEEDS = { fer:11, etain:23, cuivre:37, plomb:41, argent:53, or:67, alun:71, sel:83, pierre:97, chaux:101, argile:113, epices:127, perles:131, soie:137 };
  const RESOURCE_LEVELS = ['Absente', 'Faible', 'Moyenne', 'Riche'];
  const levelOf = s => s >= 0.75 ? 3 : s >= 0.55 ? 2 : s >= 0.38 ? 1 : 0;

  // Profil d'une region (a remplacer par l'etude des sols)
  function regionProfile(f){
    const c = capitalById.get(f.id) || turf.centroid(f).geometry.coordinates;
    const lon = ((c[0] + 540) % 360) - 180, lat = c[1], absLat = Math.abs(lat);
    const arid = aridityAt(lat, lon), humid = 1 - arid;
    const cold = smooth01((absLat - 50) / 20), tropical = 1 - smooth01((absLat - 12) / 12);
    const relief = geoNoise(lon, lat, 7, 900);
    const coastal = !!coastOf(f.id);
    const forest = clamp01(humid * 1.15 - 0.1) * (1 - smooth01((absLat - 64) / 8)) * (1 - relief * 0.25);
    const fertile = clamp01(humid * 1.1 - 0.05) * (1 - cold) * (1 - relief * 0.45) * (1 - tropical * 0.25);
    const pasture = clamp01(1 - Math.abs(arid - 0.35) * 1.8) * (1 - cold * 0.7);
    const geo = {}; for(const [k, s] of Object.entries(RESOURCE_SEEDS)) geo[k] = geoNoise(lon, lat, s, 700);
    return { lon, lat, absLat, arid, humid, cold, tropical, relief, coastal, forest, fertile, pasture, geo };
  }
  // Part cible de regions (0..1) pour les ressources dont la regle repose
  // sur le bruit geologique ou qui seraient sinon trop repandues: seules les
  // regions les mieux notees l'obtiennent (le quart superieur: riche, puis
  // moyenne, puis faible). Les autres ressources gardent des seuils fixes.
  const RESOURCE_SHARE = {
    fer:0.35, etain:0.08, cuivre:0.22, plomb:0.18, argent:0.08, or:0.07, alun:0.06,
    pierre:0.55, chaux:0.4, sel:0.25, poterie:0.45, poivre:0.1, ivoire:0.14, perles:0.14,
    poisson:0.45, verre:0.2, armes:0.22, suif:0.4, betail:0.45, miel:0.35, bois:0.5, bois_chauffage:0.6,
    orge:0.3, poix:0.2,
  };
  const regionResources = new Map();  // numero de region -> { ressource: niveau }
  function computeResources(){
    const feats = regionsFc.features, profiles = feats.map(regionProfile), res = feats.map(() => ({}));
    // matieres premieres d'abord, puis produits qui en dependent (regle a 2 arguments)
    const order = Object.keys(RESOURCES).sort((x, y) => (RESOURCES[x].score.length > 1) - (RESOURCES[y].score.length > 1));
    for(const id of order){
      const scores = feats.map((f, i) => Math.max(0, RESOURCES[id].score(profiles[i], res[i]) || 0));
      const share = RESOURCE_SHARE[id];
      if(share === undefined){ scores.forEach((s, i) => { const lv = levelOf(s); if(lv) res[i][id] = lv; }); continue; }
      const ranked = scores.map((s, i) => [s, i]).filter(x => x[0] > 0).sort((x, y) => y[0] - x[0]).slice(0, Math.round(share * feats.length));
      ranked.forEach(([, i], k) => { const q = k / ranked.length; res[i][id] = q < 0.25 ? 3 : q < 0.6 ? 2 : 1; });
    }
    feats.forEach((f, i) => regionResources.set(f.id, res[i]));
  }

  // Filtre developpeur: une ressource -> regions colorees selon l'abondance
  let resourceFilter = null;
  function applyResourceFilter(){
    if(!map.getLayer('resource-fill')) return;
    const counts = [0, 0, 0, 0];
    regionsFc.features.forEach(f => {
      const lv = resourceFilter ? (regionResources.get(f.id)[resourceFilter] || 0) : 0;
      counts[lv]++;
      map.setFeatureState({ source:'regions', id:f.id }, { res:lv });
    });
    map.setLayoutProperty('resource-fill', 'visibility', resourceFilter ? 'visible' : 'none');
    const info = document.getElementById('dev-resource-info');
    if(!resourceFilter){ info.innerHTML = ''; return; }
    info.innerHTML = '<div class="res-count">Présente dans <b>' + (counts[1] + counts[2] + counts[3]) + '</b> régions sur ' + regionsFc.features.length + '</div>' +
      [3, 2, 1].map(lv => '<div class="res-legend"><i class="lv' + lv + '"></i>' + RESOURCE_LEVELS[lv] + '<span>' + counts[lv] + '</span></div>').join('');
  }
  function initResources(){
    computeResources();
    map.addLayer({ id:'resource-fill', type:'fill', source:'regions', layout:{ visibility:'none' },
      paint:{
        'fill-color':['match', ['feature-state', 'res'], 3, '#0b7a3e', 2, '#43b05c', 1, '#b7e3a1', '#3c3527'],
        'fill-opacity':['match', ['feature-state', 'res'], 3, 0.85, 2, 0.75, 1, 0.7, 0.45],
      } }, 'regions-outline');
    const sel = document.getElementById('dev-resource');
    sel.innerHTML = '<option value="">— Aucune ressource —</option>' + RESOURCE_CATEGORIES.map(cat =>
      '<optgroup label="' + cat.label + '">' + cat.items.map(id => '<option value="' + id + '">' + RESOURCES[id].name + '</option>').join('') + '</optgroup>').join('');
    sel.disabled = false;
    sel.addEventListener('change', () => { resourceFilter = sel.value || null; applyResourceFilter(); });
    if(selectedId !== null) renderRegionPanel();
  }
  // Liste des ressources d'une region, par categorie (panneau de region)
  function regionResourcesHtml(id){
    const r = regionResources.get(id);
    if(!r) return '';
    const groups = RESOURCE_CATEGORIES.map(cat => {
      const items = cat.items.filter(k => r[k]);
      return items.length ? '<div class="res-group"><span class="res-cat">' + cat.label + '</span>' +
        items.map(k => '<span class="res-chip lv' + r[k] + '" title="' + RESOURCE_LEVELS[r[k]] + '">' + RESOURCES[k].name + '</span>').join('') + '</div>' : '';
    }).join('');
    return '<div class="region-section-title">Ressources</div>' + (groups || '<p class="cap-empty">Aucune ressource notable.</p>');
  }

  // ---------- Onglet DEVELOPPEUR: afficher/masquer les couches ----------
  // Les couches sont creees de facon asynchrone (apres le calcul du
  // reseau): applyDevFilters() est rappele a leur creation et ignore
  // simplement celles qui n'existent pas encore. Choix memorise par
  // navigateur (localStorage), la carte marche aussi sans.
  const DEV_FILTERS = [
    { id:'land', label:'Voie terrestre' },
    { id:'towns', label:'Ville' },
    { id:'numbers', label:'Numéro' },
  ];
  const DEV_STORAGE_KEY = 'paperConquestDevFilters';
  const devState = { land:true, towns:true, numbers:true };
  try{ Object.assign(devState, JSON.parse(localStorage.getItem(DEV_STORAGE_KEY)) || {}); }catch(e){}

  function setLayerVisible(layerId, visible){
    if(map.getLayer(layerId)) map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
  }
  function applyDevFilters(){
    setLayerVisible('paths', devState.land);
    setLayerVisible('villages', devState.towns);
    setLayerVisible('villages-halo', devState.towns);
    setLayerVisible('regions-label', devState.numbers);
  }

  (function initDevPanel(){
    const tab = document.getElementById('dev-tab');
    const box = document.getElementById('dev-filters');
    DEV_FILTERS.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'dev-filter';
      btn.innerHTML = '<i></i><span>' + f.label + '</span>';
      btn.setAttribute('aria-pressed', String(devState[f.id]));
      btn.addEventListener('click', () => {
        devState[f.id] = !devState[f.id];
        btn.setAttribute('aria-pressed', String(devState[f.id]));
        try{ localStorage.setItem(DEV_STORAGE_KEY, JSON.stringify(devState)); }catch(e){}
        applyDevFilters();
      });
      document.getElementById('dev-filter-list').appendChild(btn);
    });
    tab.addEventListener('click', () => {
      const open = box.hidden;
      box.hidden = !open;
      tab.setAttribute('aria-expanded', String(open));
    });
  })();

  // ---------- Regions: propriete, capitale, construction (sauvegarde locale) ----------
  // Etat du joueur, memorise dans ce navigateur (localStorage):
  //  - regions possedees (ids), achetees depuis le panneau de region;
  //  - batiments construits, par region: [{ type, pos, bearing, builtAt }].
  // Pas encore de serveur de jeu: "un autre joueur" n'existe pas encore, mais
  // chaque achat verifie deja que la region n'a pas de proprietaire (owner).
  const OWNED_STORAGE_KEY = 'paperConquestOwned';
  const BUILDINGS_STORAGE_KEY = 'paperConquestBuildings';
  const LEGACY_START_KEY = 'paperConquestStart'; // ancien achat unique, repris une fois
  let selectedId = null;
  let ownedRegions = new Set();
  let buildings = {};
  let regionTopo = null, regionGeoms = null;

  function loadPlayerState(){
    try{ const o = JSON.parse(localStorage.getItem(OWNED_STORAGE_KEY)); if(Array.isArray(o)) ownedRegions = new Set(o); }catch(e){}
    try{ const b = JSON.parse(localStorage.getItem(BUILDINGS_STORAGE_KEY)); if(b && typeof b === 'object') buildings = b; }catch(e){}
    try{
      const legacy = JSON.parse(localStorage.getItem(LEGACY_START_KEY));
      if(legacy && typeof legacy.id === 'number'){ ownedRegions.add(legacy.id); localStorage.removeItem(LEGACY_START_KEY); savePlayerState(); }
    }catch(e){}
  }
  function savePlayerState(){
    try{
      localStorage.setItem(OWNED_STORAGE_KEY, JSON.stringify([...ownedRegions]));
      localStorage.setItem(BUILDINGS_STORAGE_KEY, JSON.stringify(buildings));
    }catch(e){ console.warn('localStorage indisponible, partie non sauvegardee:', e); }
  }
  const regionFeature = id => regionsFc.features.find(x => x.id === id);
  const ownerOf = id => ownedRegions.has(id) ? 'player' : null;
  const regionBuildings = id => buildings[id] || [];

  // Une interaction en cours (bateau, placement d'un batiment) a priorite
  // sur la selection des regions au clic.
  const interactionBusy = () => placement.active || boat.placing || boat.selected || send.active || caravanSend.active;

  function updateRibbon(){
    const ribbon = document.getElementById('map-ribbon');
    const ids = [...ownedRegions].sort((a, b) => a - b);
    ribbon.textContent = ids.length ? '🏳️ Vos régions : ' + ids.join(', ') : '📍 Achetez une région pour commencer';
  }
  function refreshOwnershipLayers(){
    regionsFc.features.forEach(f => map.setFeatureState({ source:'regions', id:f.id }, { owned:ownedRegions.has(f.id) }));
    if(map.getLayer('capitals-owned')) map.setFilter('capitals-owned', ['in', ['get', 'regionId'], ['literal', [...ownedRegions]]]);
    renderBuildingsLayer();
    updateRibbon();
    if(typeof updateCityHighlights === 'function') updateCityHighlights();
  }

  function selectRegion(id){
    const f = regionFeature(id);
    if(f && f.properties.isNpc && !ownedRegions.has(id)){
      // Region NPC (comptoir de commerce): jamais achetable -- petit message
      // temporaire sur le ruban plutot qu'un refus silencieux.
      const ribbon = document.getElementById('map-ribbon');
      ribbon.textContent = '🟣 Comptoir de commerce -- non disponible à l\'achat';
      clearTimeout(selectRegion._npcTimer);
      selectRegion._npcTimer = setTimeout(updateRibbon, 2200);
      return;
    }
    if(selectedId !== null) map.setFeatureState({ source:'regions', id:selectedId }, { selected:false });
    selectedId = id;
    map.setFeatureState({ source:'regions', id }, { selected:true });
    renderRegionPanel();
  }

  function buyRegion(id){
    const f = regionFeature(id);
    if(!f || f.properties.isNpc || ownerOf(id) !== null) return; // deja possedee: plus achetable
    ownedRegions.add(id);
    savePlayerState();
    refreshOwnershipLayers();
    renderRegionPanel();
  }

  function renderRegionPanel(){
    const panel = document.getElementById('region-panel');
    if(selectedId === null){
      panel.innerHTML = '<div class="region-empty">Cliquez sur une région du globe pour voir ses informations.</div>';
      return;
    }
    const f = regionFeature(selectedId);
    const c = f && f.properties.continent ? CONTINENT_BY_ID[f.properties.continent] : null;
    const contName = c ? c.name : 'Territoire neutre';
    const contColor = c ? c.color : 'var(--paper-alt)';
    const area = f ? Math.round(f.properties.clusterArea || 0).toLocaleString('fr-FR') + ' km²' : '-';
    const owned = ownedRegions.has(selectedId);
    const ports = regionBuildings(selectedId).filter(b => b.type === 'port').length;
    panel.innerHTML =
      '<div class="region-art"><svg viewBox="0 0 300 170"><rect width="300" height="170" fill="' + contColor + '" opacity="0.25"/>' +
        '<path d="M0 130 L40 90 L70 110 L110 60 L150 100 L190 75 L230 115 L260 95 L300 130 V170 H0 Z" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.55"/>' +
        '<circle cx="250" cy="35" r="16" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5"/></svg></div>' +
      '<div><h3 class="region-name hand">Région ' + selectedId + '</h3><div class="region-tagline">' + contName + (c ? ' — ' + c.tagline : '') + '</div></div>' +
      '<div class="region-section-title">Informations de la région</div>' +
      '<div class="region-row"><span>Numéro</span><span class="v">' + selectedId + '</span></div>' +
      '<div class="region-row"><span>Aire</span><span class="v">' + area + '</span></div>' +
      '<div class="region-row"><span>Continent</span><span class="v">' + contName + '</span></div>' +
      '<div class="region-row"><span>Propriétaire</span><span class="v">' + (owned ? 'Vous' : 'Aucun') + '</span></div>' +
      (owned ? '<div class="region-row"><span>Ports</span><span class="v">' + ports + '</span></div>' : '') +
      regionResourcesHtml(selectedId) +
      (owned
        ? '<div class="owned-note">' + iconCheck() + 'Vous possédez cette région.</div>' +
          '<button class="select-btn" id="open-capital-btn">🏛️ OUVRIR LA CAPITALE</button>' +
          '<div class="region-section-title">Test bateau</div><div class="boat-box"><div class="boat-status" id="boat-status"></div><button class="boat-btn" id="boat-place-btn">Placer le bateau</button></div>'
        : '<button class="select-btn" id="buy-btn">' + iconCheck() + 'ACHETER CETTE RÉGION</button>');
    const buy = document.getElementById('buy-btn');
    if(buy) buy.addEventListener('click', () => buyRegion(selectedId));
    const cap = document.getElementById('open-capital-btn');
    if(cap) cap.addEventListener('click', () => openCapital(selectedId));
    const boatBtn = document.getElementById('boat-place-btn');
    if(boatBtn){ boatBtn.addEventListener('click', toggleBoatPlacing); renderBoat(); }
  }

  // Couches: regions possedees (teinte + contour), capitales possedees,
  // batiments construits, apercu de placement. Appele une fois la carte prete.
  function initOwnership(){
    loadPlayerState();
    map.addLayer({ id:'regions-owned', type:'fill', source:'regions',
      paint:{ 'fill-color':'#f2a900', 'fill-opacity':['case', ['boolean', ['feature-state', 'owned'], false], 0.32, 0] } }, 'regions-outline');
    map.addLayer({ id:'regions-owned-outline', type:'line', source:'regions',
      paint:{ 'line-color':'#b8560f', 'line-width':['case', ['boolean', ['feature-state', 'owned'], false], 2.2, 0] } }, 'regions-selected');
    if(map.getSource('villages')){
      map.addLayer({ id:'capitals-owned', type:'circle', source:'villages', filter:['in', ['get', 'regionId'], ['literal', []]],
        paint:{ 'circle-radius':7, 'circle-color':'#f2a900', 'circle-stroke-color':'#3c3527', 'circle-stroke-width':2 } });
      map.on('mouseenter', 'capitals-owned', () => { if(!interactionBusy()) map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'capitals-owned', () => { map.getCanvas().style.cursor = ''; });
    }
    map.addImage('port-icon', drawPortIcon(), { pixelRatio:2 });
    map.addSource('buildings', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'buildings-dir', type:'line', source:'buildings', filter:['==', ['geometry-type'], 'LineString'],
      paint:{ 'line-color':'#1c3d5a', 'line-width':2.5 } });
    const ownLayout = size => ({ 'icon-image':'port-icon', 'icon-size':size, 'icon-allow-overlap':true, 'icon-ignore-placement':true });
    map.addLayer({ id:'buildings-icon', type:'symbol', source:'buildings', filter:portFilter([], false), layout:ownLayout(1) });
    map.addLayer({ id:'buildings-halo', type:'circle', source:'buildings', filter:portFilter([], true), paint:PORT_HALO_PAINT });
    map.addLayer({ id:'buildings-icon-hl', type:'symbol', source:'buildings', filter:portFilter([], true), layout:ownLayout(PORT_HL_SIZE) });
    map.addSource('build-preview', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'build-preview-dir', type:'line', source:'build-preview', filter:['==', ['geometry-type'], 'LineString'],
      paint:{ 'line-color':['case', ['get', 'valid'], '#2f9e44', '#e03131'], 'line-width':3 } });
    map.addLayer({ id:'build-preview', type:'circle', source:'build-preview', filter:['==', ['geometry-type'], 'Point'],
      paint:{ 'circle-radius':10, 'circle-color':['case', ['get', 'valid'], '#2f9e44', '#e03131'], 'circle-opacity':0.85,
        'circle-stroke-color':'#ffffff', 'circle-stroke-width':2.5 } });
    refreshOwnershipLayers();
  }
  function drawPortIcon(color = '#1c3d5a'){
    const c = document.createElement('canvas'); c.width = c.height = 44;
    const g = c.getContext('2d');
    g.fillStyle = color; g.strokeStyle = '#ffffff'; g.lineWidth = 3;
    g.beginPath(); g.arc(22, 22, 18, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = '#ffffff'; g.lineWidth = 2.6; g.lineCap = 'round';
    g.beginPath(); g.arc(22, 13, 3.2, 0, Math.PI * 2); g.stroke();          // anneau
    g.beginPath(); g.moveTo(22, 16.5); g.lineTo(22, 32); g.stroke();        // verge
    g.beginPath(); g.moveTo(15, 21); g.lineTo(29, 21); g.stroke();          // jas
    g.beginPath(); g.arc(22, 25, 8, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); // bras
    return g.getImageData(0, 0, 44, 44);
  }
  function renderBuildingsLayer(){
    if(!map.getSource('buildings')) return;
    const feats = [];
    for(const [rid, list] of Object.entries(buildings)){
      if(!ownedRegions.has(+rid)) continue;
      list.forEach((b, i) => {
        feats.push({ type:'Feature', id:+rid * 100 + i, properties:{ type:b.type, regionId:+rid }, geometry:{ type:'Point', coordinates:b.pos } });
        if(typeof b.bearing === 'number') feats.push({ type:'Feature', properties:{ type:b.type }, geometry:{ type:'LineString', coordinates:[b.pos, offsetKm(b.pos, b.bearing, 30)] } });
      });
    }
    map.getSource('buildings').setData({ type:'FeatureCollection', features:feats });
    updatePortHighlights();
  }

  // ---------- Fenetres de gestion (capitale, comptoir...) a onglets ----------
  // Une fenetre = { title, tabs, ctx, tab }. Pour ajouter un onglet a la
  // capitale: une entree { id, label, render(el, regionId), live? } dans
  // CAPITAL_TABS (live: rafraichi chaque seconde tant qu'il est affiche).
  const CAPITAL_TABS = [
    { id:'construction', label:'Construction', render:renderConstructionTab },
    { id:'caravane', label:'Caravane', render:renderCaravanTab, live:true },
    { id:'voyage', label:'Voyage', render:renderVoyageTab, live:true },
  ];
  let capitalTab = CAPITAL_TABS[0].id, winState = null, winTicker = null;
  function openWindow(state){
    winState = state;
    renderWindow();
    document.getElementById('capital-modal').hidden = false;
    document.getElementById('capital-close').focus();
    clearInterval(winTicker);
    winTicker = setInterval(() => {
      const t = winState && winState.tabs.find(x => x.id === winState.tab);
      if(t && t.live) t.render(document.getElementById('capital-body'), winState.ctx);
    }, 1000);
  }
  function renderWindow(){
    const s = winState; if(!s) return;
    document.getElementById('capital-title').textContent = s.title;
    const tabs = document.getElementById('capital-tabs');
    tabs.innerHTML = '';
    s.tabs.forEach(t => {
      const b = document.createElement('button');
      b.className = 'cap-tab'; b.type = 'button'; b.textContent = t.label; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(t.id === s.tab));
      b.addEventListener('click', () => { s.tab = t.id; if(s.kind === 'capital') capitalTab = t.id; renderWindow(); });
      tabs.appendChild(b);
    });
    const tab = s.tabs.find(t => t.id === s.tab) || s.tabs[0];
    const body = document.getElementById('capital-body');
    body._liveHtml = null;
    tab.render(body, s.ctx);
  }
  function openCapital(regionId){
    if(!ownedRegions.has(regionId)) return;
    openWindow({ kind:'capital', title:'Capitale — Région ' + regionId, tabs:CAPITAL_TABS, ctx:regionId, tab:capitalTab });
  }
  function closeCapital(){ document.getElementById('capital-modal').hidden = true; winState = null; clearInterval(winTicker); }

  // ---------- Batiments (registre modulaire de l'onglet Construction) ----------
  // Pour ajouter un batiment: une entree avec son nom, sa description, sa
  // regle de placement (texte) et sa fonction validate(lonLat, regionId)
  // -> { valid, reason, pos, bearing }. maxPerRegion: null = sans limite.
  const BUILDINGS = [
    { id:'port', name:'Port', icon:'⚓',
      description:'Permet à vos navires d\'accoster et de partir de la région.',
      rule:'Uniquement sur le littoral de la région, tourné vers la mer.',
      maxPerRegion:1,
      available: regionId => coastOf(regionId) !== null || 'Région sans littoral : aucun port possible.',
      validate: validateCoastalPlacement },
  ];
  function renderConstructionTab(el, regionId){
    const built = regionBuildings(regionId);
    el.innerHTML = '<p class="cap-intro">Choisissez un bâtiment, puis placez-le sur la carte. L\'aperçu passe au vert quand l\'emplacement est valide.</p>' +
      '<div class="build-list">' + BUILDINGS.map(b => {
        const count = built.filter(x => x.type === b.id).length;
        const avail = b.available(regionId);
        const full = b.maxPerRegion !== null && count >= b.maxPerRegion;
        const blocked = avail !== true ? avail : (full ? 'Déjà construit dans cette région (' + count + '/' + b.maxPerRegion + ').' : '');
        return '<div class="build-card">' +
          '<div class="build-icon" aria-hidden="true">' + b.icon + '</div>' +
          '<div class="build-text"><div class="build-name">' + b.name + '</div><div class="build-desc">' + b.description + '</div>' +
          '<div class="build-rule">Règle : ' + b.rule + '</div>' +
          (blocked ? '<div class="build-blocked">' + blocked + '</div>' : '') + '</div>' +
          '<button class="boat-btn build-go" type="button" data-building="' + b.id + '"' + (blocked ? ' disabled' : '') + '>Construire</button></div>';
      }).join('') + '</div>' +
      '<div class="region-section-title">Bâtiments de la région</div>' +
      (built.length ? '<ul class="built-list">' + built.map(x => {
        const def = BUILDINGS.find(b => b.id === x.type);
        return '<li>' + (def ? def.icon + ' ' + def.name : x.type) + ' — construit le ' + new Date(x.builtAt).toLocaleDateString('fr-FR') + '</li>';
      }).join('') + '</ul>' : '<p class="cap-empty">Aucun bâtiment pour le moment.</p>');
    el.querySelectorAll('.build-go').forEach(btn => btn.addEventListener('click', () => startPlacement(btn.dataset.building, regionId)));
  }

  // ---------- Littoral d'une region et regle de placement cotier ----------
  // Littoral = arcs de la region qui ne sont partages avec AUCUNE autre
  // region (le reste de son contour est une frontiere terrestre).
  const coastCache = new Map();
  let arcUse = null;
  function coastOf(regionId){
    if(coastCache.has(regionId)) return coastCache.get(regionId);
    if(!arcUse){
      arcUse = new Map();
      const walk = a => Array.isArray(a) ? a.forEach(walk) : arcUse.set(a < 0 ? ~a : a, (arcUse.get(a < 0 ? ~a : a) || 0) + 1);
      regionGeoms.forEach(g => walk(g.arcs));
    }
    const g = regionGeoms[regionId - 1], coastArcs = [];
    const walk = a => Array.isArray(a) ? a.forEach(walk) : (arcUse.get(a < 0 ? ~a : a) === 1 && coastArcs.push(a));
    walk(g.arcs);
    let result = null;
    if(coastArcs.length){
      const f = regionFeature(regionId), ref = turf.centroid(f).geometry.coordinates[0];
      const lines = topojson.feature(regionTopo, { type:'MultiLineString', arcs:coastArcs.map(a => [a]) }).geometry.coordinates
        .map(unwrapRingLongitudes)
        .map(l => { const m = l.reduce((s, p) => s + p[0], 0) / l.length, k = Math.round((ref - m) / 360); return l.map(([x, y]) => [x + k * 360, y]); });
      result = { lines:turf.multiLineString(lines), ref };
    }
    coastCache.set(regionId, result);
    return result;
  }
  // point a distanceKm dans la direction bearing (degres, 0 = nord)
  function offsetKm([lon, lat], bearing, distanceKm){
    const r = bearing * Math.PI / 180;
    return [lon + distanceKm * Math.sin(r) / (111.32 * Math.cos(lat * Math.PI / 180)), lat + distanceKm * Math.cos(r) / 110.57];
  }
  // Aimantation vers la cote: quelques pixels a l'ecran autour du curseur
  // (convertis en km selon le zoom), jamais plus de 40 km -- au-dela, le
  // curseur est clairement dans les terres ou en pleine mer.
  const PORT_SNAP_PX = 14, PORT_SNAP_MAX_KM = 40;
  function snapToleranceKm(lat){ const kmPerPx = 40075 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, map.getZoom())); return Math.min(PORT_SNAP_MAX_KM, Math.max(2, PORT_SNAP_PX * kmPerPx)); }
  const SEA_PROBE_KM = 8;      // rayon de sondage autour du port (terre d'un cote, mer de l'autre)
  // Sondage en etoile autour d'un point de cote: nombre de directions qui
  // tombent dans la region (terre) ou en mer, et direction moyenne de la mer
  // (vers ou le port est tourne).
  function probeCoast(pos, f){
    let sx = 0, sy = 0, sea = 0, land = 0;
    for(let k = 0; k < 16; k++){
      const b = k * 22.5, p = offsetKm(pos, b, SEA_PROBE_KM);
      if(turf.booleanPointInPolygon(p, f)) land++;
      else if(seaNavigator.isSea(...normLonLat(p))){ sea++; sx += Math.sin(b * Math.PI / 180); sy += Math.cos(b * Math.PI / 180); }
    }
    return { sea, land, bearing:(Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360 };
  }
  function validateCoastalPlacement([lon, lat], regionId){
    const coast = coastOf(regionId);
    if(!coast) return { valid:false, reason:'Cette région n\'a pas de littoral.' };
    const f = regionFeature(regionId);
    const cur = [lon + Math.round((coast.ref - lon) / 360) * 360, lat];
    const near = turf.nearestPointOnLine(coast.lines, cur, { units:'kilometers' });
    const pos = near.geometry.coordinates;
    // hors de la region: sur la terre d'une autre region, ou trop loin
    const onOwnLand = turf.booleanPointInPolygon(cur, f);
    if(!onOwnLand && !seaNavigator.isSea(...normLonLat(cur))) return { valid:false, reason:'Hors de votre région.', pos:cur };
    if(near.properties.dist > snapToleranceKm(lat)) return { valid:false, pos:cur,
      reason: onOwnLand ? 'Dans les terres : placez le port au bord de la côte.' : 'En pleine mer : placez le port au bord de la côte.' };
    const { sea, land, bearing } = probeCoast(pos, f);
    if(!sea) return { valid:false, reason:'Aucun accès à la mer ici.', pos };
    if(!land) return { valid:false, reason:'Emplacement entièrement dans l\'eau.', pos };
    const def = BUILDINGS.find(b => b.id === 'port');
    const count = regionBuildings(regionId).filter(b => b.type === 'port').length;
    if(def.maxPerRegion !== null && count >= def.maxPerRegion) return { valid:false, reason:'Un port existe déjà dans cette région.', pos, bearing };
    return { valid:true, reason:'Emplacement valide : sur le littoral, tourné vers la mer.', pos, bearing };
  }

  // ---------- Placement d'un batiment sur la carte ----------
  const placement = { active:false, building:null, regionId:null, last:null, pending:false };
  function startPlacement(buildingId, regionId){
    closeCapital();
    boat.selected = false; boat.placing = false; renderBoat();
    Object.assign(placement, { active:true, building:BUILDINGS.find(b => b.id === buildingId), regionId, last:null, pending:false });
    const f = regionFeature(regionId);
    try{ map.fitBounds(turf.bbox(f), { padding:60, maxZoom:6, duration:800 }); }catch(e){}
    showBuildBar();
    boatHint('Déplacez la souris sur le littoral de la région ' + regionId + ', puis cliquez.');
  }
  function stopPlacement(){
    Object.assign(placement, { active:false, building:null, regionId:null, last:null, pending:false });
    map.getSource('build-preview').setData({ type:'FeatureCollection', features:[] });
    document.getElementById('build-bar').hidden = true;
    map.getCanvas().style.cursor = '';
    boatHint('');
  }
  function drawPreview(res){
    const feats = [];
    if(res.pos){
      feats.push({ type:'Feature', properties:{ valid:res.valid }, geometry:{ type:'Point', coordinates:res.pos } });
      if(typeof res.bearing === 'number') feats.push({ type:'Feature', properties:{ valid:res.valid }, geometry:{ type:'LineString', coordinates:[res.pos, offsetKm(res.pos, res.bearing, 30)] } });
    }
    map.getSource('build-preview').setData({ type:'FeatureCollection', features:feats });
  }
  function showBuildBar(){
    const bar = document.getElementById('build-bar');
    const b = placement.building, r = placement.last;
    bar.hidden = false;
    document.getElementById('build-bar-text').textContent = placement.pending
      ? 'Construire le ' + b.name.toLowerCase() + ' ici ?'
      : (r ? (r.valid ? '✅ ' : '⛔ ') + r.reason : 'Placement : ' + b.name + ' — ' + b.rule);
    document.getElementById('build-confirm').hidden = !placement.pending;
    document.getElementById('build-cancel').textContent = placement.pending ? 'Choisir un autre endroit' : 'Annuler';
  }
  let moveQueued = null;
  function onPlacementMove(e){
    if(!placement.active || placement.pending) return;
    if(moveQueued){ moveQueued = e; return; }
    moveQueued = e;
    requestAnimationFrame(() => { const ev = moveQueued; moveQueued = null; validateAt(ev); });
  }
  function validateAt(e){
    if(!placement.active || placement.pending) return;
    const res = placement.building.validate(normLonLat([e.lngLat.lng, e.lngLat.lat]), placement.regionId);
    placement.last = res;
    drawPreview(res);
    map.getCanvas().style.cursor = res.valid ? 'copy' : 'not-allowed';
    showBuildBar();
  }
  function onPlacementClick(e){
    if(!placement.active || placement.pending) return;
    const res = placement.building.validate(normLonLat([e.lngLat.lng, e.lngLat.lat]), placement.regionId);
    placement.last = res; drawPreview(res);
    if(!res.valid){ showBuildBar(); return; } // construction empechee: la regle n'est pas respectee
    placement.pending = true;
    showBuildBar();
  }
  function confirmPlacement(){
    const r = placement.last;
    if(!placement.pending || !r || !r.valid) return;
    const id = placement.regionId;
    (buildings[id] = buildings[id] || []).push({ type:placement.building.id, pos:r.pos, bearing:Math.round(r.bearing), builtAt:new Date().toISOString() });
    savePlayerState();
    renderBuildingsLayer();
    const name = placement.building.name;
    stopPlacement();
    boatHint(name + ' construit dans la région ' + id + '.');
    setTimeout(() => boatHint(''), 2500);
    if(selectedId === id) renderRegionPanel();
  }

  function initSelection(){
    initOwnership();
    map.on('mousemove', onPlacementMove);
    map.on('click', onPlacementClick);
    map.on('click', (e) => {
      if(interactionBusy() || !map.getLayer('capitals-owned')) return;
      const hit = map.queryRenderedFeatures([[e.point.x - 8, e.point.y - 8], [e.point.x + 8, e.point.y + 8]], { layers:['capitals-owned'] });
      if(hit.length) openCapital(hit[0].properties.regionId);
    });
    document.getElementById('capital-close').addEventListener('click', closeCapital);
    document.getElementById('capital-modal').addEventListener('click', (e) => { if(e.target.id === 'capital-modal') closeCapital(); });
    document.addEventListener('keydown', (e) => {
      if(e.key !== 'Escape') return;
      if(!document.getElementById('capital-modal').hidden) closeCapital();
      else if(placement.active) stopPlacement();
      else if(send.active) cancelSend();
      else if(caravanSend.active) cancelCaravanSend();
    });
    document.getElementById('build-confirm').addEventListener('click', confirmPlacement);
    document.getElementById('build-cancel').addEventListener('click', () => {
      if(placement.pending){ placement.pending = false; showBuildBar(); } else stopPlacement();
    });
    renderRegionPanel();
  }

  // Reset global (onglet Developpeur): efface les regions possedees, les
  // batiments et le bateau, sans recharger la page (le reseau de la carte
  // n'est pas recalcule). Les filtres d'affichage sont conserves.
  function resetGame(){
    try{ [OWNED_STORAGE_KEY, BUILDINGS_STORAGE_KEY, LEGACY_START_KEY, BOAT_STORAGE_KEY, CARAVAN_STORAGE_KEY].forEach(k => localStorage.removeItem(k)); }catch(e){}
    if(placement.active) stopPlacement();
    closeCapital();
    if(selectedId !== null) map.setFeatureState({ source:'regions', id:selectedId }, { selected:false });
    selectedId = null;
    ownedRegions = new Set(); buildings = {};
    boat.pos = null; boat.selected = false; boat.placing = false; boat.voyage = null; send.active = false;
    // un bateau en route s'arrete a la prochaine image
    sailRun++; boat.moving = false; clearTimeout(boatPathTimer); setBoatPath(null); boatHint('');
    hoveredPort.npc = hoveredPort.own = null; updatePortHighlights();
    caravan.pos = null; caravan.voyage = null; caravan.moving = false; caravanRun++; caravanSend.active = false; caravanSend.from = null;
    clearTimeout(caravanPathTimer); setCaravanPath(null); renderCaravan(); hoveredCity.npc = hoveredCity.own = null; updateCityHighlights();
    renderBoat();
    refreshOwnershipLayers();
    renderRegionPanel();
  }
  (function initResetButton(){
    const btn = document.getElementById('dev-reset');
    let armTimer = null;
    const disarm = () => { clearTimeout(armTimer); armTimer = null; btn.classList.remove('confirm'); btn.textContent = 'Réinitialiser la partie'; };
    btn.addEventListener('click', () => {
      if(!armTimer){ // premier clic: demande de confirmation dans le bouton lui-meme
        btn.classList.add('confirm'); btn.textContent = 'Confirmer : tout effacer';
        armTimer = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      if(!regionsFc) return;
      resetGame();
      boatHint('Partie réinitialisée : régions, bâtiments, bateau et caravane effacés.');
      setTimeout(() => boatHint(''), 2500);
    });
  })();

  // ---------- Line chart (shared renderer, used by "Situation mondiale" and "Économie") ----------
  function renderLineChart(svg, legendEl, tipEl, tab){
    svg.innerHTML = '';
    const W = 400, H = tab.h || 170, padL = 34, padR = 12, padT = 12, padB = 22;
    const all = tab.series.flatMap(s => s.values);
    const min = Math.min(...all), max = Math.max(...all);
    const yMin = min - (max-min)*0.15, yMax = max + (max-min)*0.15;
    const x = i => padL + (i/(YEARS.length-1)) * (W-padL-padR);
    const y = v => H-padB - ((v-yMin)/(yMax-yMin)) * (H-padT-padB);

    // grille
    for(let i=0;i<4;i++){
      const gy = padT + (i/3)*(H-padT-padB);
      svg.appendChild(svgEl('line', { x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:'var(--line)', 'stroke-width':1 }));
    }
    YEARS.forEach((yr,i) => {
      const t = svgEl('text', { x:x(i), y:H-6, 'text-anchor':'middle', 'font-size':9, fill:'var(--ink-soft)', 'font-family':'Nunito' });
      t.textContent = yr; svg.appendChild(t);
    });

    tab.series.forEach(s => {
      const d = s.values.map((v,i) => (i===0?'M':'L') + x(i) + ',' + y(v)).join(' ');
      svg.appendChild(svgEl('path', { d, fill:'none', stroke:s.color, 'stroke-width':2.4, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
      s.values.forEach((v,i) => {
        if(i === s.values.length-1) svg.appendChild(svgEl('circle', { cx:x(i), cy:y(v), r:4, fill:s.color }));
      });
    });

    legendEl.innerHTML = tab.series.map(s => '<span><i style="background:' + s.color + '"></i>' + s.name + '</span>').join('');

    // hover crosshair + tooltip
    const hitG = svgEl('g', {});
    svg.appendChild(hitG);
    const guide = svgEl('line', { y1:padT, y2:H-padB, stroke:'var(--ink-soft)', 'stroke-width':1, 'stroke-dasharray':'2,3', opacity:0 });
    hitG.appendChild(guide);
    const dots = tab.series.map(s => { const d = svgEl('circle', { r:4, fill:s.color, opacity:0 }); hitG.appendChild(d); return d; });
    const rect = svgEl('rect', { x:padL, y:padT, width:W-padL-padR, height:H-padT-padB, fill:'transparent' });
    rect.addEventListener('mousemove', (e) => {
      const box = svg.getBoundingClientRect();
      const px = ((e.clientX - box.left) / box.width) * W;
      let idx = Math.round(((px-padL)/(W-padL-padR)) * (YEARS.length-1));
      idx = Math.max(0, Math.min(YEARS.length-1, idx));
      guide.setAttribute('x1', x(idx)); guide.setAttribute('x2', x(idx)); guide.setAttribute('opacity', 1);
      dots.forEach((d,si) => { d.setAttribute('cx', x(idx)); d.setAttribute('cy', y(tab.series[si].values[idx])); d.setAttribute('opacity', 1); });
      tipEl.style.opacity = 1;
      tipEl.style.left = (x(idx)/W*100) + '%';
      tipEl.style.top = (y(Math.max(...tab.series.map(s=>s.values[idx])))/H*100) + '%';
      tipEl.innerHTML = YEARS[idx] + ' — ' + tab.series.map(s => s.name+': '+s.values[idx]).join(' · ');
    });
    rect.addEventListener('mouseleave', () => {
      guide.setAttribute('opacity', 0);
      dots.forEach(d => d.setAttribute('opacity', 0));
      tipEl.style.opacity = 0;
    });
    svg.appendChild(rect);
  }

  // Situation mondiale (tabs)
  const situationTabsEl = document.getElementById('situation-tabs');
  SITUATION_TABS.forEach((t,i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i===0 ? ' active' : '');
    b.textContent = t.label;
    b.addEventListener('click', () => {
      situationTabsEl.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderLineChart(document.getElementById('situation-chart'), document.getElementById('situation-legend'), document.getElementById('chart-tip'), t);
    });
    situationTabsEl.appendChild(b);
  });
  renderLineChart(document.getElementById('situation-chart'), document.getElementById('situation-legend'), document.getElementById('chart-tip'), SITUATION_TABS[0]);

  // ---------- Ranking (vide: pas encore de puissances classees) ----------
  const rankBody = document.getElementById('rank-body');
  if(RANKING.length){
    const maxPower = Math.max(...RANKING.map(r => r.power));
    RANKING.forEach((r,i) => {
      const lightness = 68 - (r.power/maxPower)*30;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="num">' + (i+1) + '</td>' +
        '<td class="rank-name">' + r.flag + ' ' + r.name + '</td>' +
        '<td style="width:50%"><div class="rank-bar-track"><div class="rank-bar-fill" style="width:' + r.power + '%; background:hsl(206,45%,' + lightness + '%)"></div></div></td>' +
        '<td class="num">' + r.power + '%</td>';
      rankBody.appendChild(tr);
    });
  } else {
    rankBody.innerHTML = '<tr><td colspan="4" class="empty-row">Aucune puissance classée pour le moment.</td></tr>';
  }

  // ---------- Events (vide: pas encore d'evenements) ----------
  const eventsList = document.getElementById('events-list');
  if(EVENTS.length){
    EVENTS.forEach(ev => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="ev-icon">' + ev.icon + '</span><span><span class="ev-date">' + ev.date + '</span>' + ev.text + '</span>';
      eventsList.appendChild(li);
    });
  } else {
    eventsList.innerHTML = '<li class="empty-row">Aucun événement pour le moment.</li>';
  }

  // ---------- Clock ----------
  function tickClock(){
    const now = new Date();
    document.getElementById('topbar-time').textContent = now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
  tickClock();
  setInterval(tickClock, 30000);
</script>
